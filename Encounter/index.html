window.addEventListener('message',e=>{
  if(!e.data)return;
  if(e.data.type==='encounterPortraits'){
    const p=e.data.portraits||{},m=e.data.monsters||{};
    Object.values(G.units).forEach(u=>{
      if(u.faction==='party'&&p[u.name]){u._portrait=p[u.name];cacheImg(u.id,u._portrait);}
      if(u.faction==='enemy'&&u._mk&&m[u._mk]){u._portrait=m[u._mk];cacheImg(u.id,u._portrait);}
    });
    renderParty();renderInit();HEX.render();return;
  }
  if(e.data.type==='COMBAT_INIT'){loadCombat(e.data.payload);return;}
});
function signalReady(){try{window.parent.postMessage({type:'encounterReady'},'*');}catch(e){}}
function buildResultPayload(result){
  // Collect current state of every party member
  const partyState = Object.values(G.units)
    .filter(u => u.faction === 'party')
    .map(u => ({
      // Identity (unchanged)
      name:        u.name,
      race:        u.race,
      cls:         u.cls,
      lvl:         u.lvl,
      xp:          (u.xp||0) + Math.floor(G.xpGained / Math.max(1, Object.values(G.units).filter(v=>v.faction==='party').length)),

      // Combat state — updated
      hp:          Math.max(0, u.hp),
      maxhp:       u.max_hp,
      ac:          u._baseAC || u.ac,  // restore base AC (remove charge/shield temp mods)
      alive:       u.alive && u.hp > 0,

      // Stats (unchanged)
      stats:       u.stats,

      // Equipment (unchanged)
      weapon:      u.weapon,
      armor:       u.armor,

      // Spells — update spellsUsed
      spellsKnown: u.spellsKnown || [],
      spellSlots:  u.spellSlots  || 0,
      spellsUsed:  u.spellsUsed  || 0,  // persists into next rest

      // Items — persist qty changes
      items:       (u.items || []).map(it => ({
        name:   it.name,
        qty:    it.qty !== undefined ? it.qty : 1,
        effect: it.effect,
      })),

      // Status — reset combat-only flags, keep persistent ones
      status: {
        defending: false,
        shield:    false,   // spell expires after combat
        sleep:     false,
        blessed:   u.status?.blessed || false,  // could persist
        poisoned:  u.status?.poisoned || false,
      },
    }));

  return {
    result,          // 'win' | 'lose' | 'fled'
    party:    partyState,
    xpGained: G.xpGained,
    xpEach:   Math.floor(G.xpGained / Math.max(1, partyState.filter(p=>p.alive).length)),
    rounds:   G.round,
    // Summary counts
    killed:   Object.values(G.units).filter(u=>u.faction==='enemy'&&(!u.alive||u.hp<=0)).length,
    totalEnemies: Object.values(G.units).filter(u=>u.faction==='enemy').length,
  };
}

function sendResult(r){
  if(!r) r = G.resultToSend || 'win';
  const payload = buildResultPayload(r);
  try { window.parent.postMessage({ type: 'encounterResult', ...payload }, '*'); } catch(e){}
  document.getElementById('result-overlay').style.display = 'none';
}
function loadFromURL(){
  const p=new URLSearchParams(location.search);if(!p.get('party'))return false;
  const pr=JSON.parse(p.get('party')),en=JSON.parse(p.get('enemies')||'[]');
  G.isLive=true;
  loadCombat({party:pr.map((pc,i)=>buildPC(pc,i)),enemies:en.map((n,i)=>buildEnemy(n,i)),map_type:'dungeon'});
  return true;
}
function buildPC(pc,idx){
  const bab=getBAB(pc.cls,pc.lvl);
  const spd=pc.speed_ft||30;
  return{id:`p${idx}`,name:pc.name,race:pc.race,cls:pc.cls,lvl:pc.lvl,xp:pc.xp,
    faction:'party',alive:pc.alive!==false,hp:pc.hp,max_hp:pc.maxhp,
    // In d20: AC is the number attackers must meet or beat
    ac:pc.ac,
    stats:pc.stats,weapon:pc.weapon||null,armor:pc.armor||null,
    status:pc.status||{defending:false,shield:false,sleep:false,blessed:false},
    spellsKnown:pc.spellsKnown||[],spellSlots:pc.spellSlots||0,spellsUsed:pc.spellsUsed||0,
    _speed:spd,_spd:Math.floor(spd/5),  // hexes
    _bab:bab,_portrait:null,
    _baseAC: pc.ac,  // preserve original AC so temp mods don't corrupt return value
    portrait_emoji:{Fighter:'⚔',Paladin:'⚔',Barbarian:'🪓',Cleric:'✝',Druid:'🌿',Mage:'🔮',Wizard:'🔮',Sorcerer:'🔮',Rogue:'🗡',Thief:'🗡',Ranger:'🏹',Monk:'👊'}[pc.cls]||'👤'};
}
function buildEnemy(name,idx){
  const m=MON[name];
  if(!m)return{id:`e${idx}`,name,faction:'enemy',alive:true,hp:8,max_hp:8,ac:12,
    stats:{STR:10,DEX:10,CON:10,INT:6,WIS:6,CHA:6},_bab:0,_speed:30,_spd:6,
    _dmg:[1,6],_strMod:0,portrait_emoji:'👾',spellsKnown:[],spellSlots:0,spellsUsed:0,status:{}};
  const hp=roll(m.hp); const sm=m.strMod||0;
  return{id:`e${idx}`,name:`${name} ${idx+1}`,_mk:name,faction:'enemy',alive:true,
    hp,max_hp:hp,ac:m.ac,stats:{STR:10+sm*2,DEX:10,CON:12,INT:6,WIS:8,CHA:6},
    _bab:m.bab||0,_speed:30,_spd:6,_dmg:m.dmg,_strMod:sm,_xp:m.xp||100,
    _poison:m.poison||false,portrait_emoji:m.e||'👾',
    spellsKnown:[],spellSlots:0,spellsUsed:0,status:{}};
}

// ═══════════════════════════════════════════════════════
// HEX MAP — smaller: 14×10
// ═══════════════════════════════════════════════════════
const HEX={
  get sz(){
    // Measure the actual map-wrap container so we fill it precisely
    const wrap = document.getElementById('map-wrap');
    let aw, ah;
    if(wrap){
      const r = wrap.getBoundingClientRect();
      aw = r.width  || wrap.offsetWidth;
      ah = r.height || wrap.offsetHeight;
    } else {
      // Fallback before DOM ready
      const panelW = desk() ? 220+300 : 0;
      aw = (isPortrait() ? window.innerHeight : window.innerWidth) - panelW;
      ah = window.innerHeight - 36 - 34 - 56 - 52;
    }
    // Reserve space for the initiative bar (56px) and log (80px)
    const usableH = ah - 56 - 80;
    // Fit 14 cols horizontally, 10 rows vertically — pick the binding dimension
    const szW = Math.floor((aw   - 8) / (G.cols * 1.74 + 0.5));
    const szH = Math.floor((usableH - 8) / (G.rows * 1.52 + 0.6));
    const auto = Math.min(szW, szH);
    // Desktop: much larger hexes; mobile: smaller
    return Math.max(desk()?44:28, Math.min(desk()?88:46, auto));
  },
  cv:null,ctx:null,hov:null,
  // Passable floor tiles — semi-transparent so texture shows through
  // Impassable tiles — opaque dark to block/tint the texture underneath
  TF:{
    // passable — low alpha overlays (texture bleeds through)
    stone:       'rgba(20,18,32,.18)',
    stone_worn:  'rgba(16,14,26,.22)',
    stone_crack: 'rgba(14,12,22,.28)',
    carpet:      'rgba(40,14,32,.45)',
    altar:       'rgba(26,10,38,.42)',
    rubble:      'rgba(20,28,14,.35)',
    // impassable — opaque dark tint blocks the texture
    wall:        'rgba(4,4,10,.88)',
    wall_thick:  'rgba(2,2,8,.96)',
    pillar:      'rgba(28,16,8,.90)',
    crate:       'rgba(22,16,8,.85)',
    barrel:      'rgba(18,10,6,.85)',
    pit:         'rgba(2,2,8,.97)',
  },
  // Stroke colours — tile border lines
  TS:{
    stone:       'rgba(38,34,54,.55)',
    stone_worn:  'rgba(32,28,46,.5)',
    stone_crack: 'rgba(28,24,40,.5)',
    carpet:      'rgba(60,24,44,.6)',
    altar:       'rgba(48,18,56,.6)',
    rubble:      'rgba(32,42,22,.55)',
    wall:        'rgba(20,18,28,.9)',
    wall_thick:  'rgba(14,12,20,.95)',
    pillar:      'rgba(56,40,18,.9)',
    crate:       'rgba(48,36,16,.85)',
    barrel:      'rgba(44,28,12,.85)',
    pit:         'rgba(10,8,20,.95)',
  },
  PASS:new Set(['stone','stone_worn','stone_crack','carpet','altar','rubble']),

  init(){
    this.cv=document.getElementById('hex-canvas');this.ctx=this.cv.getContext('2d');
    this.cv.addEventListener('mousemove',e=>this.onMM(e));
    this.cv.addEventListener('click',e=>this.onCk(e));
    this.cv.addEventListener('mouseleave',()=>{this.hov=null;this.render();});
    this.cv.addEventListener('touchstart',e=>this._ts(e),{passive:false});
    this.cv.addEventListener('touchend',e=>this._te(e),{passive:false});
    window.addEventListener('resize',()=>{setTimeout(()=>{this.resize();this.render();},50);});
    window.addEventListener('orientationchange',()=>{setTimeout(()=>{this.resize();this.render();},300);});
    this.build();this.resize();this.render();
  },
  resize(){
    const s=this.sz;
    this.cv.width =Math.ceil(G.cols*s*1.74+s*.5);
    this.cv.height=Math.ceil(G.rows*s*1.52+s*.6);
    // Also set CSS size so canvas fills the container
    // object-fit:contain on the CSS side keeps aspect ratio
    this.cv.style.width  = '100%';
    this.cv.style.height = '100%';
    this.generateFloorTexture();
    // Sync anim canvas
    const ac = document.getElementById('anim-canvas');
    if(ac){ ac.width=this.cv.width; ac.height=this.cv.height;
            ac.style.width='100%'; ac.style.height='100%'; }
  },

  // ── Procedural stone dungeon floor — drawn once, reused every frame ──
  generateFloorTexture(){
    const w=this.cv.width,h=this.cv.height;
    const fc=document.createElement('canvas');
    fc.width=w;fc.height=h;
    const fx=fc.getContext('2d');

    // ── Base fill: dark stone colour ──
    fx.fillStyle='#0e0d14';fx.fillRect(0,0,w,h);

    // ── Pixel-level noise pass (grain) ──
    // Use a seeded pseudo-random for stability
    const rand=(x,y)=>{let n=Math.sin(x*127.1+y*311.7)*43758.5453;return n-Math.floor(n);};
    const imgd=fx.createImageData(w,h);
    const px=imgd.data;
    for(let y2=0;y2<h;y2++){
      for(let x2=0;x2<w;x2++){
        const i=(y2*w+x2)*4;
        const n=rand(x2,y2);
        // Base stone colour: very dark grey-purple, modulated by noise
        const base=10+Math.floor(n*14);  // 10–24
        px[i]=base+2;      // R (slight warm)
        px[i+1]=base;      // G
        px[i+2]=base+4;    // B (slight cool)
        px[i+3]=255;
      }
    }
    fx.putImageData(imgd,0,0);

    // ── Large flagstone blocks ──
    // Offset rows so joints don't align (brick pattern)
    const bs=Math.round(this.sz*2.4);  // block size ~2.4 hex radii
    for(let row=0;row*bs<h+bs;row++){
      const offset=(row%2===0)?0:bs*.55;
      for(let col=0;col*bs<w+bs;col++){
        const bx=col*bs+offset-bs*.1;
        const by=row*bs;
        // Slight jitter per block
        const jx=(rand(col,row)-.5)*6;
        const jy=(rand(col+100,row+200)-.5)*4;
        const bw=bs*.92+(rand(col*3,row*7)-.5)*4;
        const bh=bs*.88+(rand(col*5,row*3)-.5)*3;

        // Stone block fill — each block slightly different shade
        const shade=Math.floor(rand(col*7,row*11)*18); // 0–17
        const r=14+shade, g=13+shade, b=20+shade;
        fx.fillStyle=`rgb(${r},${g},${b})`;
        fx.fillRect(bx+jx,by+jy,bw,bh);

        // Surface texture on each block: subtle noise streaks
        fx.save();fx.globalAlpha=.06+rand(col,row)*.08;
        for(let streak=0;streak<3;streak++){
          const sy=by+jy+rand(col,row+streak*37)*bh;
          fx.fillStyle=rand(col+streak,row)>.5?'#fff':'#000';
          fx.fillRect(bx+jx,sy,bw,0.8+rand(col+streak*2,row)*1.5);
        }
        fx.restore();

        // Occasional worn/cracked stone — darker patch
        if(rand(col*13,row*17)>.82){
          fx.save();fx.globalAlpha=.18+rand(col,row)*.12;
          fx.fillStyle='#050408';
          const cx2=bx+jx+rand(col,row)*bw*.6+bw*.2;
          const cy2=by+jy+rand(col+1,row+1)*bh*.6+bh*.2;
          fx.beginPath();fx.ellipse(cx2,cy2,rand(col*2,row*3)*bw*.3+4,rand(col*3,row*2)*bh*.2+3,rand(col,row)*Math.PI,0,Math.PI*2);
          fx.fill();fx.restore();
        }

        // Moss/age spots — green-grey tint
        if(rand(col*19,row*23)>.88){
          fx.save();fx.globalAlpha=.1+rand(col,row)*.08;
          fx.fillStyle='#1a2214';
          const mx=bx+jx+rand(col+2,row+3)*bw;
          const my=by+jy+rand(col+3,row+2)*bh;
          fx.beginPath();fx.arc(mx,my,rand(col,row)*8+3,0,Math.PI*2);
          fx.fill();fx.restore();
        }

        // Block mortar lines — dark thin lines at edges
        fx.strokeStyle=`rgba(6,5,10,${.55+rand(col,row)*.25})`;
        fx.lineWidth=1+rand(col*2,row*3)*.8;
        fx.strokeRect(bx+jx+.5,by+jy+.5,bw-1,bh-1);
      }
    }

    // ── Debris decals: cracks, bone fragments ──
    const numDebris=Math.floor(w*h/8000);
    for(let i=0;i<numDebris;i++){
      const dx=rand(i,i*2)*w, dy=rand(i*3,i*4)*h;
      const type=rand(i*5,i*6);
      fx.save();fx.globalAlpha=.12+rand(i,i+1)*.14;
      if(type<.4){
        // Crack line
        fx.strokeStyle='#050408';fx.lineWidth=.8;
        fx.beginPath();fx.moveTo(dx,dy);
        let cx2=dx,cy2=dy;
        for(let seg=0;seg<4+rand(i,i+2)*3;seg++){
          cx2+=( rand(i+seg,i+10)-.5)*16;
          cy2+=(rand(i+seg+5,i+15)-.5)*10;
          fx.lineTo(cx2,cy2);
        }
        fx.stroke();
      } else if(type<.65){
        // Small pebble
        fx.fillStyle=`rgb(${18+rand(i,i+3)*12|0},${16+rand(i+1,i+4)*10|0},${22+rand(i+2,i+5)*14|0})`;
        fx.beginPath();fx.ellipse(dx,dy,rand(i,i+2)*3+1,rand(i+1,i+3)*2+1,rand(i,i+1)*Math.PI,0,Math.PI*2);
        fx.fill();
      } else if(type<.8){
        // Bone fragment
        fx.strokeStyle='#c8c4a8';fx.lineWidth=1.2;
        fx.beginPath();fx.moveTo(dx-4,dy);fx.lineTo(dx+4,dy);fx.stroke();
        fx.beginPath();fx.arc(dx-4,dy,1.5,0,Math.PI*2);fx.fillStyle='#c8c4a8';fx.fill();
        fx.beginPath();fx.arc(dx+4,dy,1.5,0,Math.PI*2);fx.fill();
      }
      // else: skip (just empty)
      fx.restore();
    }

    // ── Edge vignette baked into texture ──
    const vg2=fx.createRadialGradient(w/2,h/2,Math.min(w,h)*.2,w/2,h/2,Math.max(w,h)*.75);
    vg2.addColorStop(0,'rgba(0,0,0,0)');
    vg2.addColorStop(.7,'rgba(0,0,0,.1)');
    vg2.addColorStop(1,'rgba(0,0,0,.55)');
    fx.fillStyle=vg2;fx.fillRect(0,0,w,h);

    this._floorCanvas=fc;
  },
  build(){
    G.map={};const c=G.cols,r=G.rows;
    for(let q=0;q<c;q++)for(let ri=0;ri<r;ri++){
      const k=`${q},${ri}`,edge=q<1||ri<1||q>c-2||ri>r-2;
      const t=edge?'wall_thick':(['stone','stone','stone','stone_worn','stone_crack'][~~(Math.random()*5)]);
      G.map[k]={q,r:ri,terrain:t,pass:!edge&&this.PASS.has(t),unit:null,hl:null,lbl:null};
    }
    // A couple of pillars for cover — not too many on small map
    [[3,3],[3,6],[10,3],[10,6]].forEach(([q,ri])=>{
      const k=`${q},${ri}`;if(G.map[k]){G.map[k].terrain='pillar';G.map[k].pass=false;G.map[k].lbl='◆';}
    });
    // A few barrels
    [[5,2],[5,7],[8,2],[8,7]].forEach(([q,ri])=>{
      const t=Math.random()>.5?'crate':'barrel';
      const k=`${q},${ri}`;if(G.map[k]){G.map[k].terrain=t;G.map[k].pass=false;G.map[k].lbl=t==='crate'?'▪':'○';}
    });
    // Altar far side
    const ak=`${c-2},${~~(r/2)}`;if(G.map[ak]){G.map[ak].terrain='altar';G.map[ak].pass=true;G.map[ak].lbl='✝';}
    // Carpet centre strip
    for(let q=2;q<c-2;q++){const k=`${q},${~~(r/2)}`;if(G.map[k]&&G.map[k].pass)G.map[k].terrain='carpet';}
    // Regenerate floor texture to match new canvas size
    if(this.cv&&this.cv.width>0)this.generateFloorTexture();
  },

  ctr(q,ri){
    const s=this._cachedSz||this.sz,off=ri%2===0?0:s*.866;
    return{x:q*s*1.732+off+s*.9,y:ri*s*1.5+s*.82};
  },
  hexAt(px,py){
    let best=null,bd=Infinity;const s=this.sz;
    for(const k in G.map){
      const[q,ri]=k.split(',').map(Number);
      const{x,y}=this.ctr(q,ri);
      const d2=Math.hypot(x-px,y-py);
      if(d2<bd){bd=d2;best=k;}
    }
    return bd<s*1.15?best:null;
  },
  dHex(cx,cy,sz,fill,stroke,sw=.5){
    const ctx=this.ctx;ctx.beginPath();
    for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;i===0?ctx.moveTo(cx+sz*Math.cos(a),cy+sz*Math.sin(a)):ctx.lineTo(cx+sz*Math.cos(a),cy+sz*Math.sin(a));}
    ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke();
  },
  render(){
    const ctx=this.ctx;
    if(!ctx)return;
    if(this.cv.width<10||this.cv.height<10){this.resize();if(this.cv.width<10)return;}
    const s=this._cachedSz=this.sz;
    if(!s||s<4)return;
    ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
    ctx.shadowBlur=0;ctx.shadowColor='transparent';
    ctx.setTransform(1,0,0,1,0,0);
    const t=Date.now()/1000;

    // ── Layer 0: baked stone floor texture ──
    if(this._floorCanvas){
      ctx.drawImage(this._floorCanvas,0,0);
    } else {
      ctx.fillStyle='#0e0d14';ctx.fillRect(0,0,this.cv.width,this.cv.height);
    }

    for(const k in G.map){
      const h=G.map[k];const{x,y}=this.ctr(h.q,h.r);

      // Tile fill — passable tiles semi-transparent (texture shows through)
      let fill=this.TF[h.terrain]||'rgba(14,12,22,.25)';
      let stroke=this.TS[h.terrain]||'rgba(30,26,44,.5)',sw=.5;

      // ── Highlight overlays ──
      if(h.hl==='move'){
        fill='rgba(39,174,96,.22)';stroke='#27ae60';sw=1.3;
      } else if(h.hl==='charge'){
        fill='rgba(230,126,34,.22)';stroke='#e67e22';sw=1.3;
      } else if(h.hl==='atk'){
        const pulse=.18+Math.sin(t*4)*0.07;
        fill=`rgba(192,57,43,${pulse})`;stroke='#c0392b';sw=1.4;
      } else if(h.hl==='sel'){
        const pulse=.18+Math.sin(t*3)*0.06;
        fill=`rgba(162,105,215,${pulse})`;stroke='#a869d7';sw=1.4;
      }
      if(k===this.hov&&h.pass&&!h.unit){
        fill='rgba(255,255,255,.07)';stroke='rgba(200,162,74,.6)';sw=.9;
      }

      this.dHex(x,y,s-.5,fill,stroke,sw);

      // ── Textured highlights ──
      if(h.hl==='move'&&h.pass&&!h.unit){
        // Footprint dots pattern
        ctx.save();ctx.globalAlpha=.25;
        [[-.25,-.15],[.22,.18],[-.1,.3]].forEach(([dx,dy])=>{
          ctx.beginPath();ctx.arc(x+dx*s,y+dy*s,s*.07,0,Math.PI*2);
          ctx.fillStyle='#27ae60';ctx.fill();
        });
        ctx.restore();
      }

      if(h.hl==='charge'&&h.pass&&!h.unit){
        // Speed-streak chevron
        ctx.save();ctx.globalAlpha=.22;ctx.strokeStyle='#e67e22';ctx.lineWidth=1.2;
        for(let i=0;i<3;i++){
          ctx.beginPath();
          ctx.moveTo(x-s*.3+i*s*.2,y-s*.25);
          ctx.lineTo(x-s*.08+i*s*.2,y);
          ctx.lineTo(x-s*.3+i*s*.2,y+s*.25);
          ctx.stroke();
        }
        ctx.restore();
      }

      if(h.hl==='atk'&&h.unit&&G.units[h.unit]){
        // Pulsing crosshair ring on attackable targets
        const pulse2=.5+Math.sin(t*5)*.5;
        ctx.save();
        // Outer ring
        ctx.beginPath();ctx.arc(x,y-3,s*.55+Math.sin(t*4)*2,0,Math.PI*2);
        ctx.strokeStyle=`rgba(231,76,60,${.5+pulse2*.4})`;ctx.lineWidth=1.8;ctx.stroke();
        // Crosshair ticks
        ctx.strokeStyle=`rgba(231,76,60,${.6+pulse2*.3})`;ctx.lineWidth=1.2;
        [[0,-1],[0,1],[1,0],[-1,0]].forEach(([dx,dy])=>{
          const or=s*.62,ir=s*.5;
          ctx.beginPath();ctx.moveTo(x+dx*ir,y-3+dy*ir);ctx.lineTo(x+dx*or,y-3+dy*or);ctx.stroke();
        });
        ctx.restore();
      }

      if(h.hl==='sel'&&h.unit&&G.units[h.unit]){
        // Arcane spell circle
        const rot=t*.8;
        ctx.save();ctx.globalAlpha=.35;ctx.translate(x,y-3);ctx.rotate(rot);
        ctx.beginPath();ctx.arc(0,0,s*.55,0,Math.PI*2);
        ctx.strokeStyle='#a869d7';ctx.lineWidth=1;ctx.setLineDash([4,3]);ctx.stroke();
        ctx.setLineDash([]);
        // 4 rune-dots on circle
        for(let i=0;i<4;i++){
          const a=Math.PI/2*i;
          ctx.beginPath();ctx.arc(Math.cos(a)*s*.55,Math.sin(a)*s*.55,2.5,0,Math.PI*2);
          ctx.fillStyle='#c8a0e8';ctx.fill();
        }
        ctx.restore();
      }

      // Threat zone hatching
      if(h.hl==='threat'){
        ctx.save();ctx.beginPath();
        for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;i===0?ctx.moveTo(x+s*.5*Math.cos(a),y+s*.5*Math.sin(a)):ctx.lineTo(x+s*.5*Math.cos(a),y+s*.5*Math.sin(a));}
        ctx.closePath();ctx.clip();
        ctx.strokeStyle='rgba(192,57,43,.14)';ctx.lineWidth=1;
        for(let i=-s;i<s*2;i+=5){ctx.beginPath();ctx.moveTo(x-s+i,y-s);ctx.lineTo(x-s+i+s*2,y+s);ctx.stroke();}
        ctx.restore();
        ctx.beginPath();
        for(let i=0;i<6;i++){const a=Math.PI/3*i-Math.PI/6;i===0?ctx.moveTo(x+(s-.5)*Math.cos(a),y+(s-.5)*Math.sin(a)):ctx.lineTo(x+(s-.5)*Math.cos(a),y+(s-.5)*Math.sin(a));}
        ctx.closePath();ctx.strokeStyle='rgba(192,57,43,.3)';ctx.lineWidth=.8;ctx.stroke();
      }

      // Labels — disabled (◆ pillar symbol was appearing in corners)
      // if(h.lbl&&!h.unit){
      //   ctx.fillStyle='rgba(155,135,95,.52)';ctx.font=`${~~(s*.34)}px serif`;
      //   ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(h.lbl,x,y);
      // }
      if(h.unit&&G.units[h.unit])this.drawU(x,y,s,G.units[h.unit]);
    }

    // Soft real-time vignette (keeps animated highlights readable)
    const vg=ctx.createRadialGradient(this.cv.width/2,this.cv.height/2,this.cv.width*.3,this.cv.width/2,this.cv.height/2,this.cv.width*.72);
    vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.28)');
    ctx.fillStyle=vg;ctx.fillRect(0,0,this.cv.width,this.cv.height);

    const hasAnim=Object.values(G.map).some(h=>h.hl==='atk'||h.hl==='sel');
    if(hasAnim&&!this._animFrame){
      this._animFrame=requestAnimationFrame(()=>{this._animFrame=null;this.render();});
    } else if(!hasAnim&&this._animFrame){
      cancelAnimationFrame(this._animFrame);this._animFrame=null;
    }
  },
  drawU(x,y,s,u){
    const ctx=this.ctx;
    ctx.save(); // ← wrap entire unit draw so alpha/shadow never leak
    const isAct=G.order[G.turn]===u.id;
    const isSel=G.sel===u.id;
    const isEnemy=u.faction==='enemy';
    const dead=!u.alive||u.hp<=0;
    if(dead)ctx.globalAlpha=.22;

    // Active unit glow hex
    if(isAct&&!dead){
      ctx.save();
      const gc=isEnemy?'#e74c3c':'#e8c870';
      ctx.shadowColor=gc;ctx.shadowBlur=22;
      // Outer hex ring
      this.dHex(x,y,s+1,'transparent',gc,2);
      ctx.shadowBlur=0;
      // Inner fill flash
      this.dHex(x,y,s-1,`rgba(${isEnemy?'192,57,43':'200,162,74'},.06)`,gc,1.5);
      ctx.restore();
    }
    // Charge glow
    if(u.status?.charged&&!dead){
      ctx.save();ctx.shadowColor='#e67e22';ctx.shadowBlur=14;
      this.dHex(x,y,s+2,'transparent','#e67e22',1.5);ctx.restore();
    }
    // Selected ring
    if(isSel&&!dead){
      ctx.save();
      this.dHex(x,y,s,'transparent','rgba(200,162,74,.7)',2.5);
      ctx.restore();
    }

    const cr=s*.5;
    // Drop shadow beneath unit
    ctx.save();ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=8;ctx.shadowOffsetY=2;
    ctx.beginPath();ctx.arc(x,y-2,cr,0,Math.PI*2);
    // Background plate
    const plateFill=isEnemy
      ? (dead?'rgba(80,20,10,.5)':'rgba(140,30,20,.92)')
      : (dead?'rgba(10,20,50,.5)':'rgba(20,55,130,.92)');
    ctx.fillStyle=plateFill;ctx.fill();ctx.restore();

    // Border ring
    const ringCol=isSel?'#c8a24a':(isEnemy?'#e74c3c':'#5dade2');
    ctx.beginPath();ctx.arc(x,y-2,cr,0,Math.PI*2);
    ctx.strokeStyle=ringCol;ctx.lineWidth=isAct?2:1;ctx.stroke();

    // Portrait image or emoji — draw even when dead (alpha already lowered)
    if(u._portrait&&_imgC[u.id]?.complete){
      try{
        ctx.save();
        ctx.imageSmoothingEnabled=true;
        ctx.imageSmoothingQuality='high';
        ctx.beginPath();ctx.arc(x,y-2,cr-1,0,Math.PI*2);ctx.clip();
        // Draw centred and cover (like object-fit:cover) — no stretching
        const img=_imgC[u.id];
        const iw=img.naturalWidth||img.width||256;
        const ih=img.naturalHeight||img.height||256;
        const d=(cr-1)*2; // dest size (diameter)
        // scale so shorter side fills diameter
        const scale=Math.max(d/iw,d/ih);
        const sw=d/scale, sh=d/scale;
        const sx=(iw-sw)/2, sy=(ih-sh)/2;
        ctx.drawImage(img, sx,sy,sw,sh, x-cr+1,y-cr-1,d,d);
        ctx.restore();
        // Inner vignette on portrait
        ctx.save();ctx.beginPath();ctx.arc(x,y-2,cr-1,0,Math.PI*2);ctx.clip();
        const ig=ctx.createRadialGradient(x,y-2,cr*.5,x,y-2,cr);
        ig.addColorStop(0,'rgba(0,0,0,0)');ig.addColorStop(1,'rgba(0,0,0,.3)');
        ctx.fillStyle=ig;ctx.fill();ctx.restore();
      }catch(e){}
    } else {
      // Emoji / skull
      const emo=dead?'☠':(u.portrait_emoji||u.name[0]);
      ctx.fillStyle=dead?'#e07070':'#fff';
      ctx.font=`bold ${~~(s*.38)}px serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(emo,x,y-2);
    }

    // HP arc (thick, outside ring)
    const pct=Math.max(0,u.hp/u.max_hp);
    const hcol=pct>.5?'#27ae60':pct>.25?'#e67e22':'#e74c3c';
    // Track (grey)
    ctx.beginPath();ctx.arc(x,y-2,cr+3.5,0,Math.PI*2);
    ctx.strokeStyle='rgba(0,0,0,.4)';ctx.lineWidth=3;ctx.stroke();
    // Fill
    if(pct>0){
      ctx.beginPath();ctx.arc(x,y-2,cr+3.5,-Math.PI/2,-Math.PI/2+Math.PI*2*pct);
      ctx.strokeStyle=hcol;ctx.lineWidth=3;
      ctx.shadowColor=hcol;ctx.shadowBlur=4;ctx.stroke();ctx.shadowBlur=0;
    }

    // Status icons — small badge circles
    const badges=[];
    if(u.status?.sleep)badges.push({ico:'💤',col:'#7090d0'});
    if(u.status?.charged)badges.push({ico:'⚡',col:'#e67e22'});
    if(u.status?.held)badges.push({ico:'🔒',col:'#e07070'});
    if(u.status?.defending)badges.push({ico:'🛡',col:'#5dade2'});
    badges.forEach((b,i)=>{
      const bx=x+cr*.6*(i%2===0?1:-1);
      const by=y-2-cr*.6-(i>1?cr*.5:0);
      ctx.beginPath();ctx.arc(bx,by,s*.18,0,Math.PI*2);
      ctx.fillStyle=`rgba(10,10,16,.85)`;ctx.fill();
      ctx.strokeStyle=b.col;ctx.lineWidth=1;ctx.stroke();
      ctx.font=`${~~(s*.22)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(b.ico,bx,by);
    });

    // Name tag (pill shape)
    const nw=Math.min(u.name.length*5.2+10,s*2.5);
    const ny=y+cr+2;
    ctx.fillStyle=isEnemy?'rgba(30,5,5,.9)':'rgba(5,10,30,.9)';
    // Pill
    ctx.beginPath();
    const rx=x-nw/2,ry=ny,rw=nw,rh=13,rr=3;
    ctx.moveTo(rx+rr,ry);ctx.lineTo(rx+rw-rr,ry);ctx.quadraticCurveTo(rx+rw,ry,rx+rw,ry+rr);
    ctx.lineTo(rx+rw,ry+rh-rr);ctx.quadraticCurveTo(rx+rw,ry+rh,rx+rw-rr,ry+rh);
    ctx.lineTo(rx+rr,ry+rh);ctx.quadraticCurveTo(rx,ry+rh,rx,ry+rh-rr);
    ctx.lineTo(rx,ry+rr);ctx.quadraticCurveTo(rx,ry,rx+rr,ry);ctx.closePath();ctx.fill();
    ctx.strokeStyle=isEnemy?'rgba(231,76,60,.35)':'rgba(93,173,226,.35)';ctx.lineWidth=.6;ctx.stroke();
    ctx.fillStyle=isEnemy?'#f09090':'#90c8e8';
    ctx.font=`${~~(s*.24)}px "Cinzel",serif`;ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(u.name.substring(0,14),x,ny+1);

    // Active-turn indicator arrow above unit
    if(isAct&&!dead&&u.faction==='party'){
      const ay=y-cr-10;
      ctx.fillStyle='#e8c870';ctx.shadowColor='#e8c870';ctx.shadowBlur=6;
      ctx.beginPath();ctx.moveTo(x,ay+6);ctx.lineTo(x-4,ay);ctx.lineTo(x+4,ay);ctx.closePath();
      ctx.fill();ctx.shadowBlur=0;
    }

    ctx.restore(); // ← always restore — clears alpha, shadow, transforms
  },
  clearHL(){for(const k in G.map)G.map[k].hl=null;},
  // Auto-highlight: move + charge ranges at turn start
  hlTurnStart(uid){
    this.clearHL();
    const u=G.units[uid];if(!u||!u.hex)return;
    const spd=u._spd||6;
    for(const k in G.map){
      const h=G.map[k];const dist=hDist(u.hex,k);
      if(!h.pass||h.unit)continue;
      if(dist<=spd)h.hl='move';
      else if(dist<=spd*2)h.hl='charge';
    }
    // Overlay threat zones (show after movement range)
    hlThreatZones();
    this.render();
  },
  hlAtk(uid){
    const u=G.units[uid];if(!u||!u.hex)return;
    // Use bestWeapon to highlight all reachable enemies (any weapon)
    const enemies=Object.values(G.units).filter(v=>v.faction!==u.faction&&v.alive&&v.hp>0&&v.hex);
    for(const k in G.map){
      const h=G.map[k];
      if(!h.unit)continue;
      const tgt=G.units[h.unit];
      if(!tgt||tgt.faction===u.faction||!tgt.alive||tgt.hp<=0)continue;
      const chosen=bestWeapon(u,tgt);
      if(!chosen.outOfRange) h.hl='atk';
    }
    this.render();
  },
  hlSpell(uid,spellRange){
    const u=G.units[uid];if(!u||!u.hex)return;
    const rng=spellRange>0?Math.floor(spellRange/5):999;
    for(const k in G.map){
      const h=G.map[k];
      if(h.unit&&G.units[h.unit]&&G.units[h.unit].faction!==u.faction&&(rng>=999||hDist(u.hex,k)<=rng))h.hl='atk';
    }
    this.render();
  },
  hlAlly(uid,spellRange){
    const u=G.units[uid];if(!u||!u.hex)return;
    const rng=spellRange>0?Math.floor(spellRange/5):999;
    for(const k in G.map){
      const h=G.map[k];
      if(h.unit&&G.units[h.unit]&&G.units[h.unit].faction==='party'&&(rng>=999||hDist(u.hex,k)<=rng))h.hl='sel';
    }
    this.render();
  },
  onMM(e){
    if(mob())return;
    const rect=this.cv.getBoundingClientRect(),sx=this.cv.width/rect.width,sy=this.cv.height/rect.height;
    const k=this.hexAt((e.clientX-rect.left)*sx,(e.clientY-rect.top)*sy);
    if(k!==this.hov){this.hov=k;this.render();}
    updateHexPreview(k,e.clientX,e.clientY);
    if(k&&G.map[k]?.unit){const u=G.units[G.map[k].unit];if(u)showTT(u,e.clientX,e.clientY);}else hideTT();
  },
  onCk(e){
    if(mob())return;
    const rect=this.cv.getBoundingClientRect(),sx=this.cv.width/rect.width,sy=this.cv.height/rect.height;
    const k=this.hexAt((e.clientX-rect.left)*sx,(e.clientY-rect.top)*sy);
    if(k)hexClick(k);
  },
  _ts(e){if(e.touches.length===1){this._tx=e.touches[0].clientX;this._ty=e.touches[0].clientY;this._tt=Date.now();}},
  _te(e){
    if(e.changedTouches.length===1){
      const t=e.changedTouches[0];
      if(Math.hypot(t.clientX-this._tx,t.clientY-this._ty)<14&&Date.now()-this._tt<400){
        e.preventDefault();
        const rect=this.cv.getBoundingClientRect(),sx=this.cv.width/rect.width,sy=this.cv.height/rect.height;
        const k=this.hexAt((t.clientX-rect.left)*sx,(t.clientY-rect.top)*sy);
        if(k)hexClick(k);
      }
    }
  },
};

const _imgC={};
function cacheImg(id,url){
  if(!url)return;
  const i=new Image();
  // Request 256px version if URL supports size params (e.g. ?s=256)
  // Otherwise load as-is — the canvas drawImage will handle scaling without stretching
  i.src=url;
  i.width=256;i.height=256;  // hint natural size; doesn't stretch — canvas clips to circle
  _imgC[id]=i;
  // Re-render when image loads so portrait appears
  i.onload=()=>{HEX.render();renderParty();renderInit();};
}
function hDist(a,b){
  const[q1,r1]=a.split(',').map(Number),[q2,r2]=b.split(',').map(Number),s1=-q1-r1,s2=-q2-r2;
  return(Math.abs(q1-q2)+Math.abs(r1-r2)+Math.abs(s1-s2))/2;
}

// UI RENDERING
// ═══════════════════════════════════════════════════════
function hpCol(p){return p>.6?'#27ae60':p>.3?'#e67e22':'#e74c3c';}

function renderParty(){
  const el=document.getElementById('char-list');
  const party=Object.values(G.units).filter(u=>u.faction==='party');
  if(!party.length){el.innerHTML='<div style="padding:20px 8px;color:var(--text3);text-align:center;font-size:11px;font-style:italic">No party loaded.</div>';return;}
  const activeTurnId=G.order[G.turn];
  el.innerHTML=party.map(u=>{
    const dead=!u.alive||u.hp<=0;
    const pct=dead?0:Math.max(0,u.hp/u.max_hp);
    const myTurn=activeTurnId===u.id&&!dead;
    const isCaster=['Mage','Wizard','Sorcerer','Cleric','Druid'].includes(u.cls||'');
    const slotsLeft=(u.spellSlots||0)-(u.spellsUsed||0);
    const items=(u.items||[]).filter(it=>it.qty>0);
    // Portrait
    let portInner='';
    if(u._portrait){
      portInner=`<img src="${u._portrait}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:4px;">`;
      if(dead)portInner+=`<div class="sk"><span style="font-size:18px">☠</span></div>`;
    } else if(dead){
      portInner=`<div class="sk"><span style="font-size:18px">☠</span></div>`;
    } else {
      portInner=`<span style="font-size:28px;line-height:1">${u.portrait_emoji||'👤'}</span>`;
    }
    // HP colour ring style
    const ringCol=dead?'#444':hpCol(pct);
    // Spell slot pips
    const slotPips=isCaster?`
      <div style="display:flex;gap:2px;flex-wrap:wrap;margin-top:3px;">
        ${Array.from({length:u.spellSlots||0},(_,i)=>`<div style="width:8px;height:8px;border-radius:50%;background:${i<slotsLeft?'var(--purple2)':'rgba(40,30,50,.6)'};border:1px solid rgba(187,143,206,.3);flex-shrink:0"></div>`).join('')}
      </div>`:'';
    // Item badges
    const itemBadges=items.slice(0,3).map(it=>`
      <div onclick="event.stopPropagation();useItem('${u.id}','${it.name}')"
           style="padding:2px 6px;background:rgba(200,162,74,.12);border:1px solid rgba(200,162,74,.3);border-radius:3px;font-size:9px;font-family:var(--fd);color:var(--gold2);cursor:pointer;white-space:nowrap;">
        ${it.icon||'🧪'} ${it.name} ×${it.qty}
      </div>`).join('');
    // Status badges
    const statBadges=[];
    if(u.status?.defending)statBadges.push(`<span style="color:var(--blue2);font-size:9px;font-family:var(--fd)">🛡DEF</span>`);
    if(u.status?.blessed)  statBadges.push(`<span style="color:var(--gold2);font-size:9px;font-family:var(--fd)">✨BLS</span>`);
    if(u.status?.shield)   statBadges.push(`<span style="color:var(--purple2);font-size:9px;font-family:var(--fd)">🔮SHL</span>`);
    if(u.status?.sleep)    statBadges.push(`<span style="color:#aab0e8;font-size:9px;font-family:var(--fd)">💤SLP</span>`);
    const atks=iterativeAttacks(u._bab||0,sMod(u.stats?.STR||10));
    return`<div class="pc ${G.sel===u.id?'pc-sel':''} ${myTurn?'pc-turn':''} ${dead?'pc-dead':''}"
      onclick="${dead?'':(`selectAndAct('${u.id}')`)}">
      <!-- Portrait -->
      <div class="pc-port" style="box-shadow:0 0 0 2px ${ringCol}40,0 0 8px ${ringCol}30">
        ${portInner}
        ${myTurn?`<div class="pc-turn-pip">▶</div>`:''}
      </div>
      <!-- Info -->
      <div class="pc-info">
        <div class="pc-name">${u.name}${dead?` <span style="color:#e07070">†</span>`:''}</div>
        <div class="pc-cls">${u.cls||''} ${u.lvl||''}${u.race?' · '+u.race:''}</div>
        <!-- HP bar -->
        ${!dead?`<div class="pc-hprow">
          <div class="pc-hb"><div class="pc-hf" style="width:${(pct*100).toFixed(1)}%;background:${hpCol(pct)};box-shadow:0 0 4px ${hpCol(pct)}60"></div></div>
          <div class="pc-hpt" style="color:${hpCol(pct)}">${u.hp}<span style="color:var(--text3)">/${u.max_hp}</span></div>
        </div>`:''}
        <!-- Stats row -->
        ${!dead?`<div class="pc-stats">
          <span class="pc-stat"><span class="sl">AC</span> <b>${u.ac}</b></span>
          <span class="pc-stat"><span class="sl">Atk</span> <b>+${atks[0]}</b></span>
          <span class="pc-stat"><span class="sl">Spd</span> <b>${(u._spd||6)*5}′</b></span>
          ${isCaster?`<span class="pc-stat"><span class="sl">✨</span> <b style="color:var(--purple2)">${slotsLeft}</b></span>`:''}
        </div>`:''}
        <!-- Slot pips -->
        ${slotPips}
        <!-- Status badges -->
        ${statBadges.length?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px;">${statBadges.join('')}</div>`:''}
        <!-- Item buttons -->
        ${itemBadges?`<div class="pc-items">${itemBadges}</div>`:''}
        ${dead?`<div style="font-size:10px;color:#e07070;font-style:italic;margin-top:2px;">Fallen in battle</div>`:''}
      </div>
    </div>`;
  }).join('');
}


function renderInit(){
  const el=document.getElementById('init-units');
  if(!G.order.length){el.innerHTML='';return;}
  const n=G.order.length;
  el.innerHTML=G.order.map((id,i)=>{
    const u=G.units[id];if(!u)return'';
    const isAct=i===G.turn,dead=!u.alive||u.hp<=0;
    // Relative position from current turn
    const rel=((i-G.turn)+n)%n;
    const isUpcoming=rel===1||rel===2;
    let port;
    if(u._portrait&&_imgC[u.id]?.complete){
      port=`<img src="${u._portrait}" alt="${u.name}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;${dead?'filter:grayscale(1) opacity(.5)':''}">`;
    } else {
      port=dead?'☠':(u.portrait_emoji||u.name[0]);
    }
    // HP mini-bar under portrait for active + upcoming
    const hpBar=(!dead&&(isAct||isUpcoming))
      ?`<div style="width:100%;height:2px;background:rgba(0,0,0,.4);border-radius:1px;margin-top:1px;overflow:hidden;">
          <div style="height:100%;width:${Math.round(u.hp/u.max_hp*100)}%;background:${u.hp/u.max_hp>.5?'#27ae60':u.hp/u.max_hp>.25?'#e67e22':'#e74c3c'};border-radius:1px;"></div>
        </div>`
      :'';
    const posLabel=isAct?'NOW':rel<=3?`+${rel}`:'';
    return`<div class="iu ${u.faction==='enemy'?'enemy':''} ${isAct&&!dead?'act2':''} ${isUpcoming&&!dead?'upcoming':''} ${dead?'dead2':''}"
      style="${!isAct&&!isUpcoming&&!dead?'opacity:.55':''}"
      onclick="initTap('${id}')">
      <div class="inum">${u.initiative||'?'}</div>
      <div class="ip">${port}</div>
      ${hpBar}
      <div class="in" style="${isAct?'color:var(--gold2);font-weight:600':''}">${u.name.substring(0,7)}</div>
      ${posLabel?`<div style="font-size:7px;font-family:var(--fd);color:${isAct?'var(--gold2)':'var(--text3)'};letter-spacing:.5px;">${posLabel}</div>`:''}
    </div>`;
  }).join('');
}

function doAtk(cid, isCharge=false){
  const u=G.units[cid];if(!u)return;
  const enemies=Object.values(G.units).filter(v=>v.faction==='enemy'&&v.alive&&v.hp>0);
  if(!enemies.length){toast('No enemies remain!');return;}

  // Smart weapon selection — pick best weapon per target distance
  // Build reachable target list using the BEST weapon for each enemy
  const targets = enemies.map(e=>{
    const chosen = bestWeapon(u, e);
    return {enemy:e, chosen};
  }).filter(x=>!x.chosen.outOfRange).map(x=>x.enemy);

  const displayTargets = targets.length ? targets : enemies;

  // Always use the target picker — works reliably on all screen sizes
  openTargetPicker(isCharge?'Charge — pick target':'Choose Target',displayTargets,tgt=>{
    const chosen = bestWeapon(u, tgt);
    const prevWeapon = u.weapon;
    if(chosen.weaponKey) u.weapon = chosen.weaponKey;
    resolveAtk(u,tgt,isCharge,isCharge?2:0).then(()=>{ u.weapon=prevWeapon; });
  });
}

function doFullAtk(cid){
  const u=G.units[cid];if(!u)return;
  const enemies=Object.values(G.units).filter(v=>v.faction==='enemy'&&v.alive&&v.hp>0);
  if(!enemies.length){toast('No enemies remain!');return;}
  const w=u.weapon?WPN[u.weapon]:null;
  const rng=w&&w.type==='ranged'?Math.floor((w.r||5)/5):1;
  const inRange=u.hex?enemies.filter(v=>v.hex&&hDist(u.hex,v.hex)<=rng):enemies;

  // Always use target picker
  openTargetPicker('Full Attack — target?',inRange,tgt=>resolveFullAtk(u,tgt));
  if(false){  // dead code kept for reference

    HEX.clearHL();HEX.hlAtk(cid);HEX.render();
    toast(`Full attack — click an enemy (${iterativeAttacks(u._bab||0,sMod(u.stats?.STR||10)).length} attacks)`);renderActions();

function doCharge(cid){
  const u=G.units[cid];if(!u)return;

  const chargeable=u.hex?enemies.filter(v=>v.hex&&hDist(u.hex,v.hex)<=(u._spd||6)*2+1):enemies;

function doSpell(cid,si){
  const u=G.units[cid];if(!u)return;
  const sn=u.spellsKnown[si],sp=SPL[sn];if(!sp)return;
  const isHeal=!!sp.heal;
  const range=typeof sp.range==='number'?sp.range:0;

  if(isHeal){
    const targets=Object.values(G.units).filter(v=>v.faction==='party'&&v.alive&&v.hp>0&&v.hp<v.max_hp);
    if(!targets.length){toast('Everyone is at full HP!');return;}
    openTargetPicker(`Heal with ${sn}`,targets,tgt=>resolveSpell(u,sn,sp,tgt),true);

  } else if(sp.aoe){
    // AOE spells: pick a target hex/enemy, then show radius preview, then resolve
    const enemies=Object.values(G.units).filter(v=>v.faction==='enemy'&&v.alive&&v.hp>0);
    if(!enemies.length){toast('No enemies remain!');return;}
    const aoeR=sp.aoeRadius||2;  // radius in hexes (Fireball=4, Burning Hands=2)
    openTargetPicker(`${sn} — pick centre target`,enemies,tgt=>{
      // Highlight AOE coverage then resolve after brief preview
      HEX.clearHL();
      if(tgt.hex){
        for(const k in G.map){
          if(hDist(tgt.hex,k)<=aoeR) G.map[k].hl='atk';
        }
        HEX.render();
        setTimeout(()=>{
          // Resolve against ALL enemies in radius
          const inBlast=Object.values(G.units).filter(
            v=>v.faction==='enemy'&&v.alive&&v.hp>0&&v.hex&&hDist(tgt.hex,v.hex)<=aoeR
          );
          resolveAoe(u,sn,sp,inBlast,tgt);
        },600);
      } else {
        resolveAoe(u,sn,sp,[tgt],tgt);
      }
    });

  } else {
    // Single-target offensive spell
    const enemies=Object.values(G.units).filter(v=>v.faction==='enemy'&&v.alive&&v.hp>0);
    if(!enemies.length){toast('No enemies remain!');return;}
    const inRange=range>0&&u.hex?enemies.filter(v=>v.hex&&hDist(u.hex,v.hex)<=Math.floor(range/5)):enemies;
    const targets=inRange.length?inRange:enemies;
    openTargetPicker(`Cast ${sn}`,targets,tgt=>resolveSpell(u,sn,sp,tgt));
  }
  renderActions();
}

function rollDice(arr){let t=0;for(let i=0;i<arr[0];i++)t+=d(arr[1]);return t;}

// ── Smart weapon selection ────────────────────────────────────────
// Returns {weapon, weaponKey, isRanged, reason} for the best attack
// given actor position and target position.
function bestWeapon(actor, target){
  const dist = (actor.hex && target.hex) ? hDist(actor.hex, target.hex) : 1;
  const primary = actor.weapon ? WPN[actor.weapon] : null;
  const primaryKey = actor.weapon || null;

  // Collect all weapon options: primary + any weapon items
  const options = [];
  if(primaryKey && primary) options.push({key:primaryKey, w:primary});
  (actor.items||[]).filter(it=>it.qty>0&&WPN[it.name]).forEach(it=>{
    options.push({key:it.name, w:WPN[it.name]});
  });
  if(!options.length) options.push({key:null, w:{dmg:[1,3],cr:20,cm:2,type:'melee'}});

  const adjacent = dist <= 1.5;

  // Prefer ranged if target is far AND we have a ranged weapon
  if(!adjacent){
    const ranged = options.filter(o=>o.w.type==='ranged'||o.w.r);
    if(ranged.length){
      const best = ranged[0];
      const rng = Math.floor((best.w.r||60)/5);
      if(dist <= rng) return {weaponKey:best.key, weapon:best.w, isRanged:true,
        reason:`${best.key} (${dist} hexes, range ${rng})`};
    }
    // Out of ranged range — can't attack, must move
    const meleeRng = Math.floor((options.find(o=>o.w.type==='melee')?.w?.r||5)/5)||1;
    if(dist > meleeRng){
      return {weaponKey:null, weapon:null, isRanged:false, outOfRange:true,
        reason:`Too far — move closer (${dist} hexes away)`};
    }
  }

  // Adjacent: prefer melee if available, otherwise use ranged at point-blank
  const melee = options.filter(o=>o.w.type!=='ranged'&&!o.w.r);
  if(melee.length){
    // Pick highest average damage melee weapon
    const best = melee.sort((a,b)=>{
      const avgA=a.w.dmg[0]*(a.w.dmg[1]+1)/2;
      const avgB=b.w.dmg[0]*(b.w.dmg[1]+1)/2;
      return avgB-avgA;
    })[0];
    return {weaponKey:best.key, weapon:best.w, isRanged:false,
      reason:`${best.key||'unarmed'} (adjacent)`};
  }

  // Only ranged available, point-blank
  if(options.length){
    const o=options[0];
    return {weaponKey:o.key, weapon:o.w, isRanged:true,
      reason:`${o.key} at point-blank`};
  }

  return {weaponKey:null, weapon:{dmg:[1,3],cr:20,cm:2,type:'melee'}, isRanged:false, reason:'unarmed'};
}

// ── Resolve attack (single standard action) ──
async function resolveAtk(actor,tgt,isCharge=false,atkBonus=0){
  if(!tgt||!tgt.alive||tgt.hp<=0){toast('Target already fallen!');return;}
  const bab=actor._bab||0, strMod=sMod(actor.stats?.STR||10);
  const w=actor.weapon?WPN[actor.weapon]:{dmg:[1,3],cr:20,cm:2};
  const isRanged=w&&w.type==='ranged';
  const totalBonus=bab+strMod+(w.attackBonus||0)+atkBonus;
  const res=rollAttack(totalBonus, tgt.ac);
  const hitChance=calcHitChance(totalBonus,tgt.ac);
  const detail=`d20:${res.r} + ${totalBonus} = ${res.total} vs AC ${tgt.ac} (${hitChance}% to hit)`;

  // Animate before resolving
  await ANIM.weapon(actor,tgt,isRanged||false,isCharge);

  if(res.miss){
    log(`${actor.name} attacks ${tgt.name} — Fumble!`,'miss',detail);
    spawnFloat(tgt,'Miss','miss');
  } else if(res.crit){
    const confirmed=confirmCrit(totalBonus,tgt.ac);
    const mult=confirmed?w.cm:1;
    const dmg=rollDmg(w.dmg,strMod,mult)+(atkBonus>0?2:0);
    tgt.hp=Math.max(0,tgt.hp-dmg);
    const verb=confirmed?'Critical hit!':'Strikes';
    log(`⚔ ${actor.name} ${verb.toLowerCase()} ${tgt.name} — ${dmg} damage!`,confirmed?'crit':'hit',detail+(confirmed?` · Crit ×${w.cm}`:''));
    spawnFloat(tgt, confirmed?`💥 ${dmg}`:`${dmg}`, confirmed?'crit':'dmg');
  } else if(res.hits){
    const dmg=rollDmg(w.dmg,strMod)+(atkBonus>0?2:0);
    tgt.hp=Math.max(0,tgt.hp-dmg);
    log(`⚔ ${actor.name} hits ${tgt.name} — ${dmg} damage!`,'hit',detail);
    spawnFloat(tgt,`${dmg}`,'dmg');
  } else {
    log(`${actor.name} attacks ${tgt.name} — Miss.`,'miss',detail);
    spawnFloat(tgt,'Miss','miss');
  }
  if(tgt.hp<=0){tgt.alive=false;log(`💀 ${tgt.name} has fallen!`,'death');if(tgt.faction==='enemy')killEnemy(tgt);}
  G.stdUsed=true;G.lastActType='attack';G.lastActDetail=null;
  afterAct();
}

// ── Resolve full attack (full-round — all iterative attacks) ──
async function resolveFullAtk(actor,tgt){
  if(!tgt||!tgt.alive||tgt.hp<=0){toast('Target already fallen!');return;}
  const bab=actor._bab||0, strMod=sMod(actor.stats?.STR||10);
  const w=actor.weapon?WPN[actor.weapon]:{dmg:[1,3],cr:20,cm:2};
  const atks=iterativeAttacks(bab,strMod);
  log(`⚔⚔ ${actor.name} attacks ${tgt.name} with full attack (${atks.length}× attacks):`,'sys');
  for(let i=0;i<atks.length;i++){
    if(!tgt.alive||tgt.hp<=0)break;
    const res=rollAttack(atks[i],tgt.ac);
    if(res.miss){log(`  Attack ${i+1}: d20:${res.r} — Fumble!`,'miss');}
    else if(res.crit){
      const confirmed=confirmCrit(atks[i],tgt.ac);
      const mult=confirmed?w.cm:1;
      const dmg=rollDmg(w.dmg,strMod,mult);
      tgt.hp=Math.max(0,tgt.hp-dmg);
      log(`  Attack ${i+1}: d20:${res.r}+${atks[i]}=${res.total} vs AC${tgt.ac} — ${confirmed?'CRITICAL! ':''}${dmg} dmg! [${tgt.hp}/${tgt.max_hp} HP]`,confirmed?'crit':'hit');
    } else if(res.hits){
      const dmg=rollDmg(w.dmg,strMod);
      tgt.hp=Math.max(0,tgt.hp-dmg);
      log(`  Attack ${i+1}: d20:${res.r}+${atks[i]}=${res.total} vs AC${tgt.ac} — Hit! ${dmg} dmg! [${tgt.hp}/${tgt.max_hp} HP]`,'hit');
    } else {
      log(`  Attack ${i+1}: d20:${res.r}+${atks[i]}=${res.total} vs AC${tgt.ac} — Miss.`,'miss');
    }
    if(tgt.hp<=0){tgt.alive=false;log(`💀 ${tgt.name} has fallen!`,'death');if(tgt.faction==='enemy')killEnemy(tgt);}
    await sl(150);
  }
  G.fullRound=true;G.lastActType='full-attack';G.lastActDetail=null;
  afterAct();
}

// ── Resolve charge ──
async function resolveCharge(actor,tgt){
  if(!tgt||!tgt.alive||tgt.hp<=0){toast('Target already fallen!');return;}
  // Move toward target — find closest passable hex adjacent to target
  if(actor.hex&&tgt.hex){
    let bk=null,bd=Infinity;
    const spd=(actor._spd||6)*2;
    for(const k in G.map){
      const h=G.map[k];
      const distToTarget=hDist(k,tgt.hex);
      const distFromActor=hDist(actor.hex,k);
      if(h.pass&&!h.unit&&distFromActor<=spd&&distToTarget<=1.5&&distToTarget<bd){bd=distToTarget;bk=k;}
    }
    if(bk){
      if(G.map[actor.hex])G.map[actor.hex].unit=null;
      actor.hex=bk;if(G.map[bk])G.map[bk].unit=actor.id;
      log(`${actor.name} charges toward ${tgt.name}!`,'sys');
      HEX.render();await sl(200);
    } else {
      // Can't find adjacent hex — charge from current
      log(`${actor.name} charges ${tgt.name} from range!`,'sys');
    }
  }
  // Apply charge penalties/bonuses
  if(!actor.status)actor.status={};
  actor.status.charged=true;
  actor._chargeAC=(actor._chargeAC||0)-2; // track AC penalty separately
  actor.ac=Math.max(1,actor.ac-2);
  G.charged=true;
  log(`⚡ Charging! ${actor.name} gets +2 to attack, −2 AC until next turn.`,'sys');
  HEX.render();await sl(150);
  await resolveAtk(actor,tgt,true,2);
  // resolveAtk calls afterAct
  G.fullRound=true; // charge is full-round
}

// ── Resolve spell ──
// ── Resolve AOE spell — hits all enemies in blast radius ──────────────────
async function resolveAoe(actor,sn,sp,targets,centreTgt){
  if(!targets||!targets.length)return;
  actor.spellsUsed=(actor.spellsUsed||0)+1;
  const casterLvl=actor.lvl||1;
  const dc=saveDC(actor,sp.lvl||1);
  let numDice=sp.dmg[0];
  if(['Fireball','Lightning Bolt','Burning Hands'].includes(sn))numDice=Math.min(casterLvl,10);
  const rawDmg=roll([numDice,sp.dmg[1]])+(sp.bonus||0);
  // Show animation centred on target
  if(centreTgt&&centreTgt.hex)await ANIM.spell(actor,centreTgt,sn);
  HEX.clearHL();
  log(`✨ ${actor.name} casts ${sn}! (${numDice}d${sp.dmg[1]}=${rawDmg} raw)`,'spell');
  for(const tgt of targets){
    if(!tgt.alive||tgt.hp<=0)continue;
    let finalDmg=rawDmg;
    if(sp.saves){
      const sBonus=saveBonus(tgt,sp.saves);const sRoll=d(20);const total=sRoll+sBonus;
      const saved=total>=dc;
      finalDmg=saved?Math.floor(rawDmg/2):rawDmg;
      log(`  → ${tgt.name}: ${finalDmg} dmg`+(saved?' (saved ½)':''),'hit');
    } else {
      log(`  → ${tgt.name}: ${finalDmg} dmg`,'hit');
    }
    tgt.hp=Math.max(0,tgt.hp-finalDmg);
    spawnFloat(tgt,`${finalDmg}`,'dmg');
    if(tgt.hp<=0){tgt.alive=false;log(`💀 ${tgt.name} has fallen!`,'death');if(tgt.faction==='enemy')killEnemy(tgt);}
  }
  G.stdUsed=true;G.lastActType='spell';G.lastActDetail=sn;
  afterAct();
}

async function resolveSpell(actor,sn,sp,tgt){
  if(!tgt)return;
  actor.spellsUsed=(actor.spellsUsed||0)+1;
  const casterLvl=actor.lvl||1;
  const dc=saveDC(actor,sp.lvl||1);
  // Spell animation
  if(sp.dmg&&sp.dmg[0]>0||sp.heal)await ANIM.spell(actor,tgt,sn);

  if(sp.heal){
    const h=roll(sp.heal)+(sp.bonus||0);tgt.hp=Math.min(tgt.max_hp,tgt.hp+h);
    log(`💚 ${actor.name} heals ${tgt.name} — +${h} HP!`,'heal',`${sn} · touch`);spawnFloat(tgt,`+${h}`,'heal');
  } else if(sp.dmg&&sp.dmg[0]>0){
    // Scale damage by caster level for level-scaling spells
    let numDice=sp.dmg[0];
    if(['Fireball','Lightning Bolt','Burning Hands'].includes(sn))numDice=Math.min(casterLvl,10);
    else if(sn==='Magic Missile')numDice=Math.ceil(casterLvl/2);
    const dmg=roll([numDice,sp.dmg[1]])+(sp.bonus||0);
    // Save
    if(sp.saves){
      const sBonus=saveBonus(tgt,sp.saves);const sRoll=d(20);const total=sRoll+sBonus;
      const saved=total>=dc;
      const finalDmg=saved?Math.floor(dmg/2):dmg;
      tgt.hp=Math.max(0,tgt.hp-finalDmg);
      log(`✨ ${actor.name} casts ${sn} on ${tgt.name} — ${finalDmg} damage!`+(saved?' (saved, ½)':''),'spell',`${numDice}d${sp.dmg[1]} = ${dmg}${saved?' halved to '+finalDmg:''} · DC${dc} ${sp.saves||''}`);spawnFloat(tgt,`${finalDmg}`,'dmg');
    } else {
      tgt.hp=Math.max(0,tgt.hp-dmg);
      log(`✨ ${actor.name} casts ${sn} on ${tgt.name} — ${dmg} damage!`,'spell',`Ranged touch · ${dmg} fire damage`);spawnFloat(tgt,`${dmg}`,'dmg');
    }
    if(tgt.hp<=0){tgt.alive=false;log(`💀 ${tgt.name} has fallen!`,'death');if(tgt.faction==='enemy')killEnemy(tgt);}
  } else {
    if(sn==='Shield'){actor.status.shield=true;actor.ac+=4;log(`✨ ${actor.name} casts Shield — AC now ${actor.ac} (+4 shield).`,'spell');}
    else if(sn==='Bless'){log(`✨ ${actor.name} casts Bless — allies gain +1 to attacks and saves.`,'spell');}
    else if(sn==='Sleep'){
      if(sp.saves){const sv=saveBonus(tgt,'will');const r=d(20);const saved=(r+sv)>=dc;
        if(saved){log(`✨ ${actor.name} casts Sleep — ${tgt.name} resists! (Will ${r+sv} vs DC${dc})`, 'miss');}
        else{tgt.status.sleep=true;log(`✨ ${actor.name} casts Sleep — ${tgt.name} falls into magical slumber!`,'spell');}
      }
    }
    else if(sn==='Hold Person'){
      const sv=saveBonus(tgt,'will');const r=d(20);const saved=(r+sv)>=dc;
      if(saved)log(`✨ ${actor.name} casts Hold Person on ${tgt.name} — resists! (Will ${r+sv} vs DC${dc})`,'miss');
      else{tgt.status.held=true;log(`✨ ${actor.name} casts Hold Person — ${tgt.name} is paralysed!`,'spell');}
    }
    else if(sn==='Prayer'){log(`✨ ${actor.name} casts Prayer — allies gain +1 luck on attacks, saves and damage.`,'spell');}
    else{log(`✨ ${actor.name} casts ${sn}: ${sp.d}`,'spell');}
  }
  G.stdUsed=true;G.lastActType='spell';G.lastActDetail=sn;
  afterAct();
}

function afterAct(){
  HEX.clearHL();
  const active=G.units[G.order[G.turn]];
  if(active&&active.faction==='party'&&active.alive&&active.hex&&!G.fullRound){
    if(!G.moveUsed)HEX.hlTurnStart(active.id);
    else if(!G.stdUsed)HEX.hlAtk(active.id);
  }
  HEX.render();renderParty();renderInit();renderActions();
  updateBanner();   // shows End Turn + "no actions" on ALL screen sizes
  checkEnd();
  const _aa=G.units[G.sel];updateRecommendation(_aa);
  if(!desk()&&!G.over){
    setTimeout(()=>openDrawer('action'),200);
  }
}

function killEnemy(u){
  if(!u)return;
  if(u._xp&&u._xp>0){G.xpGained+=u._xp;log(`+${u._xp} XP (${u.name})`,'sys');}
  rmUnit(u.id);
}
function rmUnit(id){const u=G.units[id];if(u?.hex&&G.map[u.hex])G.map[u.hex].unit=null;}

// ═══════════════════════════════════════════════════════
// HEX CLICK — move + attack + spell selection
// ═══════════════════════════════════════════════════════
function hexClick(k){
  const h=G.map[k];if(!h)return;
  const unit=h.unit?G.units[h.unit]:null;
  const active=G.units[G.order[G.turn]];
  const pa=G.pendingAction;

  // Click own party member = select
  if(unit&&unit.faction==='party'&&unit.alive&&unit.hp>0&&!pa){
    selectAndAct(unit.id);return;
  }

  // ── AUTO MOVE: click green hex with no pending action ──
  if(!pa&&h.hl==='move'&&h.pass&&!h.unit&&active&&active.faction==='party'&&!G.moveUsed&&!G.fullRound){
    execMove(active,k,false);return;
  }
  if(!pa&&h.hl==='charge'&&h.pass&&!h.unit&&active&&active.faction==='party'&&!G.moveUsed&&!G.fullRound){
    execMove(active,k,false);return;
  }

  // ── DIRECT ENEMY CLICK — smart auto-attack (no pending action needed) ──
  // Player taps an enemy directly on the map → pick best weapon and fire
  if(!pa && unit && unit.faction==='enemy' && unit.alive && unit.hp>0
      && active && active.faction==='party' && !G.stdUsed && !G.fullRound){
    const sel = G.sel || active.id;
    const actor = G.units[sel];
    if(!actor||!actor.alive||actor.hp<=0) return;

    const chosen = bestWeapon(actor, unit);

    if(chosen.outOfRange){
      toast(`Too far to attack — move closer first (${Math.round(hDist(actor.hex||'0,0',unit.hex||'0,0'))} hexes away)`);
      return;
    }

    // Temporarily set actor.weapon to chosen weapon for the resolve call
    const prevWeapon = actor.weapon;
    if(chosen.weaponKey) actor.weapon = chosen.weaponKey;

    // Show feedback toast
    const dist = actor.hex&&unit.hex ? hDist(actor.hex,unit.hex) : 1;
    const hitPct = calcHitChance((actor._bab||0)+sMod(actor.stats?.STR||10), unit.ac);
    toast(`${actor.name} → ${chosen.isRanged?'🏹':'⚔'} ${chosen.weaponKey||'unarmed'} · ${hitPct}% to hit`);

    resolveAtk(actor, unit, false, 0).then(()=>{
      // Restore weapon if we temporarily swapped
      actor.weapon = prevWeapon;
    });
    return;
  }

  if(!pa)return;

  // ── PENDING MOVE ──
  if(pa.type==='move'){
    if(h.pass&&!h.unit&&(h.hl==='move'||h.hl==='charge')){
      execMove(G.units[pa.cid],k,false);G.pendingAction=null;
    }return;
  }

  // ── PENDING ATTACK ──
  if((pa.type==='attack'||pa.type==='full-attack')&&unit&&unit.faction!=='party'){
    G.pendingAction=null;
    if(pa.type==='full-attack')resolveFullAtk(G.units[pa.cid],unit);
    else resolveAtk(G.units[pa.cid],unit,pa.isCharge||false,pa.atkBonus||0);
    return;
  }

  // ── PENDING CHARGE ──
  if(pa.type==='charge'&&unit&&unit.faction==='enemy'&&unit.alive){
    G.pendingAction=null;
    resolveCharge(G.units[pa.cid],unit);return;
  }

  // ── PENDING SPELL ──
  if(pa.type==='spell'&&unit){
    const actor=G.units[pa.cid];
    const ok=pa.isHeal?unit.faction==='party':unit.faction!=='party';
    if(ok){G.pendingAction=null;const sp=SPL[pa.sn];resolveSpell(actor,pa.sn,sp,unit);}
    return;
  }
}

function execMove(actor,k,isCharge){
  if(actor.hex&&G.map[actor.hex])G.map[actor.hex].unit=null;
  actor.hex=k;if(G.map[k])G.map[k].unit=actor.id;
  G.moveUsed=true;
  log(`${actor.name} moves to hex ${k}.`,'sys');
  HEX.clearHL();
  // After moving, show attack range if standard action still available
  if(!G.stdUsed&&!G.fullRound)HEX.hlAtk(actor.id);
  HEX.render();renderActions();updateBanner();
  if(mob())setTimeout(()=>openDrawer('action'),250);
}

let _tpCb=null;
function openTargetPicker(title,targets,cb,isAlly=false,actorId=null){
  _tpCb=cb;
  document.getElementById('tp-title').textContent=title;
  const actor=actorId?G.units[actorId]:(G.sel?G.units[G.sel]:null);
  const list=document.getElementById('tp-list');
  list.innerHTML=targets.map(u=>{
    const pct=Math.max(0,u.hp/u.max_hp);
    let port='';
    if(u._portrait&&_imgC[u.id]?.complete)port=`<img src="${u._portrait}" alt="${u.name}" style="width:100%;height:100%;object-fit:cover;border-radius:3px;">`;
    else port=`<span style="font-size:20px">${u.portrait_emoji||u.name[0]}</span>`;
    // Hit chance + expected damage (enemy targets only)
    let hitBadge='';
    if(!isAlly&&actor){
      const bab=actor._bab||0,strMod=sMod(actor.stats?.STR||10);
      const atk=iterativeAttacks(bab,strMod)[0];
      const hitPct=calcHitChance(atk,u.ac);
      const expDmg=calcExpectedDmg(actor,atk,u.ac);
      const hitCol=hitPct>=70?'#58d68d':hitPct>=45?'#f0a040':'#e74c3c';
      hitBadge=`<div class="tp-hit-badge">
        <span class="tp-hit-pct" style="color:${hitCol}">${hitPct}%</span>
        <span class="tp-hit-label">TO HIT</span>
        <div class="tp-edm">~${expDmg} dmg</div>
      </div>`;
    } else if(isAlly&&actor){
      // For healing, show missing HP
      const missing=u.max_hp-u.hp;
      hitBadge=`<div class="tp-hit-badge">
        <span class="tp-hit-pct" style="color:var(--green2)">-${missing}</span>
        <span class="tp-hit-label">MISSING</span>
      </div>`;
    }
    return`<div class="tp-enemy ${isAlly?'ally':''}" onclick="tpSel('${u.id}')" style="padding-right:${hitBadge?'80px':'12px'}">
      <div class="tp-portrait">${port}</div>
      <div class="tp-info">
        <div class="tp-name">${u.name}</div>
        <div class="tp-hp-row">
          <div class="tp-hb"><div class="tp-hf" style="width:${(pct*100).toFixed(1)}%;background:${hpCol(pct)}"></div></div>
          <div class="tp-ht">${u.hp}/${u.max_hp}</div>
        </div>
        <div class="tp-stats">AC ${u.ac}${!isAlly?` · ${u.name.includes('Goblin')||u.name.includes('Orc')||u.name.includes('Skeleton')?'':''}`:''}
          ${!isAlly&&u.status?.sleep?' · 💤 Sleeping':u.status?.held?' · 🔒 Held':''}
        </div>
      </div>
      ${hitBadge}
    </div>`;
  }).join('');
  document.getElementById('target-picker').classList.add('show');
  document.getElementById('tp-scrim').classList.add('show');
}
function tpSel(id){const cb=_tpCb;closeTargetPicker();if(cb)cb(G.units[id]);}
function closeTargetPicker(){
  document.getElementById('target-picker').classList.remove('show');
  document.getElementById('tp-scrim').classList.remove('show');
  _tpCb=null;
}

// ═══════════════════════════════════════════════════════
async function endTurn(){
  if(G.over)return;
  G.pendingAction=null;HEX.clearHL();HEX.render();
  const nam=document.getElementById('no-actions-msg');
  if(nam)nam.classList.remove('show');
  document.getElementById('big-endturn').classList.remove('show');
  await advTurn();
}

async function advTurn(){
  if(!G.order.length||G.over)return;
  G.turn=(G.turn+1)%G.order.length;
  let att=0;
  while(att<G.order.length){const c=G.units[G.order[G.turn]];if(c&&c.alive&&c.hp>0)break;G.turn=(G.turn+1)%G.order.length;att++;}
  if(G.turn===0){G.round++;document.getElementById('round-badge').textContent=`Round ${G.round}`;}
  const active=G.units[G.order[G.turn]];if(!active)return;

  // Reset action economy
  G.moveUsed=false;G.stdUsed=false;G.fullRound=false;G.charged=false;
  G.lastActType=null;G.lastActDetail=null;

  // Clear charge penalty from previous turn
  if(active.status?.charged){active.status.charged=false;if(active._chargeAC){active.ac=Math.max(1,active.ac-active._chargeAC);active._chargeAC=0;}}
  // Clear defending
  if(active.status?.defending){active.status.defending=false;}

  if(active.faction==='enemy'){
    document.getElementById('phase-badge').textContent=`${active.name} acting…`;
    HEX.clearHL();
    if(active.hex&&G.map[active.hex])G.map[active.hex].hl='atk';
    renderInit();updateBanner();HEX.render();
    await runEnemy(active);
    HEX.clearHL();HEX.render();
    await sl(100);
    if(!G.over)advTurn();return;
  }

  log(`── ${active.name}'s turn (Round ${G.round}) ──`,'sep');
  G.sel=active.id;G_openCat=null;G.pendingAction=null;
  HEX.clearHL();HEX.hlTurnStart(active.id);
  HEX.render();renderInit();renderParty();renderActions();updateBanner();
  if(!desk()){
    if(mob())toast(`${active.name}'s turn! Tap green hexes to move or tap Actions.`);
    setTimeout(()=>{
      openDrawer('action');
      document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('on'));
      const ba=document.getElementById('bn-act');if(ba)ba.classList.add('on');
    },350);
  }
  checkEnd();
}

async function runEnemy(e){
  if(!e.alive||e.hp<=0)return;
  log(`── ${e.name}'s turn ──`,'sep');
  if(e.status?.sleep||e.status?.held){log(`${e.name} is incapacitated and cannot act.`,'sys');return;}
  const alive=Object.values(G.units).filter(u=>u.faction==='party'&&u.alive&&u.hp>0);
  if(!alive.length)return;
  const tgt=ENEMY_AI.chooseTarget(e,alive);

  const dist=(e.hex&&tgt.hex)?hDist(e.hex,tgt.hex):1;
  const spd=e._spd||6;

  if(dist>1.5&&dist<=spd*2+1&&dist>spd){
    // Charge if can't reach with move action
    log(`${e.name} charges ${tgt.name}!`,'sys');
    if(e.hex&&tgt.hex){
      let bk=null,bd=Infinity;
      for(const k in G.map){const h=G.map[k];const dTgt=hDist(k,tgt.hex);const dFrom=hDist(e.hex,k);if(h.pass&&!h.unit&&dFrom<=spd*2&&dTgt<=1.5&&dTgt<bd){bd=dTgt;bk=k;}}
      if(bk){if(G.map[e.hex])G.map[e.hex].unit=null;e.hex=bk;if(G.map[bk])G.map[bk].unit=e.id;HEX.render();await sl(200);}
    }
    // Charge attack
    const w={dmg:e._dmg||[1,6],cr:20,cm:2};
    const atkBonus=(e._bab||0)+e._strMod+2;
    const res=rollAttack(atkBonus,tgt.ac);
    if(!res.miss&&res.hits){
      const dmg=rollDmg(w.dmg,e._strMod)+2;
      tgt.hp=Math.max(0,tgt.hp-dmg);
      log(`🔴 ${e.name} charges ${tgt.name}! (d20:${res.r}+${atkBonus}=${res.total} vs AC${tgt.ac}) — ${dmg} damage! [${tgt.hp}/${tgt.max_hp} HP]`,'hit');
    } else if(res.miss){log(`🔴 ${e.name} charges — Natural 1! Fumble.`,'miss');}
    else log(`🔴 ${e.name} charges ${tgt.name} — Miss. (${res.total} vs AC${tgt.ac})`,'miss');
  } else if(dist>1.5){
    // Move toward target
    let bk=null,bd=Infinity;
    for(const k in G.map){const h=G.map[k];if(h.pass&&!h.unit&&hDist(e.hex,k)<=spd){const d2=hDist(k,tgt.hex);if(d2<bd){bd=d2;bk=k;}}}
    if(bk){if(G.map[e.hex])G.map[e.hex].unit=null;e.hex=bk;if(G.map[bk])G.map[bk].unit=e.id;log(`${e.name} advances on ${tgt.name}.`,'sys');HEX.render();await sl(200);}
    // Attack if now adjacent
    const newDist=e.hex&&tgt.hex?hDist(e.hex,tgt.hex):99;
    if(newDist<=1.5){
      const w={dmg:e._dmg||[1,6],cr:20,cm:2};
      const atkBonus=(e._bab||0)+e._strMod;
      const res=rollAttack(atkBonus,tgt.ac);
      if(res.hits)logEnemyHit(e,tgt,res,w);
      else logEnemyMiss(e,tgt,res,atkBonus);
    }
  } else {
    // Already adjacent — full attack if BAB ≥ 6
    const bab=e._bab||0;
    const w={dmg:e._dmg||[1,6],cr:20,cm:2};
    const atks=iterativeAttacks(bab,e._strMod||0);
    for(let i=0;i<atks.length;i++){
      if(!tgt.alive||tgt.hp<=0)break;
      const res=rollAttack(atks[i],tgt.ac);
      if(res.hits)logEnemyHit(e,tgt,res,w);
      else logEnemyMiss(e,tgt,res,atks[i]);
      await sl(100);
    }
  }
  if(tgt.hp<=0&&tgt.alive){tgt.alive=false;log(`💀 ${tgt.name} has fallen!`,'death');}
  HEX.render();renderParty();
}
function logEnemyHit(e,tgt,res,w){
  const dmg=rollDmg(w.dmg,e._strMod||0);tgt.hp=Math.max(0,tgt.hp-dmg);
  if(res.crit){log(`🔴 Critical! ${e.name} hits ${tgt.name} — ${dmg} damage!`,'crit',`d20:${res.r} · confirmed crit ×${2}`);spawnFloat(tgt,`💥${dmg}`,'crit');}
  else{log(`🔴 ${e.name} hits ${tgt.name} — ${dmg} damage!`,'hit',`d20:${res.r}+${res.total-res.r}=${res.total} vs AC${res.targetAC}`);spawnFloat(tgt,`${dmg}`,'dmg');}
}
function logEnemyMiss(e,tgt,res,bonus){
  if(res.miss){log(`🔴 ${e.name} attacks — Fumble!`,'miss',`Natural 1`);spawnFloat(tgt,'Miss','miss');}
  else{log(`🔴 ${e.name} attacks ${tgt.name} — Miss.`,'miss',`d20:${res.r}+${bonus}=${res.total} vs AC${res.targetAC}`);spawnFloat(tgt,'Miss','miss');}
}

function checkEnd(){
  if(G.over)return;
  const pA=Object.values(G.units).filter(u=>u.faction==='party'&&u.alive&&u.hp>0);
  const eA=Object.values(G.units).filter(u=>u.faction==='enemy'&&u.alive&&u.hp>0);
  if(!eA.length){G.over=true;G.resultToSend='win';log('⚔ Victory! All enemies defeated!','crit');setTimeout(()=>showResult('win'),800);}
  else if(!pA.length){G.over=true;G.resultToSend='lose';log('💀 The party has fallen…','death');setTimeout(()=>showResult('lose'),800);}
}
function fleeCombat(){
  const u=G.units[G.sel]||Object.values(G.units).find(u=>u.faction==='party'&&u.alive&&u.hp>0);
  if(u)doFlee(u.id);
}
function showResult(r){
  const overlay=document.getElementById('result-overlay');
  const t=document.getElementById('result-title');
  const b=document.getElementById('result-return');
  const sub=document.getElementById('result-sub');

  // Title + colour
  if(r==='win')     { t.textContent='Victory!';  t.style.color='#e8c870'; }
  else if(r==='lose'){ t.textContent='Defeated';  t.style.color='#e74c3c'; }
  else               { t.textContent='Retreated'; t.style.color='#f0a040'; }

  // ── Build summary ──
  const party = Object.values(G.units).filter(u=>u.faction==='party');
  const xpEach = Math.floor(G.xpGained / Math.max(1, party.filter(p=>p.alive&&p.hp>0).length));
  const killed  = Object.values(G.units).filter(u=>u.faction==='enemy'&&(!u.alive||u.hp<=0)).length;

  // Party status rows
  const partyRows = party.map(u=>{
    const dead=!u.alive||u.hp<=0;
    const hpLost=(u.max_hp||0)-Math.max(0,u.hp);
    const spUsed=u.spellsUsed||0;
    const itemsUsed=(u.items||[]).filter(it=>it._startQty!==undefined&&it.qty<it._startQty);
    const statusParts=[];
    if(dead) statusParts.push(`<span style="color:#e74c3c">☠ Fallen</span>`);
    else{
      if(hpLost>0) statusParts.push(`<span style="color:#e67e22">−${hpLost} HP</span>`);
      else statusParts.push(`<span style="color:#58d68d">Full HP</span>`);
    }
    if(spUsed>0) statusParts.push(`<span style="color:#bb8fce">${spUsed} spell${spUsed!==1?'s':''} used</span>`);
    itemsUsed.forEach(it=>statusParts.push(`<span style="color:#9a8e72">${it.name} ×${it._startQty-it.qty}</span>`));
    if(!dead&&xpEach>0) statusParts.push(`<span style="color:#c8a24a">+${xpEach} XP</span>`);
    return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid rgba(42,48,64,.4);">
      <span style="font-size:16px">${u.portrait_emoji||'👤'}</span>
      <span style="font-family:var(--fd);font-size:11px;color:${dead?'#e07070':'var(--white)'};min-width:80px;">${u.name}</span>
      <span style="font-size:10px;color:var(--text2);">${!dead?u.hp+'/'+u.max_hp+' HP':''}</span>
      <span style="margin-left:auto;font-size:10px;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;">${statusParts.join('')}</span>
    </div>`;
  }).join('');

  // Combat stats
  const statLine = r==='win'
    ? `Defeated ${killed} enem${killed!==1?'ies':'y'} · ${G.round} round${G.round!==1?'s':''} · ${G.xpGained} total XP`
    : r==='lose'
    ? `The party was defeated after ${G.round} round${G.round!==1?'s':''}.`
    : `Fled after ${G.round} round${G.round!==1?'s':''}.`;

  sub.innerHTML = `
    <div style="font-size:11px;color:var(--text2);margin-bottom:10px;font-style:italic;">${statLine}</div>
    <div style="background:var(--bg3);border:1px solid var(--border);border-radius:6px;padding:8px 12px;text-align:left;max-width:420px;width:100%;margin:0 auto 8px;">
      ${partyRows}
    </div>
  `;

  // Button logic
  if(r==='lose'&&G.isLive){
    // Total party death → go to castle screen
    b.textContent='Return to Castle Serratis';
    b.onclick=()=>{
      try{window.parent.postMessage({type:'encounterResult',...buildResultPayload(r)},'*');}catch(e){}
      // If main game doesn't intercept, try navigating parent directly
      try{window.parent.location.href='/?screen=castle';}catch(e){}
      overlay.style.display='none';
    };
    b.style.borderColor='var(--red2)';b.style.color='var(--red2)';
  } else if(G.isLive){
    let c=8;
    b.textContent=`Return to Game (${c}s)`;
    b.onclick=()=>{sendResult(r);};
    const tid=setInterval(()=>{
      c--;
      if(overlay.style.display==='none'){clearInterval(tid);return;}
      b.textContent=c>0?`Return to Game (${c}s)`:'Returning…';
      if(c<=0){clearInterval(tid);sendResult(r);}
    },1000);
    b.style.borderColor='var(--gold)';b.style.color='var(--gold2)';
  } else {
    // Demo / standalone mode
    b.textContent='Close';
    b.onclick=()=>{overlay.style.display='none';};
  }

  overlay.style.display='flex';
  requestAnimationFrame(()=>overlay.classList.add('show-anim'));
}

function loadCombat(data){
  G.units={};G.order=[];G.turn=0;G.round=1;G.over=false;
  G.pendingAction=null;G.sel=null;
  G.xpGained=0;
  G.moveUsed=false;G.stdUsed=false;G.fullRound=false;G.charged=false;
  G.lastActType=null;G.lastActDetail=null;
  if(data.map_type){G.mapType=data.map_type;HEX.build();HEX.resize();}
  const all=[...(data.party||[]).map(u=>({...u,faction:'party'})),...(data.enemies||[]).map(u=>({...u,faction:'enemy'}))];
  all.forEach(u=>{
    G.units[u.id]=u;
    u.initiative=d(20)+sMod(u.stats?.DEX||10);
    if(u._portrait)cacheImg(u.id,u._portrait);
    // Snapshot item quantities so we can report consumption
    if(u.items) u.items.forEach(it=>{ it._startQty = it.qty !== undefined ? it.qty : 1; });
  });
  G.order=Object.keys(G.units).filter(id=>G.units[id].alive&&G.units[id].hp>0).sort((a,b)=>G.units[b].initiative-G.units[a].initiative);
  Object.values(G.units).filter(u=>u.faction==='party'&&(!u.alive||u.hp<=0)).forEach(u=>{u.alive=false;});
  placeUnits();
  const fp=Object.values(G.units).find(u=>u.faction==='party'&&u.alive&&u.hp>0);
  if(fp)G.sel=fp.id;
  document.getElementById('round-badge').textContent='Round 1';
  document.getElementById('phase-badge').textContent='Combat begins!';
  log('══ Combat begins! Initiative order: ══','sep');
  G.order.forEach(id=>log(`  ${G.units[id].name}: init ${G.units[id].initiative} (BAB +${G.units[id]._bab||0})`,'sys'));
  const first=G.units[G.order[0]];
  if(first?.faction==='enemy'){
    setTimeout(async()=>{await runEnemy(first);await sl(180);advTurn();},120);
  } else {
    if(first){HEX.hlTurnStart(first.id);G.sel=first.id;}
    setTimeout(()=>{if(!desk()&&fp)selectAndAct(fp.id);},400);
  }
  renderParty();renderInit();renderActions();HEX.render();updateBanner();
}
function placeUnits(){
  const party=Object.values(G.units).filter(u=>u.faction==='party');
  const enemies=Object.values(G.units).filter(u=>u.faction==='enemy');
  // Party on left side, enemies on right — ~5 hexes apart (within charge range)
  const pH=['1,4','1,5','2,4','2,5','1,3','2,6'];
  const eH=['11,4','11,5','12,4','12,5','11,3','12,6','10,4','10,5','12,3','11,6'];
  party.forEach((u,i)=>{const k=pH[i]||`1,${4+i}`;if(G.map[k]){G.map[k].pass=true;G.map[k].terrain='stone';G.map[k].unit=u.id;u.hex=k;}});
  enemies.forEach((u,i)=>{const k=eH[i]||`11,${4+i}`;if(G.map[k]){G.map[k].pass=true;G.map[k].terrain='stone';G.map[k].unit=u.id;u.hex=k;}});
}

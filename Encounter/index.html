function spawnFloat(unit,text,type){
  if(!unit.hex)return;
  const cv=HEX.cv;
  if(!cv||cv.width<10)return;
  const s=HEX._cachedSz||HEX.sz;
  HEX._cachedSz=s;
  const{x,y}=HEX.ctr(...unit.hex.split(',').map(Number));
  const cvRect=cv.getBoundingClientRect();
  const mwRect=document.getElementById('map-wrap').getBoundingClientRect();
  const scaleX=cvRect.width/cv.width;
  const scaleY=cvRect.height/cv.height;
  const offX=cvRect.left-mwRect.left;
  const offY=cvRect.top-mwRect.top;
  const sx=offX+x*scaleX;
  const sy=offY+y*scaleY;
  const el=document.createElement('div');
  el.className=`float-num ${type}`;
  el.textContent=text;
  el.style.left=(sx+(-8+Math.random()*16))+'px';
  el.style.top=(sy-s*scaleY*0.5)+'px';
  document.getElementById('float-layer').appendChild(el);
  setTimeout(()=>el.remove(),950);
}

// ═══════════════════════════════════════════════════════
// ANIMATION ENGINE
// ═══════════════════════════════════════════════════════
const ANIM={
  cv:null,ctx:null,
  init(){
    this.cv=document.getElementById('anim-canvas');
    if(!this.cv)return;
    this.ctx=this.cv.getContext('2d');
    const mw=document.getElementById('hex-canvas');
    const sync=()=>{if(mw.width>10&&mw.height>10){this.cv.width=mw.width;this.cv.height=mw.height;}};
    sync();new ResizeObserver(sync).observe(mw);
  },
  clear(){if(this.ctx){this.ctx.globalAlpha=1;this.ctx.clearRect(0,0,this.cv.width,this.cv.height);}},
  async weapon(actor,tgt,isRanged,isCharge){
    if(!actor.hex||!tgt.hex)return;
    this.ctx=this.cv.getContext('2d');
    this.clear();
    const from=HEX.ctr(...actor.hex.split(',').map(Number));
    const to  =HEX.ctr(...tgt.hex.split(',').map(Number));
    try{
      if(isRanged){await this._projectile(from,to,isCharge?'#e67e22':'#e8c870',3);}
      else{await this._slash(from,to,isCharge?'#e67e22':'#5dade2');}
    }finally{this.clear();}
  },
  async spell(actor,tgt,spellName){
    if(!actor.hex||!tgt.hex)return;
    this.ctx=this.cv.getContext('2d');
    this.clear();
    const from=HEX.ctr(...actor.hex.split(',').map(Number));
    const to  =HEX.ctr(...tgt.hex.split(',').map(Number));
    const col= spellName==='Fireball'?'#e67e22':
               spellName==='Lightning Bolt'?'#aad4f5':
               spellName==='Magic Missile'?'#c8a24a':
               spellName?.includes('Cure')?'#58d68d':'#bb8fce';
    try{
      if(spellName==='Fireball'){await this._explosion(to,col,28);}
      else if(spellName==='Lightning Bolt'){await this._bolt(from,to,col);}
      else{await this._projectile(from,to,col,4);}
    }finally{this.clear();}
  },
  async _projectile(from,to,col,size){
    const steps=12;
    for(let i=0;i<=steps;i++){
      this.clear();
      const t=i/steps,x=from.x+(to.x-from.x)*t,y=from.y+(to.y-from.y)*t;
      this.ctx.beginPath();this.ctx.arc(x,y,size,0,Math.PI*2);
      this.ctx.fillStyle=col;this.ctx.fill();
      // Trail
      for(let j=1;j<=4;j++){
        const tt=Math.max(0,t-j*0.06);
        const tx=from.x+(to.x-from.x)*tt,ty=from.y+(to.y-from.y)*tt;
        this.ctx.beginPath();this.ctx.arc(tx,ty,size*(1-j*.2),0,Math.PI*2);
        this.ctx.fillStyle=col.replace(')',`,${.6-j*.12})`).replace('rgb','rgba');
        try{this.ctx.fill();}catch(e){}
      }
      await sl(16);
    }
  },
  async _slash(from,to,col){
    const dx=to.x-from.x,dy=to.y-from.y;
    const mid={x:(from.x+to.x)/2,y:(from.y+to.y)/2};
    const perp={x:-dy*.35,y:dx*.35};
    const steps=8;
    for(let i=0;i<=steps;i++){
      this.clear();const t=i/steps;
      // Sweep arc
      this.ctx.beginPath();
      this.ctx.moveTo(mid.x-perp.x*t,mid.y-perp.y*t);
      this.ctx.lineTo(mid.x+perp.x*t,mid.y+perp.y*t);
      this.ctx.strokeStyle=col;this.ctx.lineWidth=3*(1-t*.5);
      this.ctx.globalAlpha=1-t*.7;this.ctx.stroke();this.ctx.globalAlpha=1;
      await sl(14);
    }
  },
  async _explosion(at,col,r){
    const steps=10;
    for(let i=0;i<=steps;i++){
      this.clear();const t=i/steps,cr=r*t;
      this.ctx.beginPath();this.ctx.arc(at.x,at.y,cr,0,Math.PI*2);
      this.ctx.fillStyle=col;this.ctx.globalAlpha=(1-t)*.7;this.ctx.fill();
      this.ctx.beginPath();this.ctx.arc(at.x,at.y,cr*.6,0,Math.PI*2);
      this.ctx.fillStyle='#fff';this.ctx.globalAlpha=(1-t)*.5;this.ctx.fill();
      this.ctx.globalAlpha=1;
      await sl(18);
    }
  },
  async _bolt(from,to,col){
    const steps=6;
    for(let i=0;i<=steps;i++){
      this.clear();const t=i/steps;
      // Jagged lightning
      this.ctx.beginPath();this.ctx.moveTo(from.x,from.y);
      const segs=5;
      for(let j=1;j<=segs;j++){
        const st=j/segs,sx=from.x+(to.x-from.x)*Math.min(st,t);
        const sy=from.y+(to.y-from.y)*Math.min(st,t);
        const jitter=(st<t)?((Math.random()-.5)*14):0;
        this.ctx.lineTo(sx+jitter,sy+jitter);
      }
      this.ctx.strokeStyle=col;this.ctx.lineWidth=2;
      this.ctx.globalAlpha=.8+Math.random()*.2;this.ctx.stroke();this.ctx.globalAlpha=1;
      await sl(20);
    }
  },
};

// ═══════════════════════════════════════════════════════
// HIT CHANCE CALCULATION
// ═══════════════════════════════════════════════════════
function calcHitChance(atkBonus,targetAC){
  // Hits on roll >= targetAC - atkBonus, always on 20, never on 1
  const needed=targetAC-atkBonus;
  const hits=Math.min(19,Math.max(1,21-needed));
  return Math.round(hits/20*100);
}
function calcExpectedDmg(actor,atkBonus,targetAC){
  const w=actor.weapon?WPN[actor.weapon]:{dmg:[1,3]};
  const strMod=sMod(actor.stats?.STR||10);
  const avgDmg=(w.dmg[0]*(w.dmg[1]+1)/2)+strMod;
  const pHit=calcHitChance(atkBonus,targetAC)/100;
  return Math.round(avgDmg*pHit*10)/10;
}

// ═══════════════════════════════════════════════════════
// RECOMMENDATION ENGINE
// ═══════════════════════════════════════════════════════
function computeRecommendation(u){
  if(!u||!u.alive||u.hp<=0)return null;
  const enemies=Object.values(G.units).filter(v=>v.faction==='enemy'&&v.alive&&v.hp>0);
  if(!enemies.length)return null;
  const bab=u._bab||0,strMod=sMod(u.stats?.STR||10);
  const w=u.weapon?WPN[u.weapon]:null;
  const atk=bab+strMod;
  // Find best target: nearest in melee range first, else closest
  const adjacentEnemies=u.hex?enemies.filter(v=>v.hex&&hDist(u.hex,v.hex)<=1.5):[];
  const chargeEnemies=u.hex&&!G.moveUsed?enemies.filter(v=>v.hex&&hDist(u.hex,v.hex)<=(u._spd||6)*2+1):[];
  if(adjacentEnemies.length){
    const tgt=adjacentEnemies.sort((a,b)=>a.hp-b.hp)[0]; // attack weakest
    const hitPct=calcHitChance(atk,tgt.ac);
    const expDmg=calcExpectedDmg(u,atk,tgt.ac);
    return{action:'attack',label:`⚔ Attack ${tgt.name}`,stats:`${hitPct}% to hit · ~${expDmg} expected damage`,tgtId:tgt.id};
  } else if(chargeEnemies.length&&!G.stdUsed&&!G.fullRound){
    const tgt=chargeEnemies.sort((a,b)=>a.hp-b.hp)[0];
    const hitPct=calcHitChance(atk+2,tgt.ac);
    const expDmg=calcExpectedDmg(u,atk+2,tgt.ac);
    return{action:'charge',label:`⚡ Charge ${tgt.name}`,stats:`${hitPct}% to hit · ~${expDmg} expected · −2 AC risk`,tgtId:tgt.id};
  } else {
    // Suggest moving toward nearest enemy
    const nearest=enemies.sort((a,b)=>{
      const da=u.hex&&a.hex?hDist(u.hex,a.hex):99;
      const db=u.hex&&b.hex?hDist(u.hex,b.hex):99;
      return da-db;
    })[0];
    return{action:'move',label:`🚶 Move toward ${nearest.name}`,stats:`${nearest.name} is ${u.hex&&nearest.hex?Math.ceil(hDist(u.hex,nearest.hex)):'-'} hexes away`};
  }
}

function updateRecommendation(u){
  const banner=document.getElementById('rec-banner');
  if(!banner)return;
  if(!u||!u.alive||G.order[G.turn]!==u.id){banner.style.display='none';return;}
  const rec=computeRecommendation(u);
  if(!rec){banner.style.display='none';return;}
  document.getElementById('rec-body').textContent=rec.label;
  document.getElementById('rec-stats').textContent=rec.stats;
  banner.style.display='block';
  banner.onclick=()=>{
    if(rec.action==='attack'&&rec.tgtId){
      // Always fire immediately — no pendingAction needed
      const tgt=G.units[rec.tgtId];
      if(tgt&&tgt.alive&&tgt.hp>0){
        const chosen=bestWeapon(u,tgt);
        const prevWeapon=u.weapon;
        if(chosen.weaponKey)u.weapon=chosen.weaponKey;
        resolveAtk(u,tgt,false,0).then(()=>{u.weapon=prevWeapon;});
      }
    } else if(rec.action==='charge'&&rec.tgtId){
      resolveCharge(u,G.units[rec.tgtId]);
    } else if(rec.action==='move'){
      HEX.hlTurnStart(u.id);
      if(mob()){closeAllDrawers();document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('on'));document.getElementById('bn-map').classList.add('on');}
    }
  };
  banner.style.cursor='pointer';
}

// ═══════════════════════════════════════════════════════
// THREAT ZONE — highlight hexes adjacent to enemies
// ═══════════════════════════════════════════════════════
function hlThreatZones(){
  // Mark hexes threatened by enemies (adjacent to any living enemy)
  const enemies=Object.values(G.units).filter(v=>v.faction==='enemy'&&v.alive&&v.hp>0&&v.hex);
  for(const k in G.map){
    const h=G.map[k];if(h.hl)continue;// don't overwrite movement highlights
    const threatened=enemies.some(e=>hDist(e.hex,k)<=1.5);
    if(threatened&&h.pass&&!h.unit)h.hl='threat';
  }
}

let G_openCat=null;// which category is expanded: 'atk'|'abi'|'tac'|null

function renderCatButtons(u,isActive){
  const catAtk=document.getElementById('cat-atk');
  const catAbi=document.getElementById('cat-abi');
  const catTac=document.getElementById('cat-tac');
  if(!catAtk||!catAbi||!catTac)return; // guard: DOM not ready
  const isCaster=u&&['Mage','Wizard','Sorcerer','Cleric','Druid'].includes(u.cls||'');
  const hasSpells=isCaster&&(u.spellsKnown?.length>0);
  const slotsLeft=hasSpells?(u.spellSlots||0)-(u.spellsUsed||0):0;
  const allOff=!isActive||G.fullRound;
  catAtk.disabled=allOff||G.stdUsed;
  catAbi.disabled=allOff||G.stdUsed||!hasSpells||slotsLeft<=0;
  catTac.disabled=allOff;
  catAtk.classList.toggle('cat-active',G_openCat==='atk');
  catAbi.classList.toggle('cat-active',G_openCat==='abi');
  catTac.classList.toggle('cat-active',G_openCat==='tac');
  catAtk.classList.toggle('cat-done',G.stdUsed&&G.lastActType==='attack');
  catAbi.classList.toggle('cat-done',G.stdUsed&&G.lastActType==='spell');
  catTac.classList.toggle('cat-done',G.stdUsed&&(G.lastActType==='defend'||G.fullRound));
  const ab=document.getElementById('cat-atk-badge');
  const bb=document.getElementById('cat-abi-badge');
  const cb=document.getElementById('cat-tac-badge');
  if(ab)ab.textContent=G.stdUsed&&G.lastActType==='attack'?'✓':'';
  if(bb)bb.textContent=hasSpells?`${slotsLeft} slot${slotsLeft!==1?'s':''}`:(!isCaster?'—':'');
  if(cb)cb.textContent=G.fullRound?'✓ Used':'';
}

function openCat(cat){
  G_openCat=(G_openCat===cat)?null:cat;
  renderActionSub();
}

function renderActionSub(){
  const u=G.sel?G.units[G.sel]:null;
  const isActive=u&&G.order[G.turn]===G.sel&&u.alive&&u.hp>0;
  renderCatButtons(u,isActive);
  const sub=document.getElementById('act-sub');
  if(!sub)return;

  if(!u){
    sub.innerHTML=`<div class="act-empty">
      <div style="font-size:48px;margin-bottom:10px;opacity:.4">⚔</div>
      <div style="font-family:var(--fd);font-size:11px;color:var(--text2);letter-spacing:1px;margin-bottom:8px">HOW TO PLAY</div>
      <div style="font-size:12px;color:var(--text3);line-height:2;">
        Your token <strong style="color:var(--gold2)">pulses</strong> on the map<br>
        <span style="color:var(--green2)">●</span> <strong>Green</strong> = walk there (tap hex)<br>
        <span style="color:var(--orange2)">●</span> <strong>Orange</strong> = charge range<br>
        Tap a category above to act
      </div>
    </div>`;
    return;
  }
  if(!u.alive||u.hp<=0){
    sub.innerHTML=`<div class="act-empty"><div style="font-size:40px">☠</div><div style="color:#e07070;font-family:var(--fd);font-size:11px;margin-top:8px">This character has fallen</div></div>`;
    return;
  }

  const bab=u._bab||0, strMod=sMod(u.stats?.STR||10);
  const atks=iterativeAttacks(bab,strMod);
  const w=u.weapon?WPN[u.weapon]:null;
  const isRanged=w&&w.type==='ranged';
  const enemies=Object.values(G.units).filter(v=>v.faction==='enemy'&&v.alive&&v.hp>0);
  const nearestEnemy=enemies.sort((a,b)=>{
    const da=u.hex&&a.hex?hDist(u.hex,a.hex):99;
    const db=u.hex&&b.hex?hDist(u.hex,b.hex):99;
    return da-db;
  })[0];
  const isCaster=['Mage','Wizard','Sorcerer','Cleric','Druid'].includes(u.cls||'');
  const slotsLeft=(u.spellSlots||0)-(u.spellsUsed||0);
  const items=(u.items||[]).filter(it=>it.qty>0);

  let html='';

  if(!G_openCat){
    // ── No category open: show "your move" state ──
    const moveHint=!G.moveUsed&&!G.fullRound?`
      <div class="act-move-hint">
        <div style="font-size:22px">🚶</div>
        <div>
          <div style="font-family:var(--fd);font-size:10px;color:var(--green2);">Tap a green hex to move</div>
          <div style="font-size:11px;color:var(--text3);margin-top:1px;">${(u._spd||6)} hexes · ${(u._spd||6)*5}ft range</div>
        </div>
      </div>`:'';
    const actHint=!G.stdUsed&&!G.fullRound?`<div style="font-size:11px;color:var(--text2);padding:6px 0;font-style:italic;">Choose a category above — ⚔ Attack, ✨ Ability, or 🛡 Tactical</div>`
      :G.moveUsed&&G.stdUsed?`<div style="font-size:11px;color:var(--green2);padding:6px 0;">✓ Both actions used — tap End Turn</div>`:'';
    html=moveHint+actHint;

  } else if(G_openCat==='atk'){
    // ── ATTACK CATEGORY — large weapon card + full attack + charge ──
    const hitPct=nearestEnemy?calcHitChance(atks[0],nearestEnemy.ac):null;
    const expDmg=nearestEnemy?calcExpectedDmg(u,atks[0],nearestEnemy.ac):null;
    const dis=!isActive||G.stdUsed||G.fullRound;

    // Big weapon attack card
    html+=`<div class="act-big-card atk-card ${dis?'act-dis':''}" onclick="${dis?'':(`doAtk('${u.id}',false)`)}">
      <div class="abc-ico">${isRanged?'🏹':'⚔️'}</div>
      <div class="abc-body">
        <div class="abc-name">${u.weapon||'Unarmed Strike'}</div>
        <div class="abc-desc">${w?`${w.dmg[0]}d${w.dmg[1]}${strMod>=0?'+':''}${strMod} dmg · ${w.type}`:' 1d3 bludgeoning'}</div>
        ${hitPct!==null?`<div class="abc-odds" style="color:${hitPct>=70?'var(--green2)':hitPct>=45?'var(--orange2)':'var(--red2)'}">
          ${hitPct}% to hit · ~${expDmg} dmg expected
        </div>`:''}
        <div class="abc-tags">
          <span class="act-tag" style="background:rgba(200,162,74,.12);color:var(--gold);border:1px solid rgba(200,162,74,.3)">+${atks[0]} attack</span>
          ${w?`<span class="act-tag" style="color:var(--text2);border:1px solid var(--border)">crit ${w.cr}–20 ×${w.cm}</span>`:''}
        </div>
      </div>
      ${dis?'':`<div style="font-size:20px;opacity:.4;margin-left:auto;align-self:center">›</div>`}
    </div>`;

    // Full attack (if iterative attacks available)
    if(atks.length>1){
      const fulldis=!isActive||G.stdUsed||G.fullRound||G.moveUsed;
      html+=`<div class="act-big-card atk-card ${fulldis?'act-dis':''}" onclick="${fulldis?'':(`doFullAtk('${u.id}')`)}">
        <div class="abc-ico">⚔⚔</div>
        <div class="abc-body">
          <div class="abc-name">Full Attack <span style="font-size:9px;color:var(--text3)">· can't move</span></div>
          <div class="abc-desc">${atks.length} attacks: +${atks.join('/+')}</div>
          <div class="abc-tags"><span class="act-tag" style="color:var(--gold);border:1px solid rgba(200,162,74,.3)">Full-Round Action</span></div>
        </div>
      </div>`;
    }

    // Charge — big orange card
    const chgdis=!isActive||G.stdUsed||G.fullRound||G.moveUsed;
    html+=`<div class="act-big-card charge-style ${chgdis?'act-dis':''}" onclick="${chgdis?'':(`doCharge('${u.id}')`)}">
      <div class="abc-ico">💨</div>
      <div class="abc-body">
        <div class="abc-name">Charge!</div>
        <div class="abc-desc">Rush ${(u._spd||6)*2} hexes → attack at +2 · takes −2 AC</div>
        <div class="abc-tags">
          <span class="act-tag" style="color:var(--orange2);border:1px solid rgba(230,126,34,.4)">+2 attack</span>
          <span class="act-tag" style="color:var(--red2);border:1px solid rgba(192,57,43,.4)">−2 AC</span>
        </div>
      </div>
    </div>`;

  } else if(G_openCat==='abi'){
    // ── ABILITY CATEGORY — spell grid (large icon tiles) ──
    if(!isCaster||!(u.spellsKnown||[]).length){
      html=`<div class="act-empty" style="padding:20px"><div style="font-size:32px;opacity:.4">🔮</div><div style="color:var(--text3);font-size:11px;margin-top:8px">No spells prepared</div></div>`;
    } else {
      // Slot counter
      html+=`<div style="padding:6px 8px 4px;display:flex;align-items:center;justify-content:space-between;">
        <span style="font-family:var(--fd);font-size:9px;color:var(--text3);letter-spacing:1px">SPELL SLOTS</span>
        <div style="display:flex;gap:3px;">${Array.from({length:u.spellSlots||0},(_,i)=>`<div style="width:10px;height:10px;border-radius:50%;background:${i<slotsLeft?'var(--purple2)':'rgba(40,30,50,.5)'};border:1px solid rgba(187,143,206,.25)"></div>`).join('')}</div>
      </div>`;
      // Spell grid — 2 columns of large icon tiles
      html+=`<div class="spell-grid">`;
      (u.spellsKnown||[]).forEach((sn,i)=>{
        const sp=SPL[sn];if(!sp)return;
        const isHeal=!!sp.heal;
        const done=G.stdUsed&&G.lastActType==='spell'&&G.lastActDetail===sn;
        const noSlots=slotsLeft<=0;
        const sdis=!isActive||G.stdUsed||G.fullRound||noSlots;
        const spIco=isHeal?'💚':
          sn.includes('Fire')?'🔥':sn.includes('Lightning')?'⚡':sn.includes('Sleep')?'💤':
          sn.includes('Shield')?'🛡':sn.includes('Bless')?'✨':sn.includes('Hold')?'🔒':
          sn.includes('Missile')?'✨':sn.includes('Scorch')?'🔥':sn.includes('Prayer')?'🙏':'✨';
        const spCol=isHeal?'var(--green2)':sn.includes('Fire')?'var(--orange2)':sn.includes('Lightning')?'var(--blue2)':'var(--purple2)';
        html+=`<div class="spell-tile ${isHeal?'spell-heal':''} ${sdis?'act-dis':''} ${done?'spell-done':''}"
          onclick="${sdis?'':(`doSpell('${u.id}',${i})`)}">
          <div class="st-ico" style="color:${spCol}">${spIco}</div>
          <div class="st-name">${sn}</div>
          <div class="st-lv">Lv${sp.lvl||1} ${sp.sc}</div>
          ${sp.saves?`<div class="st-dc">DC${saveDC(u,sp.lvl||1)}</div>`:''}
          ${done?`<div class="st-done">✓</div>`:''}
        </div>`;
      });
      html+=`</div>`;
    }
    // Items row (in ability panel — potions etc)
    if(items.length){
      html+=`<div style="padding:6px 8px 3px;font-family:var(--fd);font-size:8px;letter-spacing:2px;color:var(--text3);border-top:1px solid var(--border);margin-top:4px;">ITEMS</div>`;
      html+=`<div class="item-row">`;
      items.forEach(it=>{
        const dis2=!isActive;
        html+=`<div class="item-tile ${dis2?'act-dis':''}" onclick="${dis2?'':(`useItem('${u.id}','${it.name}')`)}">
          <div class="it-ico">${it.icon||'🧪'}</div>
          <div class="it-name">${it.name}</div>
          <div class="it-qty">×${it.qty}</div>
        </div>`;
      });
      html+=`</div>`;
    }

  } else if(G_openCat==='tac'){
    // ── TACTICAL CATEGORY — defend + flee as full-width cards ──
    const def=u.status?.defending;
    const tddis=!isActive||G.stdUsed||G.fullRound;
    html+=`<div class="act-big-card tac-card ${tddis?'act-dis':''} ${def?'act-done':''}" onclick="${tddis?'':(`doDefend('${u.id}')`)}">
      <div class="abc-ico">🛡</div>
      <div class="abc-body">
        <div class="abc-name">Total Defence${def?' (active)':''}</div>
        <div class="abc-desc">+4 dodge AC until next turn — no attacks this round</div>
        <div class="abc-tags"><span class="act-tag" style="color:var(--blue2);border:1px solid rgba(93,173,226,.3)">Standard · +4 AC</span></div>
      </div>
    </div>`;
    html+=`<div class="act-big-card flee-card ${!isActive?'act-dis':''}" onclick="${!isActive?'':(`doFlee('${u.id}')`)}">
      <div class="abc-ico">🏃</div>
      <div class="abc-body">
        <div class="abc-name">Flee Combat</div>
        <div class="abc-desc">Withdraw from battle — encounter ends immediately</div>
        <div class="abc-tags"><span class="act-tag" style="color:var(--red2);border:1px solid rgba(192,57,43,.3)">Ends encounter</span></div>
      </div>
    </div>`;
  }

  // ── Move reminder when no category ──
  if(G_openCat==='atk'&&!G.moveUsed&&!G.fullRound){
    html+=`<div style="margin-top:6px;padding:6px 8px;background:rgba(39,174,96,.07);border:1px solid rgba(39,174,96,.2);border-radius:5px;font-size:11px;color:var(--text2);">
      🟢 <strong style="color:var(--green2)">You can still move</strong> — tap a green hex on the map, then attack.
    </div>`;
  }

  sub.innerHTML=`<div style="padding:6px;">${html}</div>`;
}


// ═══════════════════════════════════════════════════════
// HEX HOVER PREVIEW — show intent before committing
// ═══════════════════════════════════════════════════════
function updateHexPreview(k,mx,my){
  const preview=document.getElementById('hex-preview');
  if(!k){preview.style.display='none';return;}
  const h=G.map[k];if(!h){preview.style.display='none';return;}
  const active=G.units[G.order[G.turn]];
  const unit=h.unit?G.units[h.unit]:null;

  // On a unit — show unit stats
  if(unit&&!mob()){
    document.getElementById('hpv-title').textContent=unit.name;
    const dead=!unit.alive||unit.hp<=0;
    const atks=iterativeAttacks(active?active._bab||0:0,active?sMod(active.stats?.STR||10):0);
    const hitPct=active?calcHitChance(atks[0],unit.ac):'-';
    const w=active?.weapon?WPN[active.weapon]:null;
    const avgDmg=w?Math.round(w.dmg[0]*(w.dmg[1]+1)/2+sMod(active?.stats?.STR||10)):'-';
    document.getElementById('hpv-body').innerHTML=`
      <div>HP: <span style="color:${dead?'#e74c3c':'var(--green2)'}">${dead?'Fallen':unit.hp+'/'+unit.max_hp}</span> · AC: ${unit.ac}</div>
      ${active&&unit.faction==='enemy'&&!dead?`<div class="hpv-hit">Hit chance: ${hitPct}%</div><div class="hpv-info">Expected damage: ~${Math.round(avgDmg*hitPct/100)}</div>`:''}
      ${unit.status?.sleep?'<div class="hpv-warn">💤 Sleeping</div>':''}
      ${unit.status?.held?'<div class="hpv-warn">🔒 Held</div>':''}
    `;
    preview.style.display='block';preview.style.left=(mx+14)+'px';preview.style.top=(my-8)+'px';
    return;
  }

  // On a movement hex
  if(h.hl==='move'&&active&&active.faction==='party'&&!G.moveUsed&&!mob()){
    const enemies=Object.values(G.units).filter(v=>v.faction==='enemy'&&v.alive&&v.hp>0&&v.hex);
    const w=active.weapon?WPN[active.weapon]:null;
    const rng=w&&w.type==='ranged'?Math.floor((w.r||5)/5):1;
    const inRangeAfter=enemies.filter(v=>hDist(k,v.hex)<=rng);
    document.getElementById('hpv-title').textContent='Move Here';
    document.getElementById('hpv-body').innerHTML=
      inRangeAfter.length
        ?`<div class="hpv-hit">After moving:</div><div>${inRangeAfter.map(v=>`${v.name} in attack range`).join('<br>')}</div>`
        :`<div class="hpv-info">No enemies in attack range</div><div style="color:var(--text3);">Distance: ${active.hex?Math.round(hDist(active.hex,k)):'-'} hexes</div>`;
    preview.style.display='block';preview.style.left=(mx+14)+'px';preview.style.top=(my-8)+'px';
    return;
  }

  if(h.hl==='charge'&&active&&active.faction==='party'&&!mob()){
    document.getElementById('hpv-title').textContent='Charge Range';
    document.getElementById('hpv-body').innerHTML='<div class="hpv-warn">Select ⚡ Charge in Attack panel<br>to move here and attack (+2 atk, −2 AC)</div>';
    preview.style.display='block';preview.style.left=(mx+14)+'px';preview.style.top=(my-8)+'px';
    return;
  }

  preview.style.display='none';
}

// ═══════════════════════════════════════════════════════
// ENEMY PERSONALITIES
// ═══════════════════════════════════════════════════════
const ENEMY_AI={
  // Returns behaviour tag from monster key
  behaviour(mk){
    return{
      'Goblin':'archer',   // retreat if adjacent
      'Goblin Scout':'archer',
      'Goblin Archer':'archer',
      'Orc':'charger',     // prefer charge
      'Orc Warrior':'charger',
      'Orc Brute':'charger',
      'Hobgoblin':'flanker',
      'Skeleton':'fearless',// ignore morale/retreat
      'Giant Spider':'poisoner',// prioritise poisoned target
    }[mk]||'basic';
  },
  // Choose target based on behaviour
  chooseTarget(e,aliveParty){
    const mk=e._mk||'';const beh=this.behaviour(mk);
    if(beh==='poisoner'){const pois=aliveParty.filter(u=>u.status?.poisoned);if(pois.length)return pois[0];}
    if(beh==='flanker'){// target lowest AC
      return aliveParty.sort((a,b)=>a.ac-b.ac)[0];}
    return aliveParty[~~(Math.random()*aliveParty.length)];
  },
  // Should this enemy retreat?
  shouldRetreat(e){
    const mk=e._mk||'';const beh=this.behaviour(mk);
    const pct=e.hp/e.max_hp;
    if(beh==='archer'&&e.hex){
      // Retreat if adjacent to any party member
      const adj=Object.values(G.units).some(u=>u.faction==='party'&&u.alive&&u.hex&&hDist(e.hex,u.hex)<=1.5);
      return adj;
    }
    if(beh==='fearless')return false;
    return pct<0.2&&beh!=='charger';// others flee at 20% hp
  },
  // Should this enemy charge?
  shouldCharge(e,tgt){
    const mk=e._mk||'';const beh=this.behaviour(mk);
    if(!e.hex||!tgt.hex)return false;
    const dist=hDist(e.hex,tgt.hex);
    return(beh==='charger'&&dist>1.5&&dist<=(e._spd||6)*2+1);
  },
};

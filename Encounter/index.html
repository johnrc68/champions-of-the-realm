<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>Overhead Combat</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════════
   TOKENS
═══════════════════════════════════════════════ */
:root{
  --bg:#0a0b0e;--bg2:#111318;--bg3:#181c24;--bg4:#1e2330;
  --panel:#13161d;--border:#2a3040;--border2:#3a4560;
  --gold:#c8a24a;--gold2:#e8c870;
  --red:#c0392b;--red2:#e74c3c;
  --green:#27ae60;--green2:#58d68d;
  --orange:#e67e22;--orange2:#f0a040;
  --blue2:#5dade2;--purple2:#bb8fce;
  --text:#d4c9a8;--text2:#9a8e72;--text3:#6a6050;--white:#f0ead8;
  --fd:'Cinzel',serif;--fb:'Crimson Pro',Georgia,serif;
  --tap:48px;
  --hl-move:rgba(39,174,96,.28);
  --hl-charge:rgba(230,126,34,.26);
  --hl-atk:rgba(192,57,43,.3);
  --hl-sel:rgba(162,105,215,.28);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{height:100%;overflow:hidden;}
body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;}

/* ═══════════════════════════════════════════════
   PORTRAIT-PHONE ROTATION WRAPPER
   We rotate the entire app 90° so the hex map
   always runs left-to-right regardless of how
   the phone is held.
═══════════════════════════════════════════════ */
#rotate-wrap{
  width:100%;height:100%;
  display:flex;flex-direction:column;
}
/* On a portrait phone (<600px wide AND taller than wide):
   rotate the wrapper 90° counter-clockwise and swap
   its dimensions so it fills the screen rotated.        */
@media (max-width:599px) and (orientation:portrait){
  #rotate-wrap{
    position:fixed;
    /* Rotate around centre */
    transform-origin:50% 50%;
    transform:rotate(90deg);
    /* After rotation width becomes height and vice versa */
    width:100vh;
    height:100vw;
    /* Re-centre after rotation */
    top:calc((100vh - 100vw)/2);
    left:calc((100vw - 100vh)/2);
    overflow:hidden;
  }
}

/* ═══════════════════════════════════════════════
   TITLE BAR
═══════════════════════════════════════════════ */
#titlebar{
  background:linear-gradient(90deg,var(--bg2),var(--bg3),var(--bg2));
  border-bottom:1px solid var(--gold);height:36px;
  padding:0 10px;display:flex;align-items:center;
  justify-content:space-between;flex-shrink:0;z-index:10;
}
#titlebar h1{font-family:var(--fd);font-size:10px;letter-spacing:3px;color:var(--gold2);text-transform:uppercase;}
#round-badge{font-family:var(--fd);font-size:9px;color:var(--gold);letter-spacing:2px;padding:2px 7px;border:1px solid var(--gold);border-radius:2px;}
#phase-badge{font-size:10px;color:var(--text2);font-style:italic;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ═══════════════════════════════════════════════
   TURN BANNER
═══════════════════════════════════════════════ */
#turn-banner{
  padding:4px 10px;height:58px;display:flex;align-items:center;gap:10px;
  background:var(--bg3);border-bottom:1px solid var(--border2);flex-shrink:0;
}
#tb-portrait{width:48px;height:48px;border-radius:5px;background:var(--bg4);border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:22px;overflow:hidden;flex-shrink:0;box-shadow:0 0 10px rgba(200,162,74,.5);}
#tb-portrait img{width:100%;height:100%;object-fit:cover;}
#tb-name{font-family:var(--fd);font-size:14px;color:var(--gold2);letter-spacing:.5px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#tb-hint{font-size:10px;color:var(--text2);font-style:italic;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px;}
#tb-endturn{padding:3px 10px;background:transparent;border:1px solid var(--gold);border-radius:3px;color:var(--gold2);font-family:var(--fd);font-size:8px;letter-spacing:1.5px;cursor:pointer;flex-shrink:0;min-height:28px;text-transform:uppercase;display:none;}
#tb-endturn.show{display:block;}
#tb-endturn:active{background:var(--gold);color:var(--bg);}
#action-pips{display:flex;gap:4px;flex-shrink:0;}
.pip{width:9px;height:9px;border-radius:50%;border:1px solid var(--border2);}
.pip.move-pip{background:var(--green2);}
.pip.std-pip{background:var(--gold2);}
.pip.used{background:var(--border2)!important;}

/* ═══════════════════════════════════════════════
   MAIN SHELL — always fills remaining height
═══════════════════════════════════════════════ */
#shell{
  display:flex;flex:1;
  /* height = total - titlebar - turn-banner */
  height:calc(100% - 36px - 34px);
  overflow:hidden;
  position:relative;
}

/* ═══════════════════════════════════════════════
   PARTY PANEL
   Desktop  : fixed left column 148px
   Tablet   : off-screen drawer (slides in from left)
   Phone    : full-screen overlay
═══════════════════════════════════════════════ */
#party-panel{
  width:220px;flex-shrink:0;
  background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;overflow-y:auto;
  -webkit-overflow-scrolling:touch;
}
@media(max-width:1024px){
  #party-panel{
    position:fixed;inset:0;z-index:80;
    width:220px;
    transform:translateX(-100%);
    transition:transform .22s ease;
    box-shadow:4px 0 28px rgba(0,0,0,.7);
  }
  #party-panel.open{transform:translateX(0);}
}

/* ═══════════════════════════════════════════════
   CENTER — map + init bar + log
═══════════════════════════════════════════════ */
#center-col{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
#map-wrap{flex:1;overflow:hidden;position:relative;min-height:0;}
#mcw{
  width:100%;height:100%;
  overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
/* Canvas stretches to fill #mcw, maintaining aspect ratio */
#hex-canvas{display:block;touch-action:none;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;}
#map-btns{position:absolute;top:6px;right:6px;display:flex;gap:4px;z-index:5;}
.mbtn{
  padding:5px 8px;background:rgba(8,9,12,.92);
  border:1px solid var(--border2);border-radius:3px;
  color:var(--text2);font-family:var(--fd);font-size:9px;
  letter-spacing:1px;cursor:pointer;min-height:32px;
}
.mbtn:active{border-color:var(--gold);color:var(--gold);}
#mleg-btn{position:absolute;bottom:6px;left:6px;z-index:5;padding:3px 7px;background:rgba(8,9,12,.88);border:1px solid var(--border);border-radius:2px;color:var(--text3);font-family:var(--fd);font-size:8px;letter-spacing:1px;cursor:pointer;}
#mleg{position:absolute;bottom:28px;left:6px;z-index:6;background:rgba(8,9,12,.96);border:1px solid var(--border);padding:6px 9px;font-size:10px;color:var(--text2);border-radius:3px;display:none;}
#mleg.show{display:block;}
.li{display:flex;align-items:center;gap:5px;margin-bottom:2px;}
.ls{width:9px;height:9px;border-radius:1px;flex-shrink:0;}

/* ═══════════════════════════════════════════════
   INITIATIVE BAR
   Phone landscape: slim (36px), portrait rotated: normal
═══════════════════════════════════════════════ */
#init-track{
  background:linear-gradient(90deg,var(--bg2),#0d1018,var(--bg2));
  border-top:1px solid var(--border);
  padding:6px 12px;display:flex;align-items:center;gap:8px;
  flex-shrink:0;overflow-x:auto;
  min-height:56px;max-height:80px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
#init-track::-webkit-scrollbar{display:none;}
/* Desktop: larger initiative portraits */
@media(min-width:1025px){
  #init-track{min-height:72px;max-height:90px;gap:10px;padding:8px 16px;}
}
.il{font-family:var(--fd);font-size:8px;letter-spacing:2px;color:var(--text3);flex-shrink:0;}
.iu{display:flex;flex-direction:column;align-items:center;gap:2px;flex-shrink:0;padding:4px 6px;border-radius:6px;border:1px solid var(--border);min-width:50px;position:relative;cursor:pointer;transition:all .2s;opacity:.6;}
.iu:hover{opacity:1;}
.iu.act2{border-color:var(--gold);background:var(--bg4);opacity:1;transform:scale(1.45);box-shadow:0 0 22px rgba(200,162,74,.7);z-index:2;}
.iu.act2.enemy{border-color:var(--red2);box-shadow:0 0 22px rgba(231,76,60,.7);}
.iu.upcoming{opacity:.82;}
.iu.dead2{opacity:.2;filter:grayscale(1);}
/* Portrait: 32px mobile, 44px desktop */
.ip{width:32px;height:32px;border-radius:4px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:16px;overflow:hidden;border:1px solid rgba(255,255,255,.08);}
.ip img{width:100%;height:100%;object-fit:cover;}
@media(min-width:1025px){.ip{width:44px;height:44px;font-size:22px;border-radius:5px;}}
.iu.act2:not(.enemy) .ip{border:2px solid var(--green2);}
.iu.act2.enemy .ip{border:2px solid var(--red2);}
.in{font-size:8px;color:var(--text2);white-space:nowrap;max-width:52px;overflow:hidden;text-overflow:ellipsis;text-align:center;}
@media(min-width:1025px){.in{font-size:9px;max-width:60px;}}
.inum{position:absolute;top:-6px;right:-6px;background:var(--gold);color:var(--bg);font-family:var(--fd);font-size:7px;width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--bg2);}
.iu.enemy .inum{background:var(--red2);color:#fff;}
.iu.dead2 .inum{background:var(--border2);}

/* ═══════════════════════════════════════════════
   COMBAT LOG
   Phone: very slim (56px), can tap to expand
═══════════════════════════════════════════════ */
#logpanel{
  height:130px;flex-shrink:0;
  background:var(--bg2);border-top:1px solid var(--border);
  overflow-y:auto;padding:2px 10px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:thin;
  transition:height .2s;
  display:flex;flex-direction:column;
}
/* New entries stack at bottom; scroll wrapper fills panel */
#log-entries{
  display:flex;flex-direction:column;
  justify-content:flex-end;
  min-height:100%;
}
@media(min-width:1025px){#logpanel{height:150px;font-size:12px;}}
@media(min-width:1025px){#logpanel.expanded{height:260px;}}
#logpanel.expanded{height:200px;}
/* On phone (rotated), log is slim — tap header to expand */
@media(max-width:599px){#logpanel{height:70px;}}
.lh{
  font-family:var(--fd);font-size:8px;letter-spacing:2px;color:var(--text3);
  padding:2px 0;border-bottom:1px solid var(--border);margin-bottom:2px;
  position:sticky;top:0;background:var(--bg2);cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;
}
.lh::after{content:'▲';font-size:7px;opacity:.5;}
#logpanel.expanded .lh::after{content:'▼';}
.le{font-size:10px;color:var(--text2);padding:1px 0;border-bottom:1px solid rgba(42,48,64,.3);line-height:1.5;}
.le.hit{color:var(--orange2);}.le.miss{color:var(--text3);}.le.crit{color:var(--gold2);font-weight:600;}
.le.death{color:var(--red2);}.le.spell{color:var(--purple2);}.le.heal{color:var(--green2);}
.le.sys{color:var(--blue2);font-style:italic;}.le.sep{color:var(--gold);font-family:var(--fd);font-size:8px;letter-spacing:2px;text-align:center;padding:2px 0;}

/* ═══════════════════════════════════════════════
   ACTION PANEL
   Desktop  : fixed right column 220px
   Tablet   : off-screen drawer from right
   Phone    : slides up from bottom (80% height)
═══════════════════════════════════════════════ */
#action-panel{
  width:300px;flex-shrink:0;
  background:var(--panel);border-left:1px solid var(--border);
  display:flex;flex-direction:column;overflow:hidden;min-height:0;
}
@media(max-width:1024px){
  #action-panel{
    position:fixed;right:0;top:0;bottom:0;z-index:80;
    width:260px;
    transform:translateX(100%);
    transition:transform .22s ease;
    box-shadow:-4px 0 28px rgba(0,0,0,.7);
  }
  #action-panel.open{transform:translateX(0);}
}
/* Phone: bottom sheet */
@media(max-width:599px){
  #action-panel{
    position:fixed;
    left:0;right:0;bottom:0;top:auto;
    width:100%;
    height:72vh;
    border-left:none;
    border-top:2px solid var(--gold);
    border-radius:14px 14px 0 0;
    transform:translateY(100%);
    transition:transform .25s cubic-bezier(.2,.8,.4,1);
    box-shadow:0 -8px 40px rgba(0,0,0,.7);
  }
  #action-panel.open{transform:translateY(0);}
}
.ap-hdr{
  background:var(--bg2);border-bottom:1px solid var(--border);
  padding:8px 12px;flex-shrink:0;
  display:flex;align-items:flex-start;justify-content:space-between;
}
/* Drag handle on phone bottom sheet */
@media(max-width:599px){
  .ap-hdr::before{
    content:'';display:block;position:absolute;
    top:6px;left:50%;transform:translateX(-50%);
    width:36px;height:4px;border-radius:2px;
    background:var(--border2);
  }
  .ap-hdr{position:relative;padding-top:16px;}
}
.ap-name{font-family:var(--fd);font-size:12px;color:var(--gold2);letter-spacing:1px;}
.ap-sub{font-size:10px;color:var(--text2);font-style:italic;margin-top:1px;}
.ap-close{background:transparent;border:none;color:var(--text3);font-size:20px;cursor:pointer;padding:0 4px;line-height:1;display:none;}
@media(max-width:1024px){.ap-close{display:block;}}

/* ═══════════════════════════════════════════════
   ACTION ECONOMY BAR (inside panel)
═══════════════════════════════════════════════ */
#ap-econ{display:flex;align-items:center;gap:8px;padding:4px 10px;background:var(--bg3);border-bottom:1px solid var(--border);font-size:10px;flex-shrink:0;}
.econ-item{display:flex;align-items:center;gap:4px;color:var(--text2);}
.econ-dot{width:9px;height:9px;border-radius:50%;}
.econ-dot.avail{border:1.5px solid;}
.econ-dot.used{background:var(--border2)!important;border:1.5px solid var(--border2)!important;}
.asect{font-family:var(--fd);font-size:7px;letter-spacing:2.5px;color:var(--text3);text-transform:uppercase;padding:6px 4px 3px;border-bottom:1px solid var(--border);margin-bottom:3px;display:flex;align-items:center;gap:6px;}
.asect-tag{font-size:7px;padding:1px 5px;border-radius:2px;font-family:var(--fd);}

/* ═══════════════════════════════════════════════
   MOBILE BOTTOM NAV BAR
   Shown on phone (portrait or landscape).
   In portrait, the phone is rotated so this bar
   appears along the rotated "bottom" = right edge.
═══════════════════════════════════════════════ */
#bottom-nav{
  display:none;
  position:fixed;bottom:0;left:0;right:0;z-index:90;
  background:var(--bg2);border-top:1px solid var(--border2);
  height:52px;
  padding-bottom:env(safe-area-inset-bottom);
  /* backdrop-filter:blur(12px); removed — caused full-screen blur */
  /* -webkit-backdrop-filter:blur(12px); */
}
@media(max-width:1024px){#bottom-nav{display:flex;}}
.bnav-btn{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  background:transparent;border:none;
  color:var(--text3);font-family:var(--fd);font-size:7px;
  letter-spacing:1px;text-transform:uppercase;
  cursor:pointer;min-height:100%;padding:4px 0;
  transition:color .15s;
}
.bnav-btn .bico{font-size:17px;line-height:1;}
.bnav-btn.on{color:var(--gold2);}
.bnav-btn.act-ready{color:var(--green2);}

/* When bottom nav is visible, shell needs to shrink to not go under it */
@media(max-width:1024px){
  #shell{height:calc(100% - 36px - 34px - 52px - env(safe-area-inset-bottom));}
  #big-endturn{bottom:62px;}
}

/* ═══════════════════════════════════════════════
   BIG FLOATING END TURN (phone only)
═══════════════════════════════════════════════ */
#no-actions-msg{
  display:none;position:fixed;bottom:78px;left:50%;
  transform:translateX(-50%);z-index:61;
  background:rgba(10,11,14,.92);border:1px solid var(--gold);
  border-radius:4px;padding:6px 18px;
  font-family:var(--fd);font-size:11px;letter-spacing:1.5px;
  color:var(--gold2);text-transform:uppercase;white-space:nowrap;
  pointer-events:none;
}
#no-actions-msg.show{display:block;}
#big-endturn{
  display:none;
  position:fixed;bottom:24px;left:50%;
  transform:translateX(-50%);
  background:linear-gradient(135deg,#c8a24a,#a07830);
  border:2px solid #e8c870;border-radius:6px;
  color:#0a0b0e;font-family:var(--fd);font-size:13px;letter-spacing:2.5px;
  padding:13px 40px;cursor:pointer;z-index:60;
  box-shadow:0 4px 28px rgba(200,162,74,.7);
  text-transform:uppercase;min-width:200px;text-align:center;
  white-space:nowrap;font-weight:700;
}
#big-endturn.show{display:block;}
/* #big-endturn always visible when actions spent — no desktop hide */

/* ═══════════════════════════════════════════════
   DRAWERS / SCRIM
═══════════════════════════════════════════════ */
#drawer-scrim{position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.55);display:none;/* backdrop-filter:blur(2px); removed — caused full-screen blur */}
#drawer-scrim.show{display:block;}
#tp-scrim{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.55);display:none;}
#tp-scrim.show{display:block;}

/* ═══════════════════════════════════════════════
   PARTY CARDS — compact narrow column
═══════════════════════════════════════════════ */
.ph{font-family:var(--fd);font-size:9px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;padding:6px 8px 5px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.ph-x{background:transparent;border:none;color:var(--text3);font-size:18px;cursor:pointer;display:none;}
@media(max-width:1024px){.ph-x{display:block;}}
.cc{padding:5px 7px;border-bottom:1px solid var(--border);cursor:pointer;position:relative;display:flex;align-items:flex-start;gap:6px;min-height:38px;}
.cc:active{background:var(--bg3);}
.cc.sel{background:var(--bg4);border-left:2px solid var(--gold);}
.cc.my-turn{background:rgba(39,174,96,.05);border-left:2px solid var(--green2);}
.cc.dead{opacity:.38;cursor:not-allowed;}
.cp{width:28px;height:28px;border-radius:2px;border:1px solid var(--border2);background:var(--bg3);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;margin-top:1px;}
.cp img{width:100%;height:100%;object-fit:cover;display:block;}
.sk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,4,4,.88);font-size:12px;gap:0;}
.sk span{font-size:6px;font-family:var(--fd);color:#e07070;text-align:center;line-height:1.2;}
.ci{flex:1;min-width:0;display:flex;flex-direction:column;gap:0;}
.cn{font-family:var(--fd);font-size:9px;color:var(--white);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;}
.ccl{font-size:9px;color:var(--text2);font-style:italic;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hbw{display:flex;align-items:center;gap:3px;margin-top:2px;}
.hb{flex:1;height:3px;background:var(--bg);border-radius:2px;overflow:hidden;}
.hf{height:100%;border-radius:2px;transition:width .3s;}
.ht{font-size:9px;color:var(--text2);white-space:nowrap;}
.sr{display:flex;flex-direction:column;gap:0;margin-top:1px;}
.srow{display:flex;justify-content:space-between;font-size:9px;line-height:1.4;}
.sl{color:var(--text3);}.sv{color:var(--text2);}

/* Action cards — visual hierarchy by type */
.acard{
  width:100%;background:var(--bg3);border:1px solid var(--border);
  border-radius:7px;padding:11px 12px;margin-bottom:6px;
  cursor:pointer;text-align:left;color:var(--text);
  font-family:var(--fb);font-size:14px;
  display:flex;align-items:flex-start;gap:10px;
  min-height:var(--tap);transition:all .14s;
  position:relative;-webkit-appearance:none;
  /* Subtle left-edge accent */
  border-left-width:3px;
}
/* Attack cards — gold left border (primary) */
.acard.atk-card{border-left-color:var(--gold);}
.acard.atk-card:not([disabled]):hover,.acard.atk-card:active:not([disabled]){
  background:rgba(200,162,74,.08);border-color:var(--gold);
  box-shadow:inset 0 0 0 1px rgba(200,162,74,.15);
}
/* Spell / ability cards — purple */
.acard.spl-card{border-left-color:var(--purple2);}
.acard.spl-card:not([disabled]):hover,.acard.spl-card:active:not([disabled]){
  background:rgba(142,68,173,.1);border-color:var(--purple2);
}
/* Heal cards — green */
.acard.heal-card{border-left-color:var(--green2);}
.acard.heal-card:not([disabled]):hover,.acard.heal-card:active:not([disabled]){
  background:rgba(39,174,96,.1);border-color:var(--green2);
}
/* Tactical cards — steel blue */
.acard.tac-card{border-left-color:var(--blue2);}
.acard.tac-card:not([disabled]):hover,.acard.tac-card:active:not([disabled]){
  background:rgba(41,128,185,.1);border-color:var(--blue2);
}
/* Flee / danger — red */
.acard.flee-card{border-left-color:var(--red2);}
.acard.flee-card:not([disabled]):hover,.acard.flee-card:active:not([disabled]){
  background:rgba(192,57,43,.1);border-color:var(--red2);
}
/* Charge — orange */
.acard.charge-style{border-left-color:var(--orange);border-color:rgba(230,126,34,.4);}
.acard.charge-style:not([disabled]):hover,.acard.charge-style:active:not([disabled]){
  background:rgba(230,126,34,.1);border-color:var(--orange2);
}
.acard[disabled]{opacity:.28;cursor:not-allowed;}
.acard.done{border-color:var(--green)!important;background:rgba(39,174,96,.07)!important;}
.aci{font-size:20px;flex-shrink:0;margin-top:2px;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4));}
.acb{flex:1;min-width:0;}
.acn{font-family:var(--fd);font-size:11px;letter-spacing:.5px;color:inherit;}
.acd{font-size:11px;color:var(--text2);font-style:italic;margin-top:2px;line-height:1.4;}
.act-tags{display:flex;gap:4px;margin-top:4px;flex-wrap:wrap;}
.act-tag{font-size:9px;padding:2px 6px;border-radius:3px;letter-spacing:.5px;font-family:var(--fd);}
.done-badge{position:absolute;top:8px;right:10px;font-size:10px;color:var(--green2);font-family:var(--fd);}

#panel-endturn{margin:6px 8px 8px;padding:13px;background:transparent;border:2px solid var(--gold);border-radius:6px;color:var(--gold2);font-family:var(--fd);font-size:11px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;width:calc(100% - 16px);display:none;}
#panel-endturn.show{display:block;}
#panel-endturn:active{background:var(--gold);color:var(--bg);}

/* TARGET PICKER */
#target-picker{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--bg2);border-top:2px solid var(--gold);border-radius:16px 16px 0 0;padding:0 0 env(safe-area-inset-bottom);transform:translateY(100%);transition:transform .28s ease;max-height:72vh;display:flex;flex-direction:column;}
#target-picker.show{transform:translateY(0);}
#tp-header{padding:13px 16px 9px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#tp-title{font-family:var(--fd);font-size:12px;color:var(--gold2);letter-spacing:1.5px;}
#tp-close{background:transparent;border:none;color:var(--text3);font-size:22px;cursor:pointer;padding:0;}
#tp-list{overflow-y:auto;padding:0 8px 12px;-webkit-overflow-scrolling:touch;}
.tp-enemy{
  display:flex;align-items:center;gap:12px;padding:12px 11px;
  background:var(--bg3);border:1px solid var(--border);border-left:3px solid var(--red2);
  border-radius:7px;margin-bottom:7px;cursor:pointer;min-height:var(--tap);
  transition:all .14s;position:relative;
}
.tp-enemy:hover:not(.ally){background:rgba(192,57,43,.1);border-color:var(--red2);}
.tp-enemy:active{background:rgba(192,57,43,.18);}
.tp-enemy.ally{border-left-color:var(--green2);}
.tp-enemy.ally:hover{background:rgba(39,174,96,.1);border-color:var(--green2);}
.tp-enemy.ally:active{background:rgba(39,174,96,.18);}
.tp-portrait{
  width:44px;height:44px;border-radius:5px;background:var(--bg4);
  display:flex;align-items:center;justify-content:center;font-size:22px;
  overflow:hidden;flex-shrink:0;border:1px solid rgba(255,255,255,.08);
}
.tp-portrait img{width:100%;height:100%;object-fit:cover;}
.tp-info{flex:1;min-width:0;}
.tp-name{font-family:var(--fd);font-size:12px;color:var(--white);letter-spacing:.5px;}
.tp-hp-row{display:flex;align-items:center;gap:6px;margin-top:5px;}
.tp-hb{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;}
.tp-hf{height:100%;border-radius:3px;}
.tp-ht{font-size:11px;color:var(--text2);white-space:nowrap;}
.tp-stats{font-size:10px;color:var(--text3);margin-top:3px;}
/* Hit chance badge — big and prominent */
.tp-hit-badge{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  text-align:center;flex-shrink:0;
}
.tp-hit-pct{
  font-family:var(--fd);font-size:16px;font-weight:700;line-height:1;
  display:block;
}
.tp-hit-label{font-size:8px;letter-spacing:1px;color:var(--text3);font-family:var(--fd);}
.tp-edm{font-size:10px;color:var(--text2);margin-top:1px;}

/* DRAWERS + SCRIM */
#drawer-scrim{position:fixed;inset:0;z-index:79;background:rgba(0,0,0,.5);display:none;/* no blur */}
#drawer-scrim.show{display:block;}
#tp-scrim{position:fixed;inset:0;z-index:99;background:rgba(0,0,0,.5);display:none;}
#tp-scrim.show{display:block;}

/* MOBILE BOTTOM NAV */
#bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:90;background:var(--bg2);border-top:1px solid var(--border);height:56px;padding-bottom:env(safe-area-inset-bottom);}
@media(max-width:599px){#bottom-nav{display:flex;}}
.bnav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:transparent;border:none;color:var(--text3);font-family:var(--fd);font-size:8px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;min-height:100%;padding:4px 0;}
.bnav-btn .bico{font-size:18px;line-height:1;}
.bnav-btn.on{color:var(--gold2);}
.bnav-btn.act-ready{color:var(--green2);}

/* PARTY CARDS — compact narrow column */
.ph{font-family:var(--fd);font-size:9px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;padding:6px 8px 5px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.ph-x{background:transparent;border:none;color:var(--text3);font-size:18px;cursor:pointer;display:none;}
@media(max-width:899px){.ph-x{display:block;}}
/* Each card: portrait left, all text right in tight column */
.cc{padding:5px 7px;border-bottom:1px solid var(--border);cursor:pointer;position:relative;display:flex;align-items:flex-start;gap:6px;min-height:38px;}
.cc:active{background:var(--bg3);}
.cc.sel{background:var(--bg4);border-left:2px solid var(--gold);}
.cc.my-turn{background:rgba(39,174,96,.05);border-left:2px solid var(--green2);}
.cc.dead{opacity:.38;cursor:not-allowed;}
/* Portrait — small square */
.cp{width:28px;height:28px;border-radius:2px;border:1px solid var(--border2);background:var(--bg3);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;position:relative;margin-top:1px;}
.cp img{width:100%;height:100%;object-fit:cover;display:block;}
.sk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(8,4,4,.88);font-size:12px;gap:0;}
.sk span{font-size:6px;font-family:var(--fd);color:#e07070;text-align:center;line-height:1.2;}
/* Text column — everything stacked vertically */
.ci{flex:1;min-width:0;display:flex;flex-direction:column;gap:0;}
.cn{font-family:var(--fd);font-size:9px;color:var(--white);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3;}
.ccl{font-size:9px;color:var(--text2);font-style:italic;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* HP bar — full width of text column */
.hbw{display:flex;align-items:center;gap:3px;margin-top:2px;}
.hb{flex:1;height:3px;background:var(--bg);border-radius:2px;overflow:hidden;}
.hf{height:100%;border-radius:2px;transition:width .3s;}
.ht{font-size:9px;color:var(--text2);white-space:nowrap;}
/* Stats — one per line */
.sr{display:flex;flex-direction:column;gap:0;margin-top:1px;}
.srow{display:flex;justify-content:space-between;font-size:9px;line-height:1.4;}
.sl{color:var(--text3);}.sv{color:var(--text2);}

/* TOOLTIP */
#tt{position:fixed;background:var(--bg2);border:1px solid var(--gold);border-radius:4px;padding:8px 10px;font-size:11px;color:var(--text);max-width:220px;pointer-events:none;z-index:1000;display:none;line-height:1.6;box-shadow:0 4px 18px rgba(0,0,0,.6);}
@media(max-width:599px){#tt{display:none!important;}}
.ttn{font-family:var(--fd);font-size:10px;color:var(--gold2);margin-bottom:3px;}

/* MODAL */
#covr{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;z-index:200;padding:16px;}
#cbox{background:var(--bg2);border:1px solid var(--gold);border-radius:8px;padding:20px;max-width:380px;width:100%;text-align:center;}
#ctitle{font-family:var(--fd);font-size:14px;color:var(--gold2);letter-spacing:2px;margin-bottom:10px;}
#cmsg{font-size:13px;color:var(--text);margin-bottom:14px;line-height:1.6;}
.cbtns{display:flex;gap:10px;justify-content:center;}
.cb{padding:11px 18px;border-radius:4px;font-family:var(--fd);font-size:10px;letter-spacing:1.5px;cursor:pointer;border:1px solid var(--gold);background:transparent;color:var(--gold2);text-transform:uppercase;min-height:var(--tap);}
.cb:active{background:var(--gold);color:var(--bg);}.cb.cx{border-color:var(--border2);color:var(--text2);}

/* RESULT OVERLAY */
#result-overlay{
  position:fixed;inset:0;
  background:radial-gradient(ellipse at center, rgba(18,14,24,.98) 40%, rgba(5,4,8,.99));
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:12px;padding:20px;
  text-align:center;z-index:300;overflow-y:auto;
}
#result-overlay.show-anim{animation:resultFadeIn .5s ease-out forwards;}
@keyframes resultFadeIn{
  0%{opacity:0;transform:scale(.96);}
  100%{opacity:1;transform:scale(1);}
}
/* Decorative top/bottom border lines */
#result-overlay::before,#result-overlay::after{
  content:'';display:block;width:min(400px,80%);height:1px;flex-shrink:0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
}
#result-title{
  font-family:var(--fd);font-size:clamp(22px,7vw,40px);
  letter-spacing:6px;text-transform:uppercase;
  text-shadow:0 0 40px currentColor;
}
#result-sub{font-size:clamp(11px,2.5vw,14px);color:var(--text2);width:100%;max-width:460px;}
.rbtn{
  padding:13px 28px;border-radius:4px;font-family:var(--fd);font-size:11px;
  letter-spacing:2px;cursor:pointer;border:1px solid var(--gold);
  background:transparent;color:var(--gold2);text-transform:uppercase;
  min-height:var(--tap);transition:all .2s;
  box-shadow:0 0 20px rgba(200,162,74,.15);
}
.rbtn:active,.rbtn:hover{background:rgba(200,162,74,.1);box-shadow:0 0 30px rgba(200,162,74,.3);}

/* TOAST */
#toast{position:fixed;bottom:68px;left:50%;transform:translateX(-50%);background:var(--bg4);border:1px solid var(--gold);border-radius:20px;padding:8px 18px;font-family:var(--fd);font-size:11px;color:var(--gold2);letter-spacing:1px;z-index:500;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;max-width:90vw;text-align:center;}
#toast.show{opacity:1;}
@media(max-width:599px){#toast{bottom:70px;}}

::-webkit-scrollbar{width:3px;height:3px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
@keyframes pg{0%,100%{box-shadow:0 0 4px rgba(200,162,74,.2);}50%{box-shadow:0 0 14px rgba(200,162,74,.5);}}
.pls{animation:pg 1.4s ease-in-out infinite;}
@keyframes charge-pulse{0%,100%{box-shadow:0 0 4px rgba(230,126,34,.2);}50%{box-shadow:0 0 14px rgba(230,126,34,.6);}}
.charge-hl{animation:charge-pulse 1s ease-in-out infinite;}

/* ── FLOATING COMBAT TEXT ── */
#float-layer{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:20;}
.float-num{
  position:absolute;font-family:var(--fd);font-weight:700;
  pointer-events:none;white-space:nowrap;text-align:center;
}
/* Damage — red, bold upward float */
.float-num.dmg{
  color:#ff3030;font-size:20px;
  text-shadow:0 0 8px rgba(255,48,48,.6),0 1px 3px rgba(0,0,0,.9);
  animation:floatDmg 1s cubic-bezier(.2,.8,.4,1) forwards;
}
/* Critical — gold, larger, shake */
.float-num.crit{
  color:var(--gold2);font-size:28px;
  text-shadow:0 0 16px rgba(232,200,112,.8),0 2px 4px rgba(0,0,0,.9);
  animation:floatCrit 1.2s cubic-bezier(.2,.8,.4,1) forwards;
}
/* Miss — grey, italic, small fade */
.float-num.miss{
  color:#888;font-size:13px;font-style:italic;
  text-shadow:0 1px 2px rgba(0,0,0,.8);
  animation:floatMiss .8s ease-out forwards;
}
/* Heal — green, soft rise */
.float-num.heal{
  color:var(--green2);font-size:17px;
  text-shadow:0 0 10px rgba(88,214,141,.5),0 1px 3px rgba(0,0,0,.8);
  animation:floatHeal 1s cubic-bezier(.2,.8,.4,1) forwards;
}
@keyframes floatDmg{
  0%  {opacity:1;transform:translateY(0) scale(.8);}
  15% {transform:translateY(-8px) scale(1.2);}
  60% {opacity:1;transform:translateY(-38px) scale(1);}
  100%{opacity:0;transform:translateY(-58px) scale(.85);}
}
@keyframes floatCrit{
  0%  {opacity:1;transform:translateY(0) scale(.7) rotate(-3deg);}
  10% {transform:translateY(-4px) scale(1.35) rotate(2deg);}
  20% {transform:translateY(-10px) scale(1.2) rotate(-1deg);}
  60% {opacity:1;transform:translateY(-44px) scale(1.05) rotate(0);}
  100%{opacity:0;transform:translateY(-68px) scale(.9);}
}
@keyframes floatMiss{
  0%  {opacity:.8;transform:translateY(0) scale(1);}
  100%{opacity:0;transform:translateY(-24px) scale(.9);}
}
@keyframes floatHeal{
  0%  {opacity:1;transform:translateY(0) scale(.9);}
  20% {transform:translateY(-12px) scale(1.1);}
  60% {opacity:1;transform:translateY(-36px) scale(1);}
  100%{opacity:0;transform:translateY(-54px) scale(.9);}
}

/* ── ATTACK / SPELL ANIMATION CANVAS ── */
#anim-canvas{position:absolute;inset:0;pointer-events:none;z-index:15;}

/* ── HEX PREVIEW TOOLTIP ── */
#hex-preview{
  position:absolute;pointer-events:none;z-index:30;
  background:rgba(10,11,14,.92);border:1px solid var(--border2);
  border-radius:4px;padding:6px 9px;font-size:11px;color:var(--text);
  max-width:160px;line-height:1.5;display:none;
  box-shadow:0 2px 12px rgba(0,0,0,.6);
}
#hex-preview .hpv-title{font-family:var(--fd);font-size:9px;color:var(--gold2);letter-spacing:1px;margin-bottom:3px;}
#hex-preview .hpv-hit{color:var(--green2);}
#hex-preview .hpv-warn{color:var(--orange2);}
#hex-preview .hpv-info{color:var(--text2);font-style:italic;}

/* ── ACTION CATEGORIES (3 primary buttons) ── */
.act-cats{display:flex;gap:6px;padding:8px 8px 4px;flex-shrink:0;}
/* Attack — gold (primary) */
.act-cat{
  flex:1;padding:9px 4px 7px;border-radius:6px;
  border:1px solid var(--border);background:var(--bg3);
  cursor:pointer;text-align:center;
  font-family:var(--fd);font-size:8px;letter-spacing:1.5px;color:var(--text2);
  text-transform:uppercase;transition:all .16s;min-height:58px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  -webkit-appearance:none;position:relative;overflow:hidden;
}
/* Subtle inner highlight line */
.act-cat::after{
  content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
  background:rgba(255,255,255,.04);border-radius:0 0 4px 4px;
}
.act-cat .cat-ico{font-size:22px;line-height:1;transition:transform .16s;}
.act-cat:active:not([disabled]) .cat-ico{transform:scale(.9);}
.act-cat[disabled]{opacity:.28;cursor:not-allowed;}

/* Attack — gold accent */
#cat-atk{border-color:rgba(200,162,74,.3);}
#cat-atk:not([disabled]):hover,#cat-atk.cat-active{
  background:rgba(200,162,74,.1);border-color:var(--gold);color:var(--gold2);
  box-shadow:0 2px 12px rgba(200,162,74,.18);
}
/* Ability — purple accent */
#cat-abi{border-color:rgba(187,143,206,.25);}
#cat-abi:not([disabled]):hover,#cat-abi.cat-active{
  background:rgba(142,68,173,.12);border-color:var(--purple2);color:var(--purple2);
  box-shadow:0 2px 12px rgba(142,68,173,.2);
}
/* Tactical — steel blue accent */
#cat-tac{border-color:rgba(93,173,226,.25);}
#cat-tac:not([disabled]):hover,#cat-tac.cat-active{
  background:rgba(41,128,185,.12);border-color:var(--blue2);color:var(--blue2);
  box-shadow:0 2px 12px rgba(41,128,185,.18);
}
.act-cat.cat-done{border-color:var(--green)!important;color:var(--green2)!important;background:rgba(39,174,96,.08)!important;}
.act-cat .cat-badge{font-size:8px;color:var(--text3);font-style:italic;font-family:var(--fb);margin-top:1px;}

/* Sub-actions (shown after category tap) */
#act-sub{flex:1;overflow-y:auto;padding:4px 6px;-webkit-overflow-scrolling:touch;min-height:0;}

/* Recommend banner */
#rec-banner{
  padding:6px 10px;background:rgba(39,174,96,.08);border-bottom:1px solid rgba(39,174,96,.2);
  font-size:11px;flex-shrink:0;display:none;
}
#rec-banner .rec-title{font-family:var(--fd);font-size:8px;letter-spacing:2px;color:var(--green2);text-transform:uppercase;}
#rec-banner .rec-body{color:var(--text);margin-top:1px;}
#rec-banner .rec-stats{color:var(--text2);font-size:10px;font-style:italic;}

/* Log rows — simple default, expandable detail */
.le-wrap{border-bottom:1px solid rgba(42,48,64,.3);}
.le-simple{font-size:12px;color:var(--text2);padding:2px 0;cursor:pointer;line-height:1.5;display:flex;align-items:baseline;gap:4px;}
.le-simple:hover .le-exp-hint{opacity:1;}
.le-exp-hint{font-size:9px;color:var(--text3);opacity:0;transition:opacity .2s;flex-shrink:0;}
.le-detail{font-size:10px;color:var(--text3);padding:1px 0 3px 14px;font-style:italic;display:none;}
.le-detail.show{display:block;}
.le-simple.hit{color:var(--orange2);}.le-simple.miss{color:var(--text3);}.le-simple.crit{color:var(--gold2);font-weight:600;}
.le-simple.death{color:var(--red2);}.le-simple.spell{color:var(--purple2);}.le-simple.heal{color:var(--green2);}
.le-simple.sys{color:var(--blue2);font-style:italic;cursor:default;}
.le-simple.sep{color:var(--gold);font-family:var(--fd);font-size:9px;letter-spacing:2px;text-align:center;padding:3px 0;cursor:default;display:block;}

/* Threat zone ring on map (drawn via canvas) — just CSS for the data */
.threat-label{position:absolute;font-size:9px;color:rgba(231,76,60,.7);pointer-events:none;}

/* charge confirm overlay on target */
.charge-confirm{
  position:absolute;background:rgba(10,8,4,.9);border:1px solid var(--orange);border-radius:4px;
  padding:5px 8px;font-size:10px;pointer-events:none;z-index:25;display:none;
  text-align:center;min-width:100px;
}
.charge-confirm .cc-title{font-family:var(--fd);font-size:9px;color:var(--orange2);letter-spacing:1px;}
.charge-confirm .cc-stat{color:var(--green2);}.charge-confirm .cc-warn{color:var(--red2);}


/* ═══════════════════════════════════════════════
   PARTY CARDS — rich portrait + stats layout
═══════════════════════════════════════════════ */
#char-list{padding:6px 6px 0;}
.pc{
  display:flex;gap:9px;padding:8px 8px 8px;margin-bottom:6px;
  background:var(--bg3);border:1px solid var(--border);
  border-radius:8px;cursor:pointer;position:relative;
  transition:all .14s;border-left:3px solid transparent;
}
.pc:active{background:var(--bg4);}
.pc.pc-sel{background:var(--bg4);border-left-color:var(--gold);}
.pc.pc-turn{background:rgba(39,174,96,.06);border-left-color:var(--green2);}
.pc.pc-dead{opacity:.38;cursor:not-allowed;border-left-color:var(--red);}
/* Portrait square */
.pc-port{
  width:52px;height:52px;min-width:52px;border-radius:5px;
  background:var(--bg4);overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  position:relative;flex-shrink:0;border:1px solid var(--border2);
}
@media(min-width:1025px){.pc-port{width:68px;height:68px;min-width:68px;border-radius:6px;}}
.pc-port .sk{border-radius:5px;}
.pc-turn-pip{
  position:absolute;top:-6px;left:50%;transform:translateX(-50%);
  background:var(--green2);color:var(--bg);border-radius:50%;
  width:14px;height:14px;display:flex;align-items:center;justify-content:center;
  font-size:8px;font-family:var(--fd);border:1px solid var(--bg);
}
/* Info column */

<script>
// ═══════════════════════════════════════════════════════
// D&D 3.5 / PATHFINDER RULES ENGINE
// ═══════════════════════════════════════════════════════

// Ability modifier
function sMod(v){if(v<=3)return-3;if(v<=5)return-2;if(v<=8)return-1;if(v<=12)return 0;if(v<=15)return 1;if(v<=17)return 2;return 3;}

// Speed: 30ft default → 6 hexes per round (1 hex = 5ft)
// moveHexes = speed_ft / 5
function speedHexes(unit){ return Math.floor((unit._speed||30)/5); }

// BAB by class and level (3.5/PF)
function getBAB(cls,lvl){
  const t={Fighter:1,Paladin:1,Ranger:1,Barbarian:1,Cleric:.75,Druid:.75,Monk:.75,Thief:.75,Rogue:.75,Mage:.5,Wizard:.5,Sorcerer:.5}[cls]||.75;
  return Math.floor(lvl*t);
}
// Iterative attack bonuses: every +5 BAB gets an extra attack, each at -5
function iterativeAttacks(bab, strMod, attackBonus=0){
  const atks=[];let b=bab;
  while(b>0){atks.push(b+strMod+attackBonus);b-=5;}
  return atks.length?atks:[strMod+attackBonus];
}

// D20 attack roll: roll + atk_bonus >= 10 + target_AC  (d20+bonus vs flat-footed AC = 10+AC in d20 terms)
// In 3.5: roll d20 + attack_bonus, hit if >= target's AC
function rollAttack(attackBonus, targetAC){
  const r=d(20);
  const hits=r===20||(r!==1&&(r+attackBonus)>=targetAC);
  return{r,total:r+attackBonus,hits,crit:r===20,miss:r===1,targetAC};
}

// Critical confirmation
function confirmCrit(attackBonus,targetAC){ const r=d(20); return(r===20||(r+attackBonus)>=targetAC); }

// Damage roll
function rollDmg(dmgArr, strMod, times=1){
  let t=0;for(let i=0;i<dmgArr[0]*times;i++)t+=d(dmgArr[1]);
  return Math.max(1,t+strMod*times);
}

// Spell save DC: 10 + spell_level + ability_mod (INT for arcane, WIS for divine)
function saveDC(caster, spellLevel){
  const mod = caster.cls==='Cleric'||caster.cls==='Druid' ? sMod(caster.stats?.WIS||10) : sMod(caster.stats?.INT||10);
  return 10 + spellLevel + mod;
}

// Saving throw bonus (basic 3.5 — good/poor based on class)
function saveBonus(unit, saveType){
  const lvl=unit.lvl||1;
  // Good progression: 2 + floor(lvl/2).  Poor: floor(lvl/3)
  const good = cls => ({fort:{Fighter:true,Paladin:true,Barbarian:true,Cleric:true,Druid:true,Monk:true}[cls], ref:{Rogue:true,Thief:true,Ranger:true,Monk:true}[cls], will:{Mage:true,Wizard:true,Sorcerer:true,Cleric:true,Druid:true,Monk:true}[cls]});
  const g = good(unit.cls||'Fighter');
  const base = (g[saveType]?2+Math.floor(lvl/2):Math.floor(lvl/3));
  const abilMod = saveType==='fort'?sMod(unit.stats?.CON||10):saveType==='ref'?sMod(unit.stats?.DEX||10):sMod(unit.stats?.WIS||10);
  return base + abilMod + (unit._saveBonuses?.[saveType]||0);
}

function d(n){return Math.ceil(Math.random()*n);}
function roll(arr){let t=0;for(let i=0;i<arr[0];i++)t+=d(arr[1]);return t;}

// Weapons — d20 system: dmg dice, crit range, crit multiplier, type, range increment
const WPN={
  "Dagger":          {dmg:[1,4], cr:19, cm:2, r:10,  type:'melee', h:1},
  "Short Sword":     {dmg:[1,6], cr:19, cm:2,         type:'melee', h:1},
  "Long Sword":      {dmg:[1,8], cr:19, cm:2,         type:'melee', h:1},
  "Mace":            {dmg:[1,8], cr:20, cm:2,         type:'melee', h:1},
  "War Hammer":      {dmg:[1,8], cr:20, cm:3,         type:'melee', h:1},
  "Greataxe":        {dmg:[1,12],cr:20, cm:3,         type:'melee', h:2},
  "Greatsword":      {dmg:[2,6], cr:19, cm:2,         type:'melee', h:2},
  "Two-H Sword":     {dmg:[2,6], cr:19, cm:2,         type:'melee', h:2},
  "Quarterstaff":    {dmg:[1,6], cr:20, cm:2,         type:'melee', h:2},
  "Handaxe":         {dmg:[1,6], cr:20, cm:3, r:10,  type:'melee', h:1},
  "Sling":           {dmg:[1,4], cr:20, cm:2, r:50,  type:'ranged',h:1},
  "Short Bow":       {dmg:[1,6], cr:20, cm:3, r:60,  type:'ranged',h:2},
  "Longbow":         {dmg:[1,8], cr:20, cm:3, r:100, type:'ranged',h:2},
  "Light Crossbow":  {dmg:[1,8], cr:19, cm:2, r:80,  type:'ranged',h:2},
};

// Monsters — 3.5/PF style. BAB = HD * progression, AC in d20 terms
const MON={
  "Kobold":     {hd:1, hp:[1,6],   bab:0, ac:15,dmg:[1,4],  xp:50,  e:'👺', strMod:sMod(9)},
  "Goblin":     {hd:1, hp:[1,8],   bab:0, ac:15,dmg:[1,6],  xp:100, e:'👺', strMod:sMod(11)},
  "Orc":        {hd:1, hp:[1,8],   bab:1, ac:13,dmg:[1,8],  xp:200, e:'👹', strMod:sMod(15)},
  "Skeleton":   {hd:1, hp:[1,8],   bab:0, ac:13,dmg:[1,6],  xp:200, e:'💀', strMod:sMod(15), undead:true},
  "Hobgoblin":  {hd:1, hp:[1,10],  bab:1, ac:15,dmg:[1,8],  xp:200, e:'👺', strMod:sMod(13)},
  "Giant Spider":{hd:2,hp:[2,8],   bab:1, ac:14,dmg:[1,6],  xp:600, e:'🕷', strMod:sMod(11),poison:true},
  "Ogre":       {hd:4, hp:[4,10],  bab:3, ac:16,dmg:[2,8],  xp:1200,e:'👹', strMod:sMod(21), size:'large'},
};

// Spells — 3.5/PF. range in ft (convert to hexes: /5), level, save type
const SPL={
  "Magic Missile":    {lvl:1, dmg:[1,4],bonus:1, range:110,sc:'Arcane',d:'Unerring missile, no save — 1d4+1 per 2 caster levels',saves:null},
  "Sleep":            {lvl:1, dmg:[0,0],          range:110,sc:'Arcane',d:'Puts 4 HD of creatures to sleep (Will negates)',saves:'will'},
  "Burning Hands":    {lvl:1, dmg:[1,4],           range:0,  sc:'Arcane',d:'1d4 per level fire in cone (Ref half)',saves:'reflex', aoe:true, aoeRadius:2},
  "Shield":           {lvl:1, dmg:[0,0],           range:0,  sc:'Arcane',d:'+4 shield AC bonus, immune to Magic Missile',saves:null},
  "Cure Light Wounds":{lvl:1, heal:[1,8],bonus:1,  range:0,  sc:'Divine',d:'Heals 1d8+1 per caster level HP — touch',saves:null},
  "Bless":            {lvl:1, dmg:[0,0],           range:50, sc:'Divine',d:'+1 to attack rolls and saves vs fear, party-wide',saves:null},
  "Hold Person":      {lvl:2, dmg:[0,0],           range:110,sc:'Divine',d:'Paralyses humanoid (Will negates)',saves:'will'},
  "Scorching Ray":    {lvl:2, dmg:[4,6],           range:30, sc:'Arcane',d:'4d6 fire, ranged touch attack — no save needed'},
  "Cure Moderate Wounds":{lvl:2,heal:[2,8],bonus:1,range:0,  sc:'Divine',d:'Heals 2d8+1 per caster level HP — touch'},
  "Fireball":         {lvl:3, dmg:[1,6],           range:400,sc:'Arcane',d:'1d6 per level fire in 20ft radius (Ref half)',saves:'reflex', aoe:true, aoeRadius:4},
  "Lightning Bolt":   {lvl:3, dmg:[1,6],           range:120,sc:'Arcane',d:'1d6 per level lightning bolt (Ref half)',saves:'reflex'},
  "Prayer":           {lvl:3, dmg:[0,0],           range:40, sc:'Divine',d:'+1 luck bonus on attacks/saves/dmg for allies'},
};

// ═══════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════
const G={
  round:1, turn:0, over:false,
  order:[], sel:null, units:{}, map:{},
  pendingAction:null,
  // Per-turn action economy (3.5 style)
  moveUsed:false,      // move action spent
  stdUsed:false,       // standard action spent
  fullRound:false,     // full-round action (full attack or charge) spent
  charged:false,       // character charged this turn (−2 AC until next turn)
  cols:14, rows:10,    // SMALLER MAP — parties ~5 hexes apart
  mapType:'dungeon',
  resultToSend:null, isLive:false,
  xpGained:0,   // total XP earned this combat
};

// ═══════════════════════════════════════════════════════
// DEVICE
// ═══════════════════════════════════════════════════════
// After CSS rotation on portrait phones, window.innerWidth stays narrow
// but the rotate-wrap is tall. We detect "phone" by the smaller dimension.
const _pw=()=>Math.min(window.innerWidth,window.innerHeight);
const _ph=()=>Math.max(window.innerWidth,window.innerHeight);
const mob=()=>_pw()<=599;          // true portrait phone (either orientation)
const tab=()=>_pw()>599&&_pw()<=1024; // tablet / large phone landscape
const desk=()=>_pw()>1024;         // desktop / iPad Pro landscape
// Returns true if phone is currently in portrait (needs CSS rotation)
const isPortrait=()=>window.innerHeight>window.innerWidth&&window.innerWidth<=599;

// ═══════════════════════════════════════════════════════
// MOBILE NAV
// ═══════════════════════════════════════════════════════
function mobileTab(t){
  ['map','party','act','log'].forEach(id=>document.getElementById('bn-'+id)?.classList.remove('on'));
  document.getElementById('bn-'+t)?.classList.add('on');
  if(t==='party'){openDrawer('party');}
  else if(t==='act'){openDrawer('action');}
  else if(t==='log'){
    closeAllDrawers();
    const lp=document.getElementById('logpanel');
    if(lp){lp.classList.add('expanded');lp.scrollTop=lp.scrollHeight;}
  }
  else{closeAllDrawers();}
}
function openDrawer(w){
  closeAllDrawers();
  document.getElementById(w==='party'?'party-panel':'action-panel').classList.add('open');
  if(!desk())document.getElementById('drawer-scrim').classList.add('show');
  // On phone, action panel slides up from bottom — no scrim needed over map
  if(mob()&&w==='action')document.getElementById('drawer-scrim').classList.remove('show');
}

function updateBanner(){
  const active=G.units[G.order[G.turn]];
  if(!active)return;
  const isParty=active.faction==='party';
  const pEl=document.getElementById('tb-portrait');
  if(active._portrait)pEl.innerHTML=`<img src="${active._portrait}" alt="">`;
  else pEl.textContent=active.portrait_emoji||active.name[0];
  document.getElementById('tb-name').textContent=active.name;

  const acted=G.moveUsed||G.stdUsed||G.fullRound;
  document.getElementById('tb-hint').textContent=
    !isParty?'Enemy is acting…':
    G.fullRound?'⚠ No actions left — click End Turn':
    (!G.moveUsed&&!G.stdUsed)?'Tap the map to move (green) or choose an action':
    (G.moveUsed&&!G.stdUsed)?'Move done — choose a standard action':
    (G.stdUsed&&!G.moveUsed)?'Standard action done — tap map to move':
    'Turn complete';

  // Action economy pips
  const ep=document.getElementById('pip-move'),es=document.getElementById('pip-std');
  ep.classList.toggle('used',G.moveUsed||G.fullRound);
  es.classList.toggle('used',G.stdUsed||G.fullRound);

  // Update category buttons
  const u_banner=G.sel?G.units[G.sel]:null;
  renderCatButtons(u_banner,isParty&&active.alive&&active.id===G.sel);

  const allDone = isParty&&(G.fullRound||(G.moveUsed&&G.stdUsed));
  const showEnd=isParty&&acted;
  document.getElementById('tb-endturn').classList.toggle('show',showEnd);
  document.getElementById('panel-endturn').classList.toggle('show',showEnd);
  document.getElementById('big-endturn').classList.toggle('show',showEnd);
  const nam=document.getElementById('no-actions-msg');
  if(nam)nam.classList.toggle('show',allDone);
  document.getElementById('phase-badge').textContent=`${active.name}'s turn`;
}

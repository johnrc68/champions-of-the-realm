<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Encounter</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0b0e;--bg2:#111318;--bg3:#181c24;--bg4:#1e2330;--panel:#13161d;
  --border:#2a3040;--border2:#3a4560;
  --gold:#c8a24a;--gold2:#e8c870;
  --red:#c0392b;--red2:#e74c3c;
  --blue2:#5dade2;--green:#27ae60;--green2:#58d68d;
  --purple:#8e44ad;--purple2:#bb8fce;
  --amber2:#f0a040;
  --text:#d4c9a8;--text2:#9a8e72;--text3:#6a6050;--white:#f0ead8;
  --fd:'Cinzel',serif;--fb:'Crimson Pro',Georgia,serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--fb);font-size:14px;line-height:1.5;height:100vh;overflow:hidden;display:flex;flex-direction:column;}

/* ── TITLEBAR ── */
#titlebar{background:linear-gradient(90deg,var(--bg2),var(--bg3),var(--bg2));border-bottom:1px solid var(--gold);padding:5px 12px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
#titlebar h1{font-family:var(--fd);font-size:11px;letter-spacing:3px;color:var(--gold2);text-transform:uppercase;}
#round-badge{font-family:var(--fd);font-size:10px;color:var(--gold);letter-spacing:2px;padding:2px 9px;border:1px solid var(--gold);border-radius:2px;}
#phase-badge{font-size:11px;color:var(--text2);font-style:italic;}

/* ── MAIN ── */
#main{display:flex;flex:1;overflow:hidden;}

/* ── PARTY PANEL ── */
#party-panel{width:236px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow-y:auto;}
.ph{font-family:var(--fd);font-size:9px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;padding:6px 10px 5px;border-bottom:1px solid var(--border);background:var(--bg2);flex-shrink:0;}
.cc{padding:8px 10px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;position:relative;}
.cc:hover{background:var(--bg3);}.cc.sel{background:var(--bg4);border-left:2px solid var(--gold);}
.cc.act{border-left:2px solid var(--green2);}.cc.dead{opacity:.45;cursor:not-allowed;}
.ch{display:flex;align-items:center;gap:8px;margin-bottom:5px;}

/* Portrait — 40×40, shows real image OR skull for dead */
.cp{width:40px;height:40px;border-radius:3px;border:1px solid var(--border2);background:var(--bg3);overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:20px;position:relative;}
.cp img{width:100%;height:100%;object-fit:cover;display:block;}
.cp .skull-overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,6,6,.82);font-size:18px;line-height:1;}
.cp .skull-name{font-size:7px;font-family:var(--fd);color:#e07070;letter-spacing:.5px;text-align:center;padding:0 2px;word-break:break-all;}

.ci{flex:1;min-width:0;}
.cn{font-family:var(--fd);font-size:10px;color:var(--white);letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ccl{font-size:10px;color:var(--text2);font-style:italic;}

/* HP bar */
.hbw{display:flex;align-items:center;gap:5px;margin-bottom:3px;}
.hb{flex:1;height:4px;background:var(--bg);border-radius:2px;overflow:hidden;}
.hf{height:100%;border-radius:2px;transition:width .3s;}
.ht{font-size:10px;color:var(--text2);white-space:nowrap;}

/* Mini stat row */
.sr{display:flex;gap:5px;font-size:10px;flex-wrap:wrap;}
.sl{color:var(--text3);}.sv{color:var(--text2);}

/* Status badges */
.sbadges{display:flex;gap:3px;margin-top:3px;flex-wrap:wrap;}
.sb{font-size:8px;padding:1px 4px;border-radius:2px;font-family:var(--fd);letter-spacing:.5px;}

/* ── CENTER ── */
#center-col{flex:1;display:flex;flex-direction:column;overflow:hidden;}
#map-container{flex:1;overflow:hidden;background:var(--bg);position:relative;}
#mcw{width:100%;height:100%;overflow:auto;}
#hex-canvas{display:block;}
#map-controls{position:absolute;top:6px;right:8px;display:flex;gap:5px;}
.mbtn{padding:3px 8px;background:rgba(10,11,14,.88);border:1px solid var(--border2);border-radius:2px;color:var(--text2);font-family:var(--fd);font-size:8px;letter-spacing:1px;cursor:pointer;transition:all .15s;}
.mbtn:hover{border-color:var(--gold);color:var(--gold);}
#mleg{position:absolute;top:8px;left:8px;background:rgba(10,11,14,.85);border:1px solid var(--border);padding:5px 7px;font-size:9px;color:var(--text2);border-radius:2px;pointer-events:none;}
.li{display:flex;align-items:center;gap:4px;margin-bottom:1px;}
.ls{width:9px;height:9px;border-radius:1px;flex-shrink:0;}

/* ── INITIATIVE ── */
#init-track{background:var(--bg2);border-top:1px solid var(--border);padding:4px 7px;display:flex;align-items:center;gap:6px;flex-shrink:0;overflow-x:auto;min-height:43px;}
.il{font-family:var(--fd);font-size:8px;letter-spacing:2px;color:var(--text3);flex-shrink:0;}
.iu{display:flex;flex-direction:column;align-items:center;gap:1px;flex-shrink:0;padding:2px 4px;border-radius:3px;border:1px solid var(--border);min-width:40px;position:relative;}
.iu.act2{border-color:var(--gold);background:var(--bg4);box-shadow:0 0 7px rgba(200,162,74,.2);}
.iu.dead2{opacity:.28;}
.ip{width:20px;height:20px;border-radius:2px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:11px;overflow:hidden;}
.ip img{width:100%;height:100%;object-fit:cover;}
.in{font-size:8px;color:var(--text2);white-space:nowrap;max-width:44px;overflow:hidden;text-overflow:ellipsis;text-align:center;}
.inum{position:absolute;top:-5px;right:-5px;background:var(--gold);color:var(--bg);font-family:var(--fd);font-size:7px;width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.iu.enemy .inum{background:var(--red2);color:#fff;}

/* ── ACTION PANEL ── */
#action-panel{width:272px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;}
.ahdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:7px 10px;flex-shrink:0;}
.acn{font-family:var(--fd);font-size:11px;color:var(--gold2);letter-spacing:1px;}
.api{font-size:10px;color:var(--text2);font-style:italic;}
.atabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.atab{flex:1;padding:5px 2px;text-align:center;font-family:var(--fd);font-size:8px;letter-spacing:1px;color:var(--text3);cursor:pointer;border-right:1px solid var(--border);transition:all .15s;text-transform:uppercase;}
.atab:last-child{border-right:none;}.atab:hover{background:var(--bg3);color:var(--text2);}.atab.on{background:var(--bg4);color:var(--gold);border-bottom:1px solid var(--gold);}
.alist{flex:1;overflow-y:auto;padding:5px;}
.abtn{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:3px;padding:7px 8px;margin-bottom:3px;cursor:pointer;text-align:left;color:var(--text);font-family:var(--fb);font-size:12px;transition:all .15s;display:flex;align-items:flex-start;gap:6px;}
.abtn:hover:not(:disabled){background:var(--bg4);border-color:var(--gold);color:var(--white);}
.abtn:disabled{opacity:.35;cursor:not-allowed;}.abtn.queued{border-color:var(--green);background:rgba(39,174,96,.08);}
.ai{font-size:14px;flex-shrink:0;margin-top:1px;}.ab{flex:1;min-width:0;}
.an{font-family:var(--fd);font-size:10px;letter-spacing:.5px;color:inherit;}
.ad{font-size:10px;color:var(--text2);font-style:italic;margin-top:1px;}
.ats{display:flex;gap:3px;margin-top:2px;flex-wrap:wrap;}
.atg{font-size:8px;padding:1px 4px;border-radius:2px;letter-spacing:.5px;font-family:var(--fd);}

/* ── QUEUE ── */
#qbar{background:var(--bg2);border-top:1px solid var(--border);padding:5px 6px;flex-shrink:0;min-height:46px;}
.ql{font-family:var(--fd);font-size:8px;letter-spacing:2px;color:var(--text3);margin-bottom:3px;}
.qitems{display:flex;gap:3px;flex-wrap:wrap;}
.qi{background:var(--bg4);border:1px solid var(--green);border-radius:2px;padding:1px 5px;font-size:10px;color:var(--green2);display:flex;align-items:center;gap:3px;cursor:pointer;}
.qi:hover{border-color:var(--red2);color:var(--red2);}
.qe{font-size:10px;color:var(--text3);font-style:italic;}

/* ── EXECUTE ── */
#exwrap{padding:6px;border-top:1px solid var(--border);flex-shrink:0;}
#execbtn{width:100%;padding:7px;background:transparent;border:1px solid var(--gold);border-radius:3px;color:var(--gold2);font-family:var(--fd);font-size:10px;letter-spacing:2px;cursor:pointer;transition:all .2s;text-transform:uppercase;}
#execbtn:hover:not(:disabled){background:var(--gold);color:var(--bg);box-shadow:0 0 12px rgba(200,162,74,.28);}
#execbtn:disabled{opacity:.4;cursor:not-allowed;}
#endbtn{width:100%;padding:5px;background:transparent;border:1px solid var(--border2);border-radius:3px;color:var(--text2);font-family:var(--fd);font-size:9px;letter-spacing:1.5px;cursor:pointer;margin-top:3px;transition:all .15s;text-transform:uppercase;}
#endbtn:hover{border-color:var(--text);color:var(--text);}

/* End combat buttons */
#end-combat-bar{display:none;gap:6px;padding:6px;border-top:1px solid var(--border);}
.ecbtn{flex:1;padding:7px;background:transparent;border-radius:3px;font-family:var(--fd);font-size:9px;letter-spacing:1.5px;cursor:pointer;transition:all .15s;text-transform:uppercase;}
#btn-flee{border:1px solid var(--amber2);color:var(--amber2);}
#btn-flee:hover{background:var(--amber2);color:var(--bg);}

/* ── LOG ── */
#logpanel{height:126px;flex-shrink:0;background:var(--bg2);border-top:1px solid var(--border);overflow-y:auto;padding:3px 8px;}
.lh{font-family:var(--fd);font-size:8px;letter-spacing:2px;color:var(--text3);padding:3px 0 2px;border-bottom:1px solid var(--border);margin-bottom:2px;position:sticky;top:0;background:var(--bg2);}
.le{font-size:11px;color:var(--text2);padding:1px 0;border-bottom:1px solid rgba(42,48,64,.3);line-height:1.5;}
.le.hit{color:var(--amber2);}.le.miss{color:var(--text3);}.le.crit{color:var(--gold2);font-weight:600;}
.le.death{color:var(--red2);}.le.spell{color:var(--purple2);}.le.heal{color:var(--green2);}
.le.sys{color:var(--blue2);font-style:italic;}.le.sep{color:var(--gold);font-family:var(--fd);font-size:9px;letter-spacing:2px;text-align:center;padding:3px 0;}

/* ── TOOLTIP ── */
#tt{position:fixed;background:var(--bg2);border:1px solid var(--gold);border-radius:4px;padding:7px 9px;font-size:11px;color:var(--text);max-width:220px;pointer-events:none;z-index:1000;display:none;line-height:1.6;box-shadow:0 4px 18px rgba(0,0,0,.6);}
.ttn{font-family:var(--fd);font-size:10px;color:var(--gold2);letter-spacing:1px;margin-bottom:3px;}

/* ── MODAL ── */
#covr{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:200;}
#cbox{background:var(--bg2);border:1px solid var(--gold);border-radius:6px;padding:18px 22px;max-width:400px;width:95%;text-align:center;}
#ctitle{font-family:var(--fd);font-size:13px;color:var(--gold2);letter-spacing:2px;margin-bottom:8px;}
#cmsg{font-size:12px;color:var(--text);margin-bottom:12px;line-height:1.6;}
.cbtns{display:flex;gap:8px;justify-content:center;}
.cb{padding:5px 14px;border-radius:3px;font-family:var(--fd);font-size:9px;letter-spacing:1.5px;cursor:pointer;border:1px solid var(--gold);background:transparent;color:var(--gold2);text-transform:uppercase;transition:all .15s;}
.cb:hover{background:var(--gold);color:var(--bg);}
.cb.cc2{border-color:var(--border2);color:var(--text2);}.cb.cc2:hover{background:var(--border2);color:var(--text);}

/* ── RESULT OVERLAY ── */
#result-overlay{position:fixed;inset:0;background:rgba(5,4,8,.92);display:none;align-items:center;justify-content:center;z-index:300;flex-direction:column;gap:16px;}
#result-title{font-family:var(--fd);font-size:28px;letter-spacing:6px;text-transform:uppercase;}
#result-sub{font-size:14px;color:var(--text2);font-style:italic;letter-spacing:1px;}
#result-btns{display:flex;gap:10px;margin-top:8px;}
.rbtn{padding:8px 22px;border-radius:3px;font-family:var(--fd);font-size:10px;letter-spacing:2px;cursor:pointer;border:1px solid var(--gold);background:transparent;color:var(--gold2);text-transform:uppercase;transition:all .2s;}
.rbtn:hover{background:var(--gold);color:var(--bg);}

/* ── TOAST ── */
#toast{position:fixed;bottom:150px;left:50%;transform:translateX(-50%);background:var(--bg4);border:1px solid var(--gold);border-radius:4px;padding:6px 16px;font-family:var(--fd);font-size:10px;color:var(--gold2);letter-spacing:1px;z-index:500;pointer-events:none;opacity:0;transition:opacity .3s;white-space:nowrap;}
#toast.show{opacity:1;}

/* ── PORTRAIT CANVAS (hidden, used for skull drawing) ── */
#skull-canvas{display:none;}

/* Scrollbars */
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:var(--bg);}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
::-webkit-scrollbar-thumb:hover{background:var(--gold);}
@keyframes pg{0%,100%{box-shadow:0 0 5px rgba(200,162,74,.22);}50%{box-shadow:0 0 13px rgba(200,162,74,.52);}}
.pls{animation:pg 1.4s ease-in-out infinite;}
</style>
</head>
<body>

<div id="titlebar">
  <h1>⚔ Encounter</h1>
  <div id="phase-badge">Initialising…</div>
  <div id="round-badge">Round 1</div>
</div>

<div id="main">
  <!-- PARTY PANEL -->
  <div id="party-panel">
    <div class="ph">Party</div>
    <div id="char-list"></div>
  </div>

  <!-- CENTER: MAP + INIT + LOG -->
  <div id="center-col">
    <div id="map-container">
      <div id="mcw"><canvas id="hex-canvas"></canvas></div>
      <div id="mleg">
        <div class="li"><div class="ls" style="background:#1c1c28"></div>Stone floor</div>
        <div class="li"><div class="ls" style="background:#0a0a12;border:1px solid #1a1a22"></div>Wall</div>
        <div class="li"><div class="ls" style="background:#261a0e"></div>Pillar (blocks)</div>
        <div class="li"><div class="ls" style="background:#1e1a0e"></div>Crate / Barrel</div>
        <div class="li"><div class="ls" style="background:#1a2810"></div>Rubble (cover)</div>
        <div class="li"><div class="ls" style="background:#050510"></div>Pit</div>
        <div class="li"><div class="ls" style="background:rgba(39,174,96,.22);border:1px solid #27ae60"></div>Move range</div>
        <div class="li"><div class="ls" style="background:rgba(192,57,43,.22);border:1px solid #c0392b"></div>Attack range</div>
      </div>
      <div id="map-controls">
        <button class="mbtn" onclick="fleeCombat()">🏃 Flee</button>
        <button class="mbtn" onclick="showSchema()">📋 Schema</button>
      </div>
    </div>

    <div id="init-track">
      <div class="il">Initiative</div>
      <div id="init-units" style="display:flex;gap:5px;align-items:center;"></div>
    </div>

    <div id="logpanel">
      <div class="lh">Combat Log</div>
      <div id="log-entries"></div>
    </div>
  </div>

  <!-- ACTION PANEL -->
  <div id="action-panel">
    <div class="ahdr">
      <div class="acn" id="acn">Select a character</div>
      <div class="api" id="api">Awaiting turn</div>
    </div>
    <div class="atabs">
      <div class="atab on" data-tab="attack" onclick="switchTab('attack')">Attack</div>
      <div class="atab" data-tab="spell" onclick="switchTab('spell')">Spells</div>
      <div class="atab" data-tab="defend" onclick="switchTab('defend')">Defend</div>
      <div class="atab" data-tab="move" onclick="switchTab('move')">Move</div>
    </div>
    <div class="alist" id="alist">
      <div style="padding:14px;color:var(--text3);font-size:11px;text-align:center;font-style:italic">Loading…</div>
    </div>
    <div id="qbar">
      <div class="ql">Queued Actions</div>
      <div class="qitems" id="qitems"><div class="qe">No actions queued</div></div>
    </div>
    <div id="exwrap">
      <button id="execbtn" onclick="executeActions()" disabled>Execute Actions</button>
      <button id="endbtn" onclick="endTurn()">End Turn →</button>
    </div>
  </div>
</div>

<!-- Hidden canvas for skull generation -->
<canvas id="skull-canvas" width="40" height="40"></canvas>

<!-- Tooltip -->
<div id="tt"><div class="ttn" id="ttn"></div><div id="ttb"></div></div>

<!-- Toast -->
<div id="toast"></div>

<!-- Generic confirm dialog -->
<div id="covr">
  <div id="cbox">
    <div id="ctitle">Confirm</div>
    <div id="cmsg"></div>
    <div class="cbtns"><button class="cb" id="cyes">OK</button><button class="cb cc2" onclick="closeDlg()">Cancel</button></div>
  </div>
</div>

<!-- Victory / Defeat result overlay -->
<div id="result-overlay">
  <div id="result-title">Victory!</div>
  <div id="result-sub">The party has triumphed.</div>
  <div id="result-btns">
    <button class="rbtn" id="result-return" onclick="sendResult()">Return to Game</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════
// MAIN GAME TABLES  (copied verbatim from main game spec)
// ══════════════════════════════════════════════════════════

// AD&D stat modifier (matches main game statMod)
function statMod(v){
  if(v<=3)return-3; if(v<=5)return-2; if(v<=8)return-1;
  if(v<=12)return 0; if(v<=15)return 1; if(v<=17)return 2;
  return 3;
}

// Movement range in hexes based on DEX
function moveRange(pc){ return 4 + statMod(pc.stats.DEX); }

// THAC0 by class and level (roll this or higher on d20 to hit AC 0)
const THAC0 = {
  Fighter: (lvl) => 20 - (lvl - 1),
  Cleric:  (lvl) => 20 - Math.floor((lvl-1)*2/3),
  Mage:    (lvl) => 20 - Math.floor((lvl-1)/3),
  Thief:   (lvl) => 20 - Math.floor((lvl-1)/2),
};
function getThac0(unit){
  if(unit.faction==='enemy') return unit._thac0||19;
  const fn=THAC0[unit.cls]; return fn?fn(unit.lvl):20;
}

// Weapons table — matches main game exactly
const WEAPONS = {
  "Dagger":       { dmg:[1,4],  hands:1 },
  "Short Sword":  { dmg:[1,6],  hands:1 },
  "Long Sword":   { dmg:[1,8],  hands:1 },
  "Mace":         { dmg:[1,6],  hands:1 },
  "War Hammer":   { dmg:[1,6],  hands:1 },
  "Two-H Sword":  { dmg:[1,10], hands:2 },
  "Quarterstaff": { dmg:[1,6],  hands:2 },
  "Sling":        { dmg:[1,4],  hands:1, ranged:true },
  "Short Bow":    { dmg:[1,6],  hands:2, ranged:true },
};

// Monsters table — matches main game exactly
const MONSTERS = {
  "Kobold":       { hd:1, hp:[1,4],  ac:7, thac0:20, dmg:[1,4],  xp:7,   emoji:'👺' },
  "Goblin":       { hd:1, hp:[1,8],  ac:6, thac0:20, dmg:[1,6],  xp:15,  emoji:'👺' },
  "Orc":          { hd:1, hp:[2,8],  ac:6, thac0:19, dmg:[1,8],  xp:15,  emoji:'👹' },
  "Skeleton":     { hd:1, hp:[2,8],  ac:7, thac0:19, dmg:[1,6],  xp:21,  emoji:'💀' },
  "Hobgoblin":    { hd:1, hp:[2,8],  ac:5, thac0:18, dmg:[1,8],  xp:35,  emoji:'👺' },
  "Giant Spider": { hd:2, hp:[3,8],  ac:5, thac0:16, dmg:[1,8],  xp:175, emoji:'🕷', poison:true },
  "Ogre":         { hd:4, hp:[5,10], ac:5, thac0:15, dmg:[1,10], xp:175, emoji:'👹' },
};

// Class spell tables (AD&D-style — Mage/Cleric only)
const SPELLS = {
  "Magic Missile": { dmg:[1,6],  bonus:1, range:60,  school:'Arcane',  cost:1, desc:'+1 missile per 2 levels above 1st' },
  "Sleep":         { dmg:[0,0],  bonus:0, range:30,  school:'Arcane',  cost:1, desc:'Puts 2d8 HD of creatures to sleep' },
  "Shield":        { dmg:[0,0],  bonus:0, range:0,   school:'Arcane',  cost:1, desc:'Grants AC -4 to caster this combat' },
  "Burning Hands": { dmg:[1,3],  bonus:0, range:0,   school:'Arcane',  cost:1, desc:'1d3 per level fire damage in cone' },
  "Cure Light Wounds":{ dmg:[0,0], heal:[1,8], bonus:1, range:'touch', school:'Divine', cost:1, desc:'Heals 1d8+1 HP' },
  "Bless":         { dmg:[0,0],  bonus:0, range:60,  school:'Divine',  cost:1, desc:'+1 to attack and morale for party' },

// ══════════════════════════════════════════════════════════
// DICE
// ══════════════════════════════════════════════════════════
function d(n){ return Math.ceil(Math.random()*n); }
function rollDice(arr){ let t=0; for(let i=0;i<arr[0];i++) t+=d(arr[1]); return t; }

// THAC0 attack resolution (AD&D)
// To hit AC X: need to roll >= THAC0 - X
function resolveAttack(attacker, weapon, targetAC){
  const roll = d(20);
  const strBonus = statMod(attacker.stats?.STR||10);
  const thac0 = getThac0(attacker);
  const needed = thac0 - targetAC;  // roll needed to hit
  const hits = roll === 20 || (roll !== 1 && roll >= needed);
  const crit = roll === 20;
  const fumble = roll === 1;
  let dmg = 0;
  if(hits){
    const w = typeof weapon==='string' ? WEAPONS[weapon] : weapon;
    if(w){ dmg = rollDice(w.dmg) + strBonus; if(crit) dmg = dmg*2; }
    dmg = Math.max(1, dmg);
  }
  return { roll, needed, hits, crit, fumble, dmg };
}

// DATA LOADING — URL PARAMS (main game integration)
// ══════════════════════════════════════════════════════════
function loadFromURL(){
  const params = new URLSearchParams(location.search);
  const partyParam   = params.get('party');
  const enemyParam   = params.get('enemies');
  const fixed        = params.get('fixed') === '1';

  if(!partyParam) return false;  // not launched from main game

  const partyRaw  = JSON.parse(partyParam);
  const enemyNames = JSON.parse(enemyParam || '[]');
  G.isLive = true;

  // Convert main-game party members into combat units
  const party = partyRaw.map((pc, i) => buildPartyUnit(pc, i));

  // Convert enemy name strings into combat units using MONSTERS table
  const enemies = enemyNames.map((name, i) => buildEnemyUnit(name, i));

  loadCombat({ party, enemies, map_type: 'dungeon', fixed });
  return true;
}

function buildPartyUnit(pc, idx){
  // Accepts the exact object from main game and converts to combat unit
  const strMod = statMod(pc.stats.STR);
  const dexMod = statMod(pc.stats.DEX);
  const w = pc.weapon ? WEAPONS[pc.weapon] : null;

  return {
    // Identity — from main game fields verbatim
    id:    `p${idx}`,
    name:  pc.name,
    race:  pc.race,
    cls:   pc.cls,
    lvl:   pc.lvl,
    xp:    pc.xp,

    // Combat state
    faction: 'party',
    alive:   pc.alive !== false,  // undefined = alive
    hp:      pc.hp,
    max_hp:  pc.maxhp,
    ac:      pc.ac,

    // AD&D stats object — kept as-is from main game (STR/DEX/CON etc.)
    stats:   pc.stats,

    // Equipment
    weapon:  pc.weapon || null,
    armor:   pc.armor  || null,

    // Status effects from main game
    status:  pc.status || { defending:false, shield:false, sleep:false, blessed:false },

    // Spells
    spellsKnown: pc.spellsKnown || [],
    spellSlots:  pc.spellSlots  || 0,
    spellsUsed:  pc.spellsUsed  || 0,

    // Derived — calculated the same way main game does
    _moveRange: moveRange(pc),
    _thac0:    getThac0({ cls:pc.cls, lvl:pc.lvl, faction:'party' }),
    _portrait: null,   // filled in when postMessage arrives

    // Emoji fallback portrait
    portrait_emoji: { Fighter:'⚔', Cleric:'✝', Mage:'🔮', Thief:'🗡' }[pc.cls] || '👤',
  };
}

function buildEnemyUnit(name, idx){
  const m = MONSTERS[name];
  if(!m){
    // Unknown monster — minimal fallback
    return { id:`e${idx}`, name, faction:'enemy', alive:true,
      hp:8, max_hp:8, ac:7, stats:{STR:10,DEX:10,CON:10,INT:6,WIS:6,CHA:6},
      _thac0:20, _moveRange:4, weapon:null, _dmg:[1,6],
      portrait_emoji:'👾', spellsKnown:[], spellSlots:0, spellsUsed:0, status:{} };
  }
  const hp = rollDice(m.hp);
  return {
    id:          `e${idx}`,
    name:        `${name} ${idx+1}`,
    _monsterKey: name,
    faction:     'enemy',
    alive:       true,
    hp,
    max_hp:      hp,
    ac:          m.ac,
    stats:       { STR:10, DEX:10, CON:10, INT:6, WIS:6, CHA:6 },
    _thac0:      m.thac0,
    _moveRange:  4,
    weapon:      null,
    _dmg:        m.dmg,
    _xp:         m.xp,
    _poison:     m.poison||false,
    portrait_emoji: m.emoji || '👾',
    spellsKnown: [], spellSlots:0, spellsUsed:0,
    status:      {},
  };
}

// postMessage HANDSHAKE (portraits + fallback COMBAT_INIT)
// ══════════════════════════════════════════════════════════
window.addEventListener('message', e => {
  if(!e.data) return;

  // Portraits arriving from main game after encounterReady handshake
  if(e.data.type === 'encounterPortraits'){
    const portraits  = e.data.portraits  || {};  // { "Gareth": "data:image/png;..." }
    const monsters   = e.data.monsters   || {};

    // Apply to party units
    Object.values(G.units).forEach(u => {
      if(u.faction==='party' && portraits[u.name]){
        u._portrait = portraits[u.name];
      }
      if(u.faction==='enemy' && u._monsterKey && monsters[u._monsterKey]){
        u._portrait = monsters[u._monsterKey];
      }
    });

    // Re-render party panel with real portraits
    renderParty();
    renderInit();
    return;
  }

  // Fallback: direct COMBAT_INIT for standalone / dev testing
  if(e.data.type === 'COMBAT_INIT'){
    loadCombat(e.data.payload);
    return;
  }
});

// Signal to parent that we're ready to receive portrait data
function signalReady(){
  try { window.parent.postMessage({ type: 'encounterReady' }, '*'); } catch(e){}
}

// Send result back to parent (win / lose / fled)
function sendResult(result){
  if(!result) result = G.resultToSend || 'win';
  try { window.parent.postMessage({ type:'encounterResult', result }, '*'); } catch(e){}
  // Hide result overlay
  document.getElementById('result-overlay').style.display='none';
}

// ══════════════════════════════════════════════════════════
// HEX MAP
// ══════════════════════════════════════════════════════════
const HEX={
  sz:32, cv:null, ctx:null, hov:null,
  TF:{ stone:'#1c1c28',stone_worn:'#171724',stone_crack:'#141420',wall:'#090910',wall_thick:'#06060d',pillar:'#261a0e',crate:'#1e1a0e',barrel:'#19120a',rubble:'#1a2810',water:'#0e1626',pit:'#050510',carpet:'#1c0e18',altar:'#160c1e',chest:'#1c1606',door_open:'#28200e',grass:'#1a2420',mud:'#1c1810',forest:'#182210' },
  TS:{ stone:'#262636',stone_worn:'#222230',stone_crack:'#1c1c2c',wall:'#161620',wall_thick:'#121218',pillar:'#382a16',crate:'#2c2818',barrel:'#281e10',rubble:'#283818',water:'#161e38',pit:'#0e0e1a',carpet:'#2c1826',altar:'#241228',chest:'#2c2408',door_open:'#38300e',grass:'#283830',mud:'#2c2818',forest:'#283a1a' },
  PASS: new Set(['stone','stone_worn','stone_crack','grass','mud','carpet','door_open','altar']),
  OBJ: {pillar:'◆',crate:'▪',barrel:'○',rubble:'~',chest:'✦',altar:'✝',pit:'▼',forest:'🌲'},

  init(){
    this.cv=document.getElementById('hex-canvas');
    this.ctx=this.cv.getContext('2d');
    this.cv.addEventListener('mousemove',e=>this.onMM(e));
    this.cv.addEventListener('click',e=>this.onCk(e));
    this.cv.addEventListener('mouseleave',()=>{this.hov=null;this.render();});
    this.buildMap(); this.resize(); this.render();
  },

  resize(){
    this.cv.width =Math.ceil(G.cols*this.sz*1.74+this.sz*0.5);
    this.cv.height=Math.ceil(G.rows*this.sz*1.52+this.sz*0.6);
  },

  buildMap(){
    G.map={};
    const c=G.cols, r=G.rows;
    for(let q=0;q<c;q++) for(let ri=0;ri<r;ri++){
      const k=`${q},${ri}`, edge=q<2||ri<2||q>c-3||ri>r-3;
      const t=edge?'wall_thick':(['stone','stone','stone','stone_worn','stone_crack'][Math.floor(Math.random()*5)]);
      G.map[k]={q,r:ri,terrain:t,passable:!edge&&this.PASS.has(t),unit:null,hl:null,label:null};
    }
    // Wall dividers with doorways
    [7,14].forEach(wq=>{
      for(let ri=2;ri<r-2;ri++){
        if(ri>=6&&ri<=8) continue;
        const k=`${wq},${ri}`;
        if(G.map[k]){G.map[k].terrain='wall';G.map[k].passable=false;}
      }
    });
    // Pillars
    [[4,4],[4,10],[9,3],[9,11],[17,4],[17,10],[11,7],[6,7]].forEach(([q,ri])=>{
      const k=`${q},${ri}`;if(G.map[k]){G.map[k].terrain='pillar';G.map[k].passable=false;G.map[k].label='◆';}
    });
    // Crates / barrels
    [[5,6],[5,8],[18,5],[18,9],[12,4],[12,10],[8,7],[15,5],[15,9]].forEach(([q,ri])=>{
      const t=Math.random()>0.5?'crate':'barrel';
      const k=`${q},${ri}`;if(G.map[k]){G.map[k].terrain=t;G.map[k].passable=false;G.map[k].label=this.OBJ[t];}
    });
    // Rubble
    [[6,5],[6,9],[13,5],[13,9],[10,7],[16,6],[16,8]].forEach(([q,ri])=>{
      const k=`${q},${ri}`;if(G.map[k]){G.map[k].terrain='rubble';G.map[k].passable=true;G.map[k].label='~';}
    });
    // Pits
    [[10,4],[10,10],[20,7]].forEach(([q,ri])=>{
      const k=`${q},${ri}`;if(G.map[k]){G.map[k].terrain='pit';G.map[k].passable=false;G.map[k].label='▼';}
    });
    // Altar + chest
    const ak=`${c-4},${Math.floor(r/2)}`;if(G.map[ak]){G.map[ak].terrain='altar';G.map[ak].passable=true;G.map[ak].label='✝';}
    const ck=`${c-3},${Math.floor(r/2)-2}`;if(G.map[ck]){G.map[ck].terrain='chest';G.map[ck].passable=false;G.map[ck].label='✦';}
    // Carpet runner
    for(let q=3;q<c-3;q++){const k=`${q},${Math.floor(r/2)}`;if(G.map[k]&&G.map[k].passable)G.map[k].terrain='carpet';}
  },

  ctr(q,ri){
    const off=ri%2===0?0:this.sz*0.866;
    return{x:q*this.sz*1.732+off+this.sz*0.9, y:ri*this.sz*1.5+this.sz*0.82};
  },

  hexAt(px,py){
    let best=null,bd=Infinity;
    for(const k in G.map){
      const[q,ri]=k.split(',').map(Number);
      const{x,y}=this.ctr(q,ri);
      const d2=Math.hypot(x-px,y-py);
      if(d2<bd){bd=d2;best=k;}
    }
    return bd<this.sz?best:null;
  },

  dHex(cx,cy,sz,fill,stroke,sw=0.5){
    const ctx=this.ctx;
    ctx.beginPath();
    for(let i=0;i<6;i++){
      const a=Math.PI/3*i-Math.PI/6;
      i===0?ctx.moveTo(cx+sz*Math.cos(a),cy+sz*Math.sin(a)):ctx.lineTo(cx+sz*Math.cos(a),cy+sz*Math.sin(a));
    }
    ctx.closePath();ctx.fillStyle=fill;ctx.fill();ctx.strokeStyle=stroke;ctx.lineWidth=sw;ctx.stroke();
  },

  render(){
    const ctx=this.ctx;
    ctx.clearRect(0,0,this.cv.width,this.cv.height);
    ctx.fillStyle='#050507';ctx.fillRect(0,0,this.cv.width,this.cv.height);
    const s=this.sz;
    for(const k in G.map){
      const h=G.map[k];
      const{x,y}=this.ctr(h.q,h.r);
      let fill=this.TF[h.terrain]||'#111', stroke=this.TS[h.terrain]||'#222', sw=0.5;
      if(h.hl==='move'){fill='rgba(39,174,96,.2)';stroke='#27ae60';sw=1;}
      else if(h.hl==='attack'){fill='rgba(192,57,43,.2)';stroke='#c0392b';sw=1;}
      else if(h.hl==='sel'){fill='rgba(200,162,74,.14)';stroke='#c8a24a';sw=1.5;}
      if(k===this.hov&&h.passable&&!h.unit){fill='rgba(255,255,255,.04)';stroke='rgba(200,162,74,.45)';sw=0.8;}
      this.dHex(x,y,s-0.5,fill,stroke,sw);
      if(h.label&&!h.unit){
        ctx.fillStyle='rgba(150,130,90,.5)';ctx.font=`${Math.round(s*0.35)}px serif`;
        ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(h.label,x,y);
      }
      if(h.unit&&G.units[h.unit]) this.drawUnit(x,y,s,G.units[h.unit]);
    }
    if(G.moveHex&&G.map[G.moveHex]){
      const[q,ri]=G.moveHex.split(',').map(Number);
      const{x,y}=this.ctr(q,ri);
      ctx.save();ctx.setLineDash([4,3]);
      this.dHex(x,y,s-0.5,'rgba(200,162,74,.06)','#c8a24a',1.5);
      ctx.setLineDash([]);ctx.restore();
    }
  },

  drawUnit(x,y,s,u){
    const ctx=this.ctx;
    const isAct=G.order[G.turn]===u.id;
    const isSel=G.sel===u.id;
    const isEnemy=u.faction==='enemy';
    const dead=!u.alive||u.hp<=0;
    if(dead) ctx.globalAlpha=0.26;
    if(isAct&&!dead){
      ctx.save();ctx.shadowColor=isEnemy?'#e74c3c':'#e8c870';ctx.shadowBlur=15;
      this.dHex(x,y,s-1,'transparent',isEnemy?'#e74c3c':'#e8c870',2);
      ctx.restore();
    }
    const cr=s*0.52;
    ctx.beginPath();ctx.arc(x,y-3,cr,0,Math.PI*2);
    ctx.fillStyle=isEnemy?`rgba(150,35,25,${dead?.22:.88})`:`rgba(28,75,145,${dead?.22:.88})`;
    ctx.fill();
    ctx.strokeStyle=isSel?'#c8a24a':(isEnemy?'#e74c3c':'#5dade2');
    ctx.lineWidth=isSel?2:1; ctx.stroke();

    // Portrait image on canvas if available
    if(u._portrait&&!dead){
      try{
        const img=_imgCache[u.id];
        if(img&&img.complete){
          ctx.save();ctx.beginPath();ctx.arc(x,y-3,cr-1,0,Math.PI*2);ctx.clip();
          ctx.drawImage(img,x-cr+1,y-3-cr+1,(cr-1)*2,(cr-1)*2);ctx.restore();
        }
      }catch(e){}
    }

    // Emoji fallback or skull for dead
    if(!u._portrait||dead){
      ctx.fillStyle=dead?'#e07070':'#fff';
      ctx.font=`bold ${Math.round(s*0.38)}px serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(dead?'☠':(u.portrait_emoji||u.name[0]),x,y-3);
    }

    // HP arc
    const pct=Math.max(0,u.hp/u.max_hp);
    const hpc=pct>.5?'#27ae60':pct>.25?'#e67e22':'#e74c3c';
    ctx.beginPath();ctx.arc(x,y-3,cr+3,-Math.PI/2,-Math.PI/2+Math.PI*2*pct);
    ctx.strokeStyle=hpc;ctx.lineWidth=2.5;ctx.stroke();

    // Sleeping indicator
    if(u.status?.sleep){
      ctx.fillStyle='rgba(90,120,200,.8)';ctx.font=`${Math.round(s*0.28)}px serif`;
      ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('💤',x+cr*0.6,y-3-cr*0.6);
    }

    // Name tag
    const nw=Math.min(u.name.length*5+6,s*2.1);
    ctx.fillStyle=isEnemy?'rgba(26,5,5,.9)':'rgba(5,14,28,.9)';
    ctx.fillRect(x-nw/2,y+cr-1,nw,12);
    ctx.fillStyle=isEnemy?'#f08080':'#80c4e8';
    ctx.font='7.5px "Cinzel",serif';ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(u.name.substring(0,13),x,y+cr);
    ctx.globalAlpha=1;
  },

  clearHL(){ for(const k in G.map) G.map[k].hl=null; },

  hlMove(uid){
    this.clearHL();const u=G.units[uid];if(!u||!u.hex)return;
    const spd=u._moveRange||4;
    for(const k in G.map){
      const h=G.map[k];
      if(h.passable&&!h.unit&&hexDist(u.hex,k)<=spd) h.hl='move';
    }
    this.render();
  },

  hlAtk(uid){
    this.clearHL();const u=G.units[uid];if(!u||!u.hex)return;
    const w=u.weapon?WEAPONS[u.weapon]:null;
    const rng=w&&w.ranged?10:1.5;
    for(const k in G.map){
      const h=G.map[k];
      if(h.unit&&G.units[h.unit]&&G.units[h.unit].faction!==u.faction&&hexDist(u.hex,k)<=rng) h.hl='attack';
    }
    this.render();
  },

  hlSpell(uid){
    this.clearHL();
    for(const k in G.map){
      const h=G.map[k];
      if(h.unit&&G.units[h.unit]&&G.units[h.unit].faction!=='party') h.hl='attack';
    }
    this.render();
  },

  hlAlly(){
    this.clearHL();
    for(const k in G.map){
      const h=G.map[k];
      if(h.unit&&G.units[h.unit]&&G.units[h.unit].faction==='party') h.hl='sel';
    }
    this.render();
  },

  onMM(e){
    const rect=this.cv.getBoundingClientRect(),sx=this.cv.width/rect.width,sy=this.cv.height/rect.height;
    const k=this.hexAt((e.clientX-rect.left)*sx,(e.clientY-rect.top)*sy);
    if(k!==this.hov){this.hov=k;this.render();}
    if(k&&G.map[k]?.unit){const u=G.units[G.map[k].unit];if(u) showTT(u,e.clientX,e.clientY);}
    else hideTT();
  },
  onCk(e){
    const rect=this.cv.getBoundingClientRect(),sx=this.cv.width/rect.width,sy=this.cv.height/rect.height;
    const k=this.hexAt((e.clientX-rect.left)*sx,(e.clientY-rect.top)*sy);
    if(k) handleHex(k);
  }
};

// Image cache for portrait drawing on canvas
const _imgCache = {};
function cachePortrait(uid, dataURL){
  if(!dataURL) return;
  const img = new Image();
  img.src = dataURL;
  _imgCache[uid] = img;
}

function hexDist(a,b){
  const[q1,r1]=a.split(',').map(Number),[q2,r2]=b.split(',').map(Number);
  const s1=-q1-r1,s2=-q2-r2;
  return(Math.abs(q1-q2)+Math.abs(r1-r2)+Math.abs(s1-s2))/2;
}

// ══════════════════════════════════════════════════════════
// UI RENDERING
// ══════════════════════════════════════════════════════════
function hpColor(pct){ return pct>.6?'#27ae60':pct>.3?'#e67e22':'#e74c3c'; }

function renderParty(){
  const el = document.getElementById('char-list');
  const party = Object.values(G.units).filter(u=>u.faction==='party');
  if(!party.length){ el.innerHTML='<div style="padding:14px;color:var(--text3);font-size:11px;text-align:center;font-style:italic">No party loaded.</div>'; return; }

  el.innerHTML = party.map(u => {
    const dead = !u.alive || u.hp <= 0;
    const pct  = dead ? 0 : Math.max(0, u.hp / u.max_hp);
    const isAct = G.order[G.turn] === u.id;

    // Portrait HTML — real image, skull overlay if dead, or emoji fallback
    let portraitHTML = '';
    if(u._portrait){
      portraitHTML = `<img src="${u._portrait}" alt="${u.name}">`;
      if(dead) portraitHTML += `<div class="skull-overlay"><span>☠</span><span class="skull-name">${u.name}</span></div>`;
    } else {
      if(dead){
        portraitHTML = `<div class="skull-overlay"><span>☠</span><span class="skull-name">${u.name}</span></div>`;
      } else {
        portraitHTML = `<span style="font-size:18px">${u.portrait_emoji||'👤'}</span>`;
      }
    }

    // Status badges
    const badges = [];
    if(u.status?.defending) badges.push(`<span class="sb" style="background:rgba(30,80,200,.15);color:#7aadea;border:1px solid #2a6090">DEF</span>`);
    if(u.status?.shield)    badges.push(`<span class="sb" style="background:rgba(142,68,173,.15);color:var(--purple2);border:1px solid var(--purple)">SHIELD</span>`);
    if(u.status?.sleep)     badges.push(`<span class="sb" style="background:rgba(100,100,200,.15);color:#aab0e8;border:1px solid #5558aa">SLEEP</span>`);
    if(u.status?.blessed)   badges.push(`<span class="sb" style="background:rgba(200,162,74,.15);color:var(--gold2);border:1px solid var(--gold)">BLESS</span>`);

    // Spell slots remaining
    const slotsLeft = (u.spellSlots||0) - (u.spellsUsed||0);
    const slotStr = (u.cls==='Mage'||u.cls==='Cleric') ? `<span><span class="sl">Slots:</span><span class="sv">${slotsLeft}/${u.spellSlots||0}</span></span>` : '';

    return `
    <div class="cc ${G.sel===u.id?'sel':''} ${isAct&&!dead?'act':''} ${dead?'dead':''}"
         onclick="${dead?'':(`selChar('${u.id}')`)}">
      <div class="ch">
        <div class="cp" id="portrait-${u.id}">${portraitHTML}</div>
        <div class="ci">
          <div class="cn">${u.name}${dead?` <span style="color:#e07070;font-size:9px">†</span>`:''}</div>
          <div class="ccl">${u.race||''} ${u.cls||''} ${u.lvl||''}</div>
        </div>
      </div>
      ${!dead?`
      <div class="hbw">
        <div class="hb"><div class="hf" style="width:${(pct*100).toFixed(1)}%;background:${hpColor(pct)}"></div></div>
        <div class="ht">${u.hp}/${u.max_hp}</div>
      </div>
      <div class="sr">
        <span><span class="sl">AC:</span><span class="sv">${u.ac}</span></span>
        <span><span class="sl"> THAC0:</span><span class="sv">${u._thac0}</span></span>
        <span><span class="sl"> Mv:</span><span class="sv">${u._moveRange}</span></span>
        ${slotStr}
      </div>
      ${badges.length?`<div class="sbadges">${badges.join('')}</div>`:''}`
      :`<div style="font-size:10px;color:#e07070;font-style:italic;padding:2px 0">Fallen in battle</div>`}
    </div>`;
  }).join('');
}

function renderInit(){
  const el = document.getElementById('init-units');
  if(!G.order.length){ el.innerHTML=''; return; }
  el.innerHTML = G.order.map((id,i) => {
    const u = G.units[id]; if(!u) return '';
    const isAct = i === G.turn;
    const dead  = !u.alive || u.hp<=0;

    let portrait;
    if(u._portrait){
      portrait = `<img src="${u._portrait}" alt="${u.name}" style="width:100%;height:100%;object-fit:cover;border-radius:2px;${dead?'filter:grayscale(1)':''}">`;
    } else {
      portrait = dead ? '☠' : (u.portrait_emoji||u.name[0]);
    }

    return `<div class="iu ${u.faction==='enemy'?'enemy':''} ${isAct&&!dead?'act2 pls':''} ${dead?'dead2':''}">
      <div class="inum">${u.initiative||'?'}</div>
      <div class="ip">${portrait}</div>
      <div class="in">${u.name}</div>
    </div>`;
  }).join('');
}

function renderActions(){
  const u = G.sel ? G.units[G.sel] : null;
  document.getElementById('acn').textContent = u ? u.name : 'Select a character';
  const isAct = u && G.order[G.turn] === G.sel && u.alive && u.hp>0;
  document.getElementById('api').textContent = u
    ? ((!u.alive||u.hp<=0) ? '† Fallen' : isAct ? '⚡ Your Turn' : 'Awaiting turn…')
    : '';

  const list = document.getElementById('alist');
  if(!u){ list.innerHTML='<div style="padding:14px;color:var(--text3);font-size:11px;text-align:center;font-style:italic">Select a character to view actions.</div>'; return; }
  if(!u.alive||u.hp<=0){ list.innerHTML='<div style="padding:14px;color:var(--text3);font-size:11px;text-align:center;font-style:italic">This character has fallen.</div>'; return; }

  const tab = G.tab; let html = '';

  if(tab === 'attack'){
    const w = u.weapon ? WEAPONS[u.weapon] : null;
    if(w){
      const isRanged = !!w.ranged;
      html += `<button class="abtn" onclick="doAtk('${u.id}')" ${!isAct?'disabled':''}>
        <div class="ai">${isRanged?'🏹':'⚔️'}</div>
        <div class="ab">
          <div class="an">${u.weapon}</div>
          <div class="ad">${w.dmg[0]}d${w.dmg[1]} · ${isRanged?'Ranged':'Melee'} · ${w.hands}-handed</div>
          <div class="ats">
            <span class="atg" style="background:rgba(200,162,74,.1);color:var(--gold);border:1px solid var(--gold)">${isRanged?'Ranged':'Melee'}</span>
            <span class="atg" style="color:var(--text2);border:1px solid var(--border)">THAC0:${u._thac0}</span>
            <span class="atg" style="color:var(--text2);border:1px solid var(--border)">STR+${statMod(u.stats.STR)}</span>
          </div>
        </div></button>`;
    } else {
      // Unarmed
      html += `<button class="abtn" onclick="doAtk('${u.id}')" ${!isAct?'disabled':''}>
        <div class="ai">👊</div>
        <div class="ab">
          <div class="an">Unarmed Strike</div>
          <div class="ad">1d2 bludgeoning · Melee</div>
          <div class="ats"><span class="atg" style="color:var(--text2);border:1px solid var(--border)">THAC0:${u._thac0}</span></div>
        </div></button>`;
    }
  }

  else if(tab === 'spell'){
    const known = u.spellsKnown || [];
    const slotsLeft = (u.spellSlots||0) - (u.spellsUsed||0);

    if(u.cls!=='Mage'&&u.cls!=='Cleric'){
      html = '<div class="qe" style="padding:10px">Only Mages and Clerics cast spells.</div>';
    } else if(!known.length){
      html = '<div class="qe" style="padding:10px">No spells known.</div>';
    } else {
      known.forEach((spellName,i) => {
        const sp = SPELLS[spellName];
        if(!sp) return;
        const isHeal = !!sp.heal;
        html += `<button class="abtn" onclick="doSpell('${u.id}',${i})" ${(!isAct||slotsLeft<=0)?'disabled':''}>
          <div class="ai">${isHeal?'💚':'✨'}</div>
          <div class="ab">
            <div class="an">${spellName}</div>
            <div class="ad">${sp.desc}</div>
            <div class="ats">
              <span class="atg" style="background:rgba(142,68,173,.1);color:var(--purple2);border:1px solid var(--purple)">${sp.school}</span>
              <span class="atg" style="color:var(--text2);border:1px solid var(--border)">${slotsLeft} slot${slotsLeft!==1?'s':''} left</span>
              ${sp.range?`<span class="atg" style="color:var(--text2);border:1px solid var(--border)">Rng:${sp.range==='touch'?'Touch':sp.range+'ft'}</span>`:''}
            </div>
          </div></button>`;
      });
    }
  }

  else if(tab === 'defend'){
    const defending = u.status?.defending;
    html = `<button class="abtn ${defending?'queued':''}" onclick="doDefend('${u.id}')" ${!isAct?'disabled':''}>
      <div class="ai">🛡</div>
      <div class="ab">
        <div class="an">Defend</div>
        <div class="ad">+2 AC bonus until your next turn (${defending?'active':'inactive'})</div>
        <div class="ats"><span class="atg" style="color:var(--text2);border:1px solid var(--border)">Full Defence</span></div>
      </div></button>
    <button class="abtn" onclick="doFlee('${u.id}')" ${!isAct?'disabled':''}>
      <div class="ai">🏃</div>
      <div class="ab">
        <div class="an">Disengage &amp; Flee</div>
        <div class="ad">Withdraw from combat — ends the encounter</div>
        <div class="ats"><span class="atg" style="color:var(--text2);border:1px solid var(--border)">Full-Round</span></div>
      </div></button>`;
  }

  else if(tab === 'move'){
    html = `<button class="abtn ${G.pendingAct?.type==='move'?'queued':''}" onclick="doMove('${u.id}')" ${!isAct?'disabled':''}>
      <div class="ai">🚶</div>
      <div class="ab">
        <div class="an">Move</div>
        <div class="ad">Up to ${u._moveRange} hexes (DEX modifier applied) — click a green hex</div>
        <div class="ats">
          <span class="atg" style="color:var(--text2);border:1px solid var(--border)">Move Action</span>
          <span class="atg" style="color:var(--text2);border:1px solid var(--border)">DEX ${u.stats.DEX} → +${statMod(u.stats.DEX)}</span>
        </div>
      </div></button>`;
  }

  list.innerHTML = html || '<div class="qe" style="padding:10px">No actions available</div>';
}

function renderQueue(){
  const el  = document.getElementById('qitems');
  const btn = document.getElementById('execbtn');
  if(!G.queue.length){ el.innerHTML='<div class="qe">No actions queued</div>'; btn.disabled=true; return; }
  btn.disabled = false;
  el.innerHTML = G.queue.map((qa,i) => {
    const actor = G.units[qa.aId];
    const a     = qa.act;
    const label =
      a.type==='attack' ? `${actor?.name}: attack → ${G.units[qa.tId]?.name||'?'}` :
      a.type==='spell'  ? `${actor?.name}: ${a.sn} → ${G.units[qa.tId]?.name||'?'}` :
      a.type==='move'   ? `${actor?.name}: move → ${a.th}` :
      a.type==='defend' ? `${actor?.name}: defend` :
      a.type==='flee'   ? `${actor?.name}: flee` : 'action';
    return `<div class="qi" onclick="removeQ(${i})" title="Click to remove">${label} ✕</div>`;
  }).join('');
}

// ══════════════════════════════════════════════════════════
// ACTION HANDLERS
// ══════════════════════════════════════════════════════════
function selChar(id){
  const u = G.units[id];
  if(!u || !u.alive || u.hp<=0) return;
  G.sel = id; G.pendingAct = null;
  HEX.clearHL(); HEX.render();
  renderParty(); renderActions(); renderQueue();
}

function switchTab(t){
  G.tab = t;
  document.querySelectorAll('.atab').forEach(el => el.classList.toggle('on', el.dataset.tab===t));
  renderActions();
}

function doAtk(cid){
  G.pendingAct = { type:'attack', cid };
  HEX.hlAtk(cid);
  toast('Select a target to attack');
}

function doSpell(cid, si){
  const u = G.units[cid]; if(!u) return;
  const spellName = u.spellsKnown[si];
  const sp = SPELLS[spellName]; if(!sp) return;
  if(sp.heal){
    G.pendingAct = { type:'spell', cid, si, sn:spellName, isHeal:true };
    HEX.hlAlly();
    toast(`Select an ally to heal with ${spellName}`);
  } else {
    G.pendingAct = { type:'spell', cid, si, sn:spellName };
    HEX.hlSpell(cid);
    toast(`Select a target for ${spellName}`);
  }
}

function doDefend(cid){
  const u = G.units[cid]; if(!u) return;
  if(!u.status) u.status = {};
  u.status.defending = true;
  G.queue.push({ aId:cid, act:{ type:'defend' } });
  log(`${u.name} takes the Defend action (+2 AC).`, 'sys');
  renderQueue(); renderActions();
}

function doMove(cid){
  G.pendingAct = { type:'move', cid };
  HEX.hlMove(cid);
  toast('Click a green hex to move there');
}

function doFlee(cid){
  const u = G.units[cid];
  G.queue.push({ aId:cid, act:{ type:'flee' } });
  log(`${u.name} attempts to disengage and flee!`, 'sys');
  renderQueue();
}

function removeQ(i){ G.queue.splice(i,1); renderQueue(); }

function handleHex(k){
  const h = G.map[k]; if(!h) return;
  const unit = h.unit ? G.units[h.unit] : null;
  const pa = G.pendingAct;

  // Click own living party member to select
  if(unit && unit.faction==='party' && unit.alive && unit.hp>0 && !pa){
    selChar(unit.id); return;
  }

  if(!pa) return;

  if(pa.type === 'move'){
    if(h.passable && !h.unit && h.hl==='move'){
      G.moveHex = k;
      G.queue.push({ aId:pa.cid, act:{ type:'move', th:k } });
      log(`${G.units[pa.cid]?.name} will move to ${k}.`, 'sys');
      G.pendingAct=null; HEX.clearHL(); HEX.render(); renderQueue();
    } return;
  }

  if(pa.type === 'attack' && unit && unit.faction!=='party'){
    G.queue.push({ aId:pa.cid, act:{ type:'attack' }, tId:unit.id });
    log(`Attack target locked: ${unit.name}`, 'sys');
    G.pendingAct=null; HEX.clearHL(); HEX.render(); renderQueue();
    return;
  }

  if(pa.type === 'spell' && unit){
    const ok = pa.isHeal ? unit.faction==='party' : unit.faction!=='party';
    if(ok){
      G.queue.push({ aId:pa.cid, act:{ type:'spell', si:pa.si, sn:pa.sn }, tId:unit.id });
      log(`${pa.isHeal?'Heal':'Spell'} target: ${unit.name}`, 'sys');
      G.pendingAct=null; HEX.clearHL(); HEX.render(); renderQueue();
    } return;
  }
}

// ══════════════════════════════════════════════════════════
// EXECUTE ACTIONS
// ══════════════════════════════════════════════════════════
async function executeActions(){
  if(!G.queue.length || G.over) return;
  document.getElementById('execbtn').disabled = true;
  const q = [...G.queue]; G.queue = [];
  for(const qa of q){ await resolveAct(qa); await sl(380); }
  G.pendingAct = null; G.moveHex = null;
  HEX.clearHL(); renderQueue(); renderParty(); renderInit(); HEX.render();
  checkEnd();
}

async function resolveAct(qa){
  const actor = G.units[qa.aId];
  if(!actor || !actor.alive || actor.hp<=0) return;
  const a = qa.act;

  if(a.type === 'attack'){
    const tgt = G.units[qa.tId];
    if(!tgt || !tgt.alive || tgt.hp<=0){ log(`${actor.name}'s target is already down.`, 'miss'); return; }
    // Use weapon from unit — unarmed if null
    const weaponStr = actor.weapon || null;
    const w = weaponStr ? WEAPONS[weaponStr] : { dmg:[1,2] };  // unarmed = 1d2
    const res = resolveAttack(actor, w, tgt.ac);

    if(res.fumble){
      log(`${actor.name} attacks ${tgt.name} — Natural 1! Critical fumble!`, 'miss');
    } else if(res.crit){
      tgt.hp = Math.max(0, tgt.hp - res.dmg);
      log(`⚔ CRITICAL! ${actor.name} lands a devastating blow on ${tgt.name} with ${weaponStr||'fists'} — ${res.dmg} damage! [${tgt.hp}/${tgt.max_hp} HP]`, 'crit');
    } else if(res.hits){
      tgt.hp = Math.max(0, tgt.hp - res.dmg);
      log(`⚔ ${actor.name} hits ${tgt.name} with ${weaponStr||'fists'} (d20:${res.roll}, needed ${res.needed}) — ${res.dmg} damage! [${tgt.hp}/${tgt.max_hp} HP]`, 'hit');
    } else {
      log(`${actor.name} attacks ${tgt.name} (d20:${res.roll}, needed ${res.needed}) — Miss.`, 'miss');
    }
    if(tgt.hp<=0){ tgt.alive=false; log(`💀 ${tgt.name} has fallen!`, 'death'); if(tgt.faction==='enemy') rmUnit(tgt.id); }
  }

  else if(a.type === 'spell'){
    const tgt = G.units[qa.tId]; if(!tgt) return;
    const spellName = actor.spellsKnown[a.si];
    const sp = SPELLS[spellName]; if(!sp) return;
    actor.spellsUsed = (actor.spellsUsed||0) + 1;

    if(sp.heal){
      const h = rollDice(sp.heal) + (sp.bonus||0);
      tgt.hp = Math.min(tgt.max_hp, tgt.hp + h);
      log(`💚 ${actor.name} casts ${spellName} on ${tgt.name} — healed ${h} HP! [${tgt.hp}/${tgt.max_hp} HP]`, 'heal');
    } else if(sp.dmg[0]>0){
      const dmgAmt = rollDice(sp.dmg) + (sp.bonus||0);
      tgt.hp = Math.max(0, tgt.hp - dmgAmt);
      log(`✨ ${actor.name} casts ${spellName} on ${tgt.name} — ${dmgAmt} damage! [${tgt.hp}/${tgt.max_hp} HP]`, 'spell');
      if(tgt.hp<=0){ tgt.alive=false; log(`💀 ${tgt.name} has fallen!`, 'death'); if(tgt.faction==='enemy') rmUnit(tgt.id); }
    } else {
      // Utility spells
      if(spellName==='Shield'){ actor.status.shield=true; actor.ac=Math.max(0, actor.ac-4); log(`✨ ${actor.name} casts Shield — AC is now ${actor.ac}.`, 'spell'); }
      else if(spellName==='Bless'){ log(`✨ ${actor.name} casts Bless — party gains +1 to attacks and morale.`, 'spell'); }
      else if(spellName==='Sleep'){ if(tgt.faction==='enemy'){ tgt.status.sleep=true; log(`✨ ${actor.name} casts Sleep — ${tgt.name} falls into magical slumber!`, 'spell'); } }
      else if(spellName==='Hold Person'){ log(`✨ ${actor.name} casts Hold Person on ${tgt.name} — target is paralysed!`, 'spell'); }
      else { log(`✨ ${actor.name} casts ${spellName}: ${sp.desc}`, 'spell'); }
    }
  }

  else if(a.type === 'move'){
    if(a.th){
      if(actor.hex && G.map[actor.hex]) G.map[actor.hex].unit = null;
      actor.hex = a.th;
      if(G.map[a.th]) G.map[a.th].unit = actor.id;
      log(`${actor.name} moves to ${a.th}.`, 'sys');
    }
  }

  else if(a.type === 'defend'){
    log(`${actor.name} takes the Defend action.`, 'sys');
  }

  else if(a.type === 'flee'){
    G.over = true; G.resultToSend = 'fled';
    log(`${actor.name} flees! The party withdraws from combat.`, 'sys');
    await sl(600);
    showResult('fled');
    return;
  }

  HEX.render(); renderParty(); renderInit();
}

function rmUnit(id){
  const u = G.units[id];
  if(u?.hex && G.map[u.hex]) G.map[u.hex].unit = null;
}

// ══════════════════════════════════════════════════════════
// TURN FLOW
// ══════════════════════════════════════════════════════════
async function endTurn(){
  if(G.over) return;
  if(G.queue.length) await executeActions();
  advTurn();
}

async function advTurn(){
  if(!G.order.length || G.over) return;
  G.turn = (G.turn+1) % G.order.length;
  let attempts = 0;
  while(attempts < G.order.length){
    const cur = G.units[G.order[G.turn]];
    if(cur && cur.alive && cur.hp>0) break;
    G.turn = (G.turn+1) % G.order.length; attempts++;
  }
  if(G.turn === 0){
    G.round++;
    document.getElementById('round-badge').textContent = `Round ${G.round}`;
  }

  const active = G.units[G.order[G.turn]];
  if(!active) return;

  // Clear defend status from previous turn
  if(active.status?.defending) active.status.defending = false;

  if(active.faction === 'enemy'){
    document.getElementById('phase-badge').textContent = `${active.name} acting…`;
    renderInit();
    await sl(350);
    await runEnemyTurn(active);
    await sl(280);
    if(!G.over) advTurn();
    return;
  }

  log(`── ${active.name}'s turn (Round ${G.round}) ──`, 'sep');
  document.getElementById('phase-badge').textContent = `${active.name}'s turn`;
  selChar(active.id);
  renderInit(); renderParty(); HEX.render();
  checkEnd();
}

async function runEnemyTurn(enemy){
  if(!enemy.alive || enemy.hp<=0) return;
  log(`── ${enemy.name}'s turn ──`, 'sep');
  const alive = Object.values(G.units).filter(u => u.faction==='party' && u.alive && u.hp>0);
  if(!alive.length) return;

  // Skip sleeping enemies
  if(enemy.status?.sleep){
    log(`${enemy.name} is sleeping and cannot act.`, 'sys');
    return;
  }

  const tgt = alive[Math.floor(Math.random() * alive.length)];

  // Move toward target if out of range
  if(enemy.hex && tgt.hex){
    const dist = hexDist(enemy.hex, tgt.hex);
    if(dist > 1.5){
      let bk=null, bd=Infinity;
      for(const k in G.map){
        const h = G.map[k];
        if(h.passable && !h.unit && hexDist(enemy.hex,k) <= (enemy._moveRange||4)){
          const d2 = hexDist(k, tgt.hex);
          if(d2 < bd){ bd=d2; bk=k; }
        }
      }
      if(bk){
        if(G.map[enemy.hex]) G.map[enemy.hex].unit = null;
        enemy.hex = bk;
        if(G.map[bk]) G.map[bk].unit = enemy.id;
        log(`${enemy.name} moves toward ${tgt.name}.`, 'sys');
        HEX.render(); await sl(220);
      }
    }
  }

  // Attack if in range
  const dist2 = (enemy.hex && tgt.hex) ? hexDist(enemy.hex, tgt.hex) : 1;
  if(dist2 <= 1.5){
    const w = { dmg: enemy._dmg || [1,6] };
    const res = resolveAttack(enemy, w, tgt.ac);
    if(res.fumble){
      log(`🔴 ${enemy.name} attacks ${tgt.name} — Natural 1! Fumble.`, 'miss');
    } else if(res.crit){
      tgt.hp = Math.max(0, tgt.hp - res.dmg);
      log(`🔴 CRITICAL! ${enemy.name} savages ${tgt.name} — ${res.dmg} damage! [${tgt.hp}/${tgt.max_hp} HP]`, 'crit');
    } else if(res.hits){
      tgt.hp = Math.max(0, tgt.hp - res.dmg);
      log(`🔴 ${enemy.name} hits ${tgt.name} (d20:${res.roll}, needed ${res.needed}) — ${res.dmg} damage! [${tgt.hp}/${tgt.max_hp} HP]`, 'hit');
    } else {
      log(`🔴 ${enemy.name} attacks ${tgt.name} (d20:${res.roll}, needed ${res.needed}) — Miss.`, 'miss');
    }
    if(tgt.hp<=0){ tgt.alive=false; log(`💀 ${tgt.name} has fallen!`, 'death'); }
  } else {
    log(`${enemy.name} cannot reach ${tgt.name} this turn.`, 'sys');
  }
  HEX.render(); renderParty();
}

function checkEnd(){
  if(G.over) return;
  const pAlive = Object.values(G.units).filter(u => u.faction==='party' && u.alive && u.hp>0);
  const eAlive = Object.values(G.units).filter(u => u.faction==='enemy' && u.alive && u.hp>0);
  if(!eAlive.length){
    G.over = true; G.resultToSend = 'win';
    log('⚔ Victory! All enemies defeated!', 'crit');
    setTimeout(()=>showResult('win'), 800);
  } else if(!pAlive.length){
    G.over = true; G.resultToSend = 'lose';
    log('💀 The party has fallen…', 'death');
    setTimeout(()=>showResult('lose'), 800);
  }
}

function fleeCombat(){
  if(G.over) return;
  document.getElementById('ctitle').textContent = 'Flee Combat?';
  document.getElementById('cmsg').innerHTML = 'The party attempts to withdraw from battle. This will end the encounter.';
  document.getElementById('cyes').textContent = 'Flee';
  document.getElementById('cyes').onclick = ()=>{ closeDlg(); G.over=true; G.resultToSend='fled'; showResult('fled'); };
  document.getElementById('covr').style.display = 'flex';
}

function showResult(result){
  const overlay = document.getElementById('result-overlay');
  const title   = document.getElementById('result-title');
  const sub     = document.getElementById('result-sub');
  const retBtn  = document.getElementById('result-return');

  if(result === 'win'){
    title.textContent = 'Victory!';
    title.style.color = '#e8c870';
    sub.textContent = 'The party has triumphed. The dungeon yields its secrets.';
  } else if(result === 'lose'){
    title.textContent = 'Defeated';
    title.style.color = '#e74c3c';
    sub.textContent = 'The party has fallen in battle.';
  } else {
    title.textContent = 'Fled';
    title.style.color = '#f0a040';
    sub.textContent = 'The party has withdrawn from combat.';
  }

  overlay.style.display = 'flex';

  // If running inside main game iframe, auto-return after 3s
  if(G.isLive){
    let t = 3;
    retBtn.textContent = `Return to Game (${t}s)`;
    const tid = setInterval(()=>{
      t--;
      retBtn.textContent = t>0 ? `Return to Game (${t}s)` : 'Returning…';
      if(t<=0){ clearInterval(tid); sendResult(result); }
    }, 1000);
  }
}

function showTT(u, mx, my){
  const tt = document.getElementById('tt');
  document.getElementById('ttn').textContent = `${u.name} — ${u.race||''} ${u.cls||''} ${u.lvl||''}`;
  const dead = !u.alive || u.hp<=0;
  document.getElementById('ttb').innerHTML = `
    <div>HP: <b>${dead?'0':u.hp}/${u.max_hp}</b>${dead?' <span style="color:#e74c3c">† Fallen</span>':''} · AC: <b>${u.ac}</b></div>
    <div>STR${u.stats?.STR||'?'} DEX${u.stats?.DEX||'?'} CON${u.stats?.CON||'?'} INT${u.stats?.INT||'?'} WIS${u.stats?.WIS||'?'} CHA${u.stats?.CHA||'?'}</div>
    <div>THAC0: ${u._thac0||'?'} · Move: ${u._moveRange||4} hexes</div>
    ${u.weapon?`<div style="color:var(--gold);margin-top:2px">⚔ ${u.weapon}${u.armor?' · '+u.armor:''}</div>`:''}
    ${u.spellsKnown?.length?`<div style="color:var(--purple2)">✨ ${u.spellsKnown.join(', ')}</div>`:''}
    ${u.status?.defending?`<div style="color:#7aadea">Defending (+2 AC)</div>`:''}
    ${u.status?.sleep?`<div style="color:#aab0e8">Sleeping (helpless)</div>`:''}
  `;
  tt.style.display='block'; tt.style.left=(mx+12)+'px'; tt.style.top=(my-8)+'px';
}
function hideTT(){ document.getElementById('tt').style.display='none'; }

// COMBAT LOG
// ══════════════════════════════════════════════════════════
function log(msg, cls=''){
  const el = document.getElementById('log-entries');
  const d  = document.createElement('div');
  d.className = `le ${cls}`; d.textContent = msg;
  el.appendChild(d); el.scrollTop = el.scrollHeight;
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._tid); t._tid = setTimeout(()=>t.classList.remove('show'), 2600);
}

function closeDlg(){ document.getElementById('covr').style.display='none'; }
function sl(ms){ return new Promise(r=>setTimeout(r,ms)); }

// ══════════════════════════════════════════════════════════
// LOAD COMBAT DATA (shared by URL-params path and postMessage path)
// ══════════════════════════════════════════════════════════
function loadCombat(data){
  G.units={}; G.queue=[]; G.order=[]; G.turn=0; G.round=1; G.over=false;
  G.pendingAct=null; G.sel=null; G.moveHex=null;

  if(data.map_type){ G.mapType=data.map_type; HEX.buildMap(); HEX.resize(); }

  const all = [
    ...(data.party||[]).map(u => ({...u, faction:'party'})),
    ...(data.enemies||[]).map(u => ({...u, faction:'enemy'}))
  ];

  all.forEach(u => {
    G.units[u.id] = u;
    // Roll initiative: d6 + DEX mod (AD&D style) or d20 + DEX mod
    u.initiative = d(10) + statMod(u.stats?.DEX||10);
    if(u._portrait) cachePortrait(u.id, u._portrait);
  });

  G.order = Object.keys(G.units)
    .filter(id => G.units[id].alive && G.units[id].hp>0)
    .sort((a,b) => G.units[b].initiative - G.units[a].initiative);

  // Dead party members still show in party panel but not in initiative
  Object.values(G.units).filter(u => u.faction==='party' && (!u.alive||u.hp<=0)).forEach(u => {
    u.alive = false;
  });

  placeUnits();

  const firstAlive = Object.values(G.units).find(u => u.faction==='party' && u.alive && u.hp>0);
  if(firstAlive) selChar(firstAlive.id);

  document.getElementById('round-badge').textContent = 'Round 1';
  const first = G.units[G.order[0]];
  document.getElementById('phase-badge').textContent = first ? `${first.name}'s turn` : '';

  log('══ Combat begins! ══', 'sep');
  G.order.forEach(id => log(`${G.units[id].name}: Initiative ${G.units[id].initiative}`, 'sys'));

  // Show dead members in log
  Object.values(G.units).filter(u=>u.faction==='party'&&(!u.alive||u.hp<=0)).forEach(u=>{
    log(`${u.name} enters combat already fallen.`, 'sys');
  });

  log('Select a character → choose action → pick a target → Execute.', 'sys');

  if(first?.faction==='enemy'){
    setTimeout(async()=>{ await runEnemyTurn(first); await sl(300); advTurn(); }, 800);
  }

  renderParty(); renderInit(); renderActions(); HEX.render();
}

function placeUnits(){
  const party   = Object.values(G.units).filter(u=>u.faction==='party');
  const enemies = Object.values(G.units).filter(u=>u.faction==='enemy');
  const pH = ['2,6','3,5','3,7','2,8','2,4','3,9'];
  const eH = ['18,6','18,7','19,5','19,8','17,5','17,8','18,4','19,9','17,7','18,9'];

  party.forEach((u,i) => {
    const k = pH[i] || `2,${5+i}`;
    if(G.map[k]){ G.map[k].passable=true; G.map[k].terrain='stone'; G.map[k].unit=u.id; u.hex=k; }
  });
  enemies.forEach((u,i) => {
    const k = eH[i] || `18,${5+i}`;
    if(G.map[k]){ G.map[k].passable=true; G.map[k].terrain='stone'; G.map[k].unit=u.id; u.hex=k; }
  });
}

// SCHEMA VIEWER
// ══════════════════════════════════════════════════════════
function showSchema(){
  const s = {
    "URL params (main game launch)": {
      "party":   "JSON.stringify([partyMember, ...])",
      "enemies": `JSON.stringify(["Goblin","Goblin","Orc"])`,
      "fixed":   "1 | 0"
    },
    "partyMember fields (exact main game schema)": {
      name:"string", race:"Human|Elf|Dwarf|Halfling", cls:"Fighter|Cleric|Mage|Thief",
      lvl:"number", xp:"number", hp:"number (current)", maxhp:"number",
      ac:"number (lower=better)", alive:"bool (false=show skull)",
      stats:"{STR,INT,WIS,DEX,CON,CHA}", weapon:"string|null (key into WEAPONS table)",
      armor:"string|null", status:"{defending,shield,sleep,blessed}",
      spellsKnown:"string[]", spellSlots:"number", spellsUsed:"number"
    },
    "postMessage handshake": {
      "step1 — page signals ready": `window.parent.postMessage({type:'encounterReady'}, '*')`,
      "step2 — parent sends portraits": `{type:'encounterPortraits', portraits:{'Gareth':'data:image/png;base64,...'}, monsters:{'Goblin':'data:image/png;...'}}`,
      "step3 — page sends result": `window.parent.postMessage({type:'encounterResult', result:'win|lose|fled'}, '*')`
    },
    "WEAPONS table keys": Object.keys(WEAPONS),
    "MONSTERS table keys": Object.keys(MONSTERS)
  };
  document.getElementById('ctitle').textContent = 'Integration Schema';
  document.getElementById('cmsg').innerHTML = `<pre style="text-align:left;font-size:9px;max-height:340px;overflow:auto;color:var(--text2);white-space:pre-wrap">${JSON.stringify(s,null,2)}</pre>`;
  document.getElementById('cyes').textContent = 'Copy JSON';
  document.getElementById('cyes').onclick = ()=>{ navigator.clipboard?.writeText(JSON.stringify(s,null,2)); toast('Copied!'); closeDlg(); };
  document.getElementById('covr').style.display = 'flex';
}

  // Signal ready to parent (main game will then send portraits)

  // Fall back to demo if not launched from main game

    loadCombat(DEMO);
    log('Demo mode — not launched from main game. See 📋 Schema for integration.', 'sys');
  }
});

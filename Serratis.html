/* one-time arrow pad + deck buttons */
let _padBuilt=false;
function buildArrowPad(){
  if(_padBuilt)return; _padBuilt=true;
  const pad=$("#arrowpad"); if(!pad)return;
  // layout matches EotB: top row = turn-left, forward, turn-right; bottom = strafe-left, back, strafe-right
  const defs=[
    ["↰",()=>turn(true)], ["↑",()=>tryMove(true)], ["↱",()=>turn(false)],
    ["←",()=>strafe(true)], ["↓",()=>tryMove(false)], ["→",()=>strafe(false)],
  ];
  defs.forEach(([ch,fn])=>{ const b=document.createElement("div"); b.className="apad"; b.textContent=ch; b.onclick=fn; pad.appendChild(b); });
}
function mkBtn(label,key,fn,opts){
  opts=opts||{};
  const b=document.createElement("button");
  b.className="btn"+(opts.danger?" danger":"");
  b.innerHTML=key?label.replace(key,`<span class="key">${key}</span>`):label;
  b.onclick=fn; if(opts.disabled)b.disabled=true;
  return b;
}
function renderCmd(){
  const bar=$("#cmdbar");bar.innerHTML="";
  const deckEl=document.querySelector(".deck");
  // show the movement deck while exploring, the action bar while in combat
  if(deckEl) deckEl.style.display=(G.mode==="combat"||G.mode==="dead")?"none":"flex";
  bar.style.display=(G.mode==="combat")?"flex":"none";
  if(G.mode==="dead"){
    bar.style.display="flex";
    bar.appendChild(mkBtn("RESTART","R",()=>location.reload()));
    return;
  }
  if(G.mode==="combat"){
    const c=G.combat, u=curUnit();
    if(u&&u.side==="ally"&&c.selecting&&c.selecting.mode==="menu"){
      bar.appendChild(mkBtn("MOVE","M",pcMove));
      bar.appendChild(mkBtn("ATTACK","A",pcAttack));
      if(u.ref.spellsKnown.length) bar.appendChild(mkBtn("CAST","C",pcCast,{disabled:u.ref.spellsUsed>=u.ref.spellSlots}));
      bar.appendChild(mkBtn("DEFEND","D",pcDefend));
      bar.appendChild(mkBtn("END TURN","E",()=>nextTurn()));
    } else if(c.selecting&&c.selecting.mode==="spellpick"){
      c.selecting.pc.spellsKnown.forEach(sn=>{
        bar.appendChild(mkBtn(sn,null,()=>chooseSpell(sn)));
      });
      bar.appendChild(mkBtn("BACK",null,()=>{c.selecting={mode:"menu",pc:c.selecting.pc};renderAll();}));
    } else if(c.selecting&&(c.selecting.mode==="move"||c.selecting.mode==="attack"||c.selecting.mode==="spelltarget")){
      const legend=document.createElement("span");legend.className="legend";
      legend.textContent="Click a square on the battle map. ";
      bar.appendChild(legend);
      bar.appendChild(mkBtn("CANCEL",null,()=>{c.selecting={mode:"menu",pc:c.selecting.pc};renderAll();}));
    } else {
      const s=document.createElement("span");s.className="legend";s.textContent="Enemy turn...";bar.appendChild(s);
    }
    return;
  }
  // exploration: arrow pad handles movement; deck holds persistent actions (2x2 grid)
  buildArrowPad();
  const deck=$("#deckbtns");
  if(deck){
    deck.innerHTML="";
    const mk=(label,fn,disabled)=>{ const b=document.createElement("div"); b.className="deckbtn"+(disabled?" off":""); b.textContent=label; if(!disabled)b.onclick=fn; deck.appendChild(b); };
    mk("USE ITEM", townAction, G.mode!=="town");  // only usable at town features
    mk("CAMP",     openCamp,   false);
    mk("INVENTORY",()=>showSheet(0), false);
    // when embedded in a host page, the 4th slot is EXIT (back to host); otherwise ART (asset panel)
    if(window.parent && window.parent!==window){
      mk("EXIT", ()=>{
        if(!confirm("Return to the world above? Your current run will end.")) return;
        try{ window.parent.postMessage({type:"SERRATIS_EXIT"}, "*"); }catch(e){}
      }, false);
    } else {
      mk("ART", openAssetPanel, false);
    }
  }
  // keep cmdbar empty in exploration (kept for combat)
}

function itemKind(it){ if(WEAPONS[it])return "weapon"; if(ARMORS[it])return "armor"; return "misc"; }
function equipNote(p,it){
  if(WEAPONS[it])return WEAPONS[it].classes.includes(p.cls)?'<span class="link">equip</span>':'<span class="muted">n/a</span>';

window.useItem=function(pi,ii){
  const p=G.party[pi];const it=p.inventory[ii];

function openShop(){

               ["Short Sword",10],["Long Sword",20],["Mace",15],["Two-H Sword",50],
               ["Short Bow",30],["Sling",5]];
  overlay(`
    <h2>Serratis Outfitters</h2>
    <p class="center muted">Gold: ${G.gold} gp</p>
    <table class="inv" style="margin-top:8px;">
      ${wares.map((w,i)=>`<tr><td class="it">${w[0]}</td><td class="muted">${itemKind(w[0])}</td><td>${w[1]} gp</td><td><span class="link" onclick="buy('${w[0]}',${w[1]})">buy</span></td></tr>`).join("")}
    </table>
    <p class="muted center" style="margin-top:8px;">Bought items go to the active hero's backpack — open CHAR to equip.</p>
    <div class="center" style="margin-top:10px;"><button class="btn" onclick="closeOverlay()">LEAVE</button></div>`);
}
window.buy=function(item,cost){
  if(G.gold<cost){log("You can't afford that.","bad");return;}
  G.gold-=cost; giveItem(item);
  log("Bought "+item+" (-"+cost+" gp). It's in "+G.party[G.activePC].name+"'s pack.","good");
  openShop();
};
function openTraining(){
  let html=`<h2>Training Hall</h2><p class="center muted">Heroes ready to advance can train here.</p><table class="inv" style="margin-top:8px;">`;
  G.party.forEach((p,i)=>{
    const can=levelFor(p.xp)>p.lvl;
    html+=`<tr><td>${p.name} <span class="muted">${p.cls} L${p.lvl}</span></td><td>${p.xp} xp</td><td>${can?`<span class="link" onclick="train(${i})">train ↑</span>`:`<span class="muted">need ${(XP_TABLE[p.lvl]||"-")} xp</span>`}</td></tr>`;
  });
  html+=`</table><div class="center" style="margin-top:10px;"><button class="btn" onclick="closeOverlay()">LEAVE</button></div>`;
  overlay(html);
}
window.train=function(i){ checkLevel(G.party[i]); openTraining(); };
function openTavern(){
  const rumors=[
    "\"They say the Sorcerer's Crypt lies beneath Castle Serratis — and something foul stirs there.\"",
    "\"Clear the goblin warband in Castle Serratis and a hidden stair will reveal itself.\"",
    "\"Magic Missile never misses. A mage's best friend.\"",
    "\"Sleep ends a fight before it starts — if your foes are weak enough.\"",
    "\"Rest only when safe. Monsters love an unguarded camp.\"",
    "\"An ogre warlord commands the crypt. Bring your best steel.\"",
  ];
  overlay(`
    <h2>The Laughing Goblin</h2>
    <p class="center muted">You buy a round and listen for rumors...</p>
    <div style="margin-top:12px;color:var(--c-brown);line-height:1.6;">${choice(rumors)}</div>
    <div class="center" style="margin-top:16px;">
      <button class="btn" onclick="openTavern()">ANOTHER ROUND</button>
      <button class="btn" onclick="closeOverlay()">LEAVE</button>
    </div>`);
}

function endgame(){
  G.mode="won";
  // notify parent page (if embedded in an iframe) that the player won
  const embedded = (window.parent && window.parent !== window);
  if(embedded){
    try{
      window.parent.postMessage({
        type:"SERRATIS_WIN",
        party: G.party.map(p=>({name:p.name,race:p.race,cls:p.cls,lvl:p.lvl})),
        gold: G.gold
      }, "*");
    }catch(e){ /* sandboxed parent — ignore */ }
  }
  overlay(`
    <h2>VICTORY</h2>
    <div style="line-height:1.7;color:var(--c-lgreen);text-align:center;margin-top:10px;">
      The ogre warlord falls. As its corruption drains away,<br>
      a clear pool of radiant water wells up from the crypt floor —<br>
      the lost <b style="color:var(--c-yellow)">Heart of Serratis</b>, restored at last.<br><br>
      The realm is saved. Bards will sing of your party for generations.
    </div>
    <div class="center" style="margin-top:14px;">
      <div class="muted">Final party:</div>
      ${G.party.map(p=>`<div>${p.name} — ${p.race} ${p.cls} L${p.lvl}</div>`).join("")}
      <div style="margin-top:6px;color:var(--c-yellow)">Gold amassed: ${G.gold} gp</div>
    </div>
    <div class="center" style="margin-top:16px;">
      ${embedded
        ? `<button class="btn" onclick="window.parent.postMessage({type:'SERRATIS_EXIT'},'*')">RETURN</button>`
        : `<button class="btn" onclick="location.reload()">PLAY AGAIN</button>`}
    </div>`);
}

const CREATE={step:0, draft:null, roster:[]};
function startCreation(){
  CREATE.roster=[]; CREATE.step=0;
  partyChoiceScreen();
}
function partyChoiceScreen(){
  overlay(`
    <h2>Assemble Your Party</h2>
    <p class="center muted">Four heroes will descend into the ruins of Serratis.</p>
    <div class="choice-grid" style="margin-top:16px;">
      <div class="choice" onclick="quickParty()">
        <span class="t">⚔ Quick Party</span><br>
        <span class="muted">A balanced, pre-rolled band of four — ready at once. No stat below 11.</span>
      </div>
      <div class="choice" onclick="newCharScreen()">
        <span class="t">✎ Create Your Own</span><br>
        <span class="muted">Roll each hero by hand: race, class, attributes, name.</span>
      </div>
    </div>`);
}
/* roll a stat set with a floor (no value at or below `floor`) */
function rollStatsFloor(floor){
  let s, tries=0;
  do{ s=rollStats(); tries++; }
  while(tries<400 && Object.values(s).some(v=>v<=floor));
  // guarantee: bump any stragglers up to floor+1 if the loop gave up
  for(const k in s) if(s[k]<=floor) s[k]=floor+1+rnd(3);
  return s;
}
/* pre-rolled balanced party; floor of 10 → all stats 11+ (after racial mods kept ≥11 too) */
window.quickParty=function(){
  const recipe=[
    {name:"Gareth", race:"Human",    cls:"Fighter"},
    {name:"Sister Lyra", race:"Dwarf", cls:"Cleric"},
    {name:"Vex", race:"Elf",         cls:"Mage"},
    {name:"Quill", race:"Halfling",  cls:"Thief"},
  ];
  CREATE.roster = recipe.map(r=>{
    // roll until racial-modified stats are ALL >= 11
    let stats, ok=false, guard=0;
    while(!ok && guard++<500){
      stats=rollStatsFloor(10);
      const mod={...stats}; const rm=RACES[r.race].mod;
      for(const k in rm) mod[k]=clamp(mod[k]+rm[k],3,18);
      ok=Object.values(mod).every(v=>v>=11);
    }
    // final safety net: floor the modified result
    const rm=RACES[r.race].mod;
    for(const k in rm){ /* pre-adjust base so post-mod stays >=11 */
      const post=clamp(stats[k]+(rm[k]||0),3,18);
      if(post<11) stats[k]=clamp(11-(rm[k]||0),3,18);
    }
    for(const k in stats){ const post=clamp(stats[k]+(rm[k]||0),3,18); if(post<11) stats[k]=clamp(stats[k]+ (11-post),3,18); }
    return makeCharacter(r.name,r.race,r.cls,stats);
  });
  G.party=CREATE.roster; G.activePC=0;
  closeOverlay();
  beginAdventure();
};
function newCharScreen(){
  CREATE.draft={name:"",race:null,cls:null,stats:rollStats()};
  raceScreen();
}
function raceScreen(){
  const o=overlay(`
    <h2>Create a Hero (${CREATE.roster.length+1} of 4)</h2>
    <h3>Choose a Race</h3>
    <div class="choice-grid">
      ${Object.keys(RACES).map(r=>`<div class="choice" onclick="selRace('${r}')"><span class="t">${r}</span><br><span class="muted">${RACES[r].desc}</span></div>`).join("")}
    </div>
    ${CREATE.roster.length?`<div class="center"><button class="btn" onclick="finishCreation()">DONE — START with ${CREATE.roster.length}</button></div>`:`<div class="center"><button class="btn" onclick="partyChoiceScreen()">◄ BACK</button></div>`}
  `);
}
window.selRace=function(r){ CREATE.draft.race=r; classScreen(); };
function classScreen(){
  const r=CREATE.draft.race;
  overlay(`
    <h2>${r}</h2>
    <h3>Choose a Class</h3>
    <div class="choice-grid">
      ${RACES[r].classes.map(c=>`<div class="choice" onclick="selClass('${c}')"><span class="t">${c}</span><br><span class="muted">${CLASSES[c].desc}</span></div>`).join("")}
    </div>
    <div class="center"><button class="btn" onclick="raceScreen()">◄ BACK</button></div>`);
}
window.selClass=function(c){ CREATE.draft.cls=c; statsScreen(); };
function statsScreen(){
  const dr=CREATE.draft;const r=RACES[dr.race];
  const shown={...dr.stats};for(const k in r.mod)shown[k]=clamp(shown[k]+r.mod[k],3,18);
  overlay(`
    <h2>${dr.race} ${dr.cls}</h2>
    <h3>Roll Attributes <span class="muted">(prime: ${CLASSES[dr.cls].prime})</span></h3>
    <div style="max-width:240px;margin:0 auto;">
      ${Object.keys(shown).map(k=>{const m=statMod(shown[k]);return `<div class="stat-line"><span>${k}${k===CLASSES[dr.cls].prime?' ★':''}</span><span>${shown[k]} <span class="muted">(${m>=0?'+':''}${m})</span></span></div>`;}).join("")}
    </div>
    <div class="center" style="margin-top:10px;">
      <button class="btn" onclick="reroll()">RE-ROLL</button>
    </div>
    <div class="fld" style="max-width:260px;margin:12px auto;">
      <label>Name:</label>
      <input id="cname" maxlength="11" placeholder="enter a name" value="${dr.name}">
    </div>
    <div class="center">
      <button class="btn" onclick="confirmChar()">✓ ACCEPT HERO</button>
      <button class="btn" onclick="classScreen()">◄ BACK</button>
    </div>`);
  setTimeout(()=>{const el=$("#cname");if(el)el.focus();},50);
}
window.reroll=function(){ CREATE.draft.stats=rollStats(); statsScreen(); };
window.confirmChar=function(){
  const nm=$("#cname").value.trim()|| randomName(CREATE.draft.race);
  CREATE.draft.name=nm;
  const pc=makeCharacter(nm,CREATE.draft.race,CREATE.draft.cls,CREATE.draft.stats);
  CREATE.roster.push(pc);
  if(CREATE.roster.length>=4){ finishCreation(); return; }
  newCharScreen();
};
window.finishCreation=function(){
  if(!CREATE.roster.length){ return; }
  G.party=CREATE.roster; G.activePC=0;
  closeOverlay();
  beginAdventure();
};
function randomName(race){
  const N={Human:["Aldric","Mara","Joren","Sela","Brom"],Elf:["Aelar","Liriel","Faen","Shann"],
           Dwarf:["Borin","Helga","Thrain","Dwalin"],Halfling:["Pip","Rosa","Milo","Dell"]};
  return choice(N[race]||N.Human);
}

/* ============================================================
   BOOT-SCREEN BACKGROUND + REPTILIAN EYE
   ------------------------------------------------------------
   Two integration approaches:
     A) "painted"  — the eye region in the source image has been replaced
                     with a painted red reptilian eye (handled in the PNG itself).
     B) "overlay"  — the source image is unmodified; a sharp pixel-art reptilian
                     eye is drawn in a canvas positioned over the eye coordinates.
   The toggle button in the boot corner switches between them.
   ============================================================ */
function setupBootScreen(){
  if(typeof document === "undefined" || !document.getElementById) return;
  const bs = document.getElementById("bootscreen");
  if(bs) bs.style.setProperty("--boot-bg", `url(${BOOT_PAINTED})`);
}
function boot(){
  buildTextures();
  buildDecorTex();
  buildPortraits();
  loadEmbeddedPortraits();
  buildArrowPad();
  setupBootScreen();
  startRenderLoop();
  // Initial canvas size match — important on mobile where the CSS reflow happens after load.
  requestAnimationFrame(()=>{ if(typeof autoResize==="function") autoResize(); });
  // Touch device detection: enable tap-zone hint overlay on coarse-pointer devices.
  // The hints will be shown only when exploring (dungeon/town) — see updateTouchHints().
  if(window.matchMedia && window.matchMedia("(pointer: coarse)").matches){
    document.body.classList.add("is-touch");
    updateTouchHints();
  }
  const bs=$("#bootscreen");
  const go=()=>{ ensureAudio(); bs.style.display="none"; startCreation(); window.removeEventListener("keydown",go); bs.removeEventListener("click",go); };
  bs.addEventListener("click",go);
  window.addEventListener("keydown",go);
}
function updateTouchHints(){
  if(!document.body || !document.body.classList) return;
  // touch-only: explore-mode tap-zone hint affordance
  if(document.body.classList.contains("is-touch")){
    const exploring = (G.mode==="dungeon"||G.mode==="town") && !overlayOpen();
    document.body.classList.toggle("touch-hints", exploring);
  }
  // mobile combat: enlarge the viewport to fill the screen
  const inCombat = (G.mode==="combat");
  const wasInCombat = document.body.classList.contains("in-combat");
  document.body.classList.toggle("in-combat", inCombat);
  // when the layout changes, resize the canvas internal resolution to match the new CSS size
  if(inCombat!==wasInCombat){ if(typeof autoResize==="function") requestAnimationFrame(autoResize); }
}

/* ---- keyboard controls ---- */
window.addEventListener("keydown",e=>{
  if($("#overlay").classList.contains("show"))return;
  if(G.mode==="combat"){
    const c=G.combat;const u=curUnit();
    if(u&&u.side==="ally"&&c.selecting&&c.selecting.mode==="menu"){
      const k=e.key.toLowerCase();
      if(k==="m")pcMove(); else if(k==="a")pcAttack();
      else if(k==="c")pcCast(); else if(k==="d")pcDefend();
      else if(k==="e")nextTurn();
    }
    return;
  }
  if(G.mode==="town"||G.mode==="dungeon"){
    MOUSE.edgeSpin=0; // keyboard input cancels any off-window turn
    const k=e.key.toLowerCase();
    if(e.key==="ArrowUp"||k==="w"){ forwardDown(); e.preventDefault();}
    else if(e.key==="ArrowDown"||k==="s"){ if(!e.repeat) tryMove(false); e.preventDefault();}
    else if(e.key==="ArrowLeft"||k==="a"){ if(!e.repeat) turn(true); e.preventDefault();}
    else if(e.key==="ArrowRight"||k==="d"){ if(!e.repeat) turn(false); e.preventDefault();}
    else if(k==="q"){ if(!e.repeat) strafe(true); e.preventDefault();}
    else if(k==="e"){ if(!e.repeat) strafe(false); e.preventDefault();}
    else if(k==="u"&&G.mode==="town")townAction();
  }
});
/* forward key release → stop continuous walk/charge */
window.addEventListener("keyup",e=>{
  const k=e.key.toLowerCase();
  if(e.key==="ArrowUp"||k==="w") forwardUp();
});
/* canvas click → grid cell during combat (isometric inverse) */
cv.addEventListener("click",e=>{
  if(G.mode!=="combat"||!G.combat||!G.combat.selecting)return;
  const rect=cv.getBoundingClientRect();
  const sx=(e.clientX-rect.left)*(W/rect.width);
  const sy=(e.clientY-rect.top)*(H/rect.height);
  const [gx,gy]=screenToCell(sx,sy);
  if(gx>=0&&gy>=0&&gx<GRID_W&&gy<GRID_H) cellClick(gx,gy);
});

/* ---- continuous mouse-look in dungeon/town ----
   We only TRACK the cursor here. The render loop reads MOUSE.x every frame and
   computes the turn speed, so holding the pointer to one side keeps turning
   smoothly (mousemove alone would stop firing and snap the view back). */
const MOUSE={ x:0, over:false, edgeSpin:0 };
let downX=0, downMoved=0;
function overlayOpen(){ const o=$("#overlay"); return o && o.classList.contains("show"); }
function spinForX(clientX){
  const rect=cv.getBoundingClientRect();
  const nx=clamp(((clientX-rect.left)/rect.width - 0.5)*2, -1, 1); // -1..1
  const dead=0.32;   // wide central no-turn zone; only turn when cursor is well off-center
  let v=0;
  if(nx>dead) v=(nx-dead)/(1-dead);
  else if(nx<-dead) v=(nx+dead)/(1-dead);
  // quadratic ease: gentle near center, up to ~2.6 rad/s at the edges
  return Math.sign(v)*v*v*2.6;
}
cv.addEventListener("mousemove",e=>{
  MOUSE.x=e.clientX; MOUSE.over=true; MOUSE.edgeSpin=0;
  if(downMoved!=null){ downMoved+=Math.abs(e.clientX-downX); downX=e.clientX; }
});
cv.addEventListener("mouseenter",e=>{ MOUSE.x=e.clientX; MOUSE.over=true; MOUSE.edgeSpin=0; });
cv.addEventListener("mouseleave",e=>{
  MOUSE.over=false;
  // if the cursor was turning when it left, keep turning at that rate (full edge tilt)
  const s=spinForX(e.clientX);
  MOUSE.edgeSpin = (Math.abs(s)>0.0001) ? (s>0?2.6:-2.6) : 0;  // commit to full edge speed
});
cv.addEventListener("mousedown",e=>{ if(G.mode==="combat")return; downX=e.clientX; downMoved=0; });
cv.addEventListener("mouseup",e=>{
  if(G.mode!=="dungeon"&&G.mode!=="town")return;
  if(overlayOpen())return;
  // a click near screen-center with little drag = step forward
  const rect=cv.getBoundingClientRect();
  const nx=Math.abs(((e.clientX-rect.left)/rect.width-0.5)*2);
  if((downMoved||0)<6 && nx<0.32){ tryMove(true); }
  downMoved=0;
});
/* clicking anywhere (or pressing a key) cancels an off-window edge turn */
window.addEventListener("mousedown",()=>{ MOUSE.edgeSpin=0; });
/* scroll wheel / trackpad swipe nudges a 90° turn */
cv.addEventListener("wheel",e=>{
  if(G.mode!=="dungeon"&&G.mode!=="town")return;
  if(overlayOpen())return;
  e.preventDefault();
  if(e.deltaX>10||e.deltaY>10) turn(false);
  else if(e.deltaX<-10||e.deltaY<-10) turn(true);
},{passive:false});

/* ============================================================
   TOUCH INPUT — tap zones for phone/tablet
   ------------------------------------------------------------
   • Top half (between edge bands)    → forward (tap = one step; long-hold = walk)
   • Bottom half (between edge bands) → back (tap = one step)
   • Left  edge band (~22% of width)  → turn left
   • Right edge band (~22% of width)  → turn right
   In combat, taps fall through to the existing click handler (cell selection).
   ============================================================ */
const TOUCH = { activeId:null, zone:null, startT:0, startX:0, startY:0, backTimer:null };
const LONGPRESS_MS = 220;       // hold to enter continuous-walk mode
const EDGE_FRAC    = 0.22;      // left/right edge band as fraction of canvas width
function touchZone(clientX, clientY){
  const rect = cv.getBoundingClientRect();
  const nx = (clientX - rect.left) / rect.width;   // 0..1
  const ny = (clientY - rect.top ) / rect.height;  // 0..1
  if(nx < EDGE_FRAC)        return "left";
  if(nx > 1 - EDGE_FRAC)    return "right";
  if(ny < 0.5)              return "forward";
  return "back";
}
cv.addEventListener("touchstart", e=>{
  if(overlayOpen()) return;
  if(G.mode==="combat") return;             // combat uses tap-to-select via the click handler
  if(G.mode!=="dungeon" && G.mode!=="town") return;
  if(TOUCH.activeId!==null) return;          // already tracking a finger
  const t = e.changedTouches[0]; if(!t) return;
  e.preventDefault();
  TOUCH.activeId = t.identifier;
  TOUCH.startT   = performance.now();
  TOUCH.startX   = t.clientX;
  TOUCH.startY   = t.clientY;
  TOUCH.zone     = touchZone(t.clientX, t.clientY);

  // Immediate action on touch-down (so it feels responsive)
  if(TOUCH.zone === "left")       turn(true);
  else if(TOUCH.zone === "right") turn(false);
  else if(TOUCH.zone === "forward") forwardDown();   // hold-to-walk engages naturally
  else if(TOUCH.zone === "back")    {
    tryMove(false);
    // also repeat back-steps if held (forwardDown only handles forward)
    TOUCH.backTimer = setInterval(()=>{
      if(performance.now()-TOUCH.startT > LONGPRESS_MS) tryMove(false);
    }, 300);
  }
},{passive:false});
function endTouch(){
  if(TOUCH.activeId===null) return;
  TOUCH.activeId=null;
  if(TOUCH.zone==="forward") forwardUp();   // stop continuous walk
  if(TOUCH.backTimer){ clearInterval(TOUCH.backTimer); TOUCH.backTimer=null; }
  TOUCH.zone=null;
}
cv.addEventListener("touchend",    e=>{ for(const t of e.changedTouches){ if(t.identifier===TOUCH.activeId){ endTouch(); break; } } },{passive:false});
cv.addEventListener("touchcancel", e=>{ for(const t of e.changedTouches){ if(t.identifier===TOUCH.activeId){ endTouch(); break; } } },{passive:false});
/* combat tap-to-select: use touchstart so cells respond instantly on mobile */
cv.addEventListener("touchstart", e=>{
  if(G.mode!=="combat" || !G.combat || !G.combat.selecting) return;
  const t = e.changedTouches[0]; if(!t) return;
  e.preventDefault();
  const rect = cv.getBoundingClientRect();
  const sx = (t.clientX-rect.left)*(W/rect.width);
  const sy = (t.clientY-rect.top )*(H/rect.height);
  const [gx,gy] = screenToCell(sx,sy);
  if(gx>=0&&gy>=0&&gx<GRID_W&&gy<GRID_H) cellClick(gx,gy);
},{passive:false});

boot();
</script>
</body>
</html>

    log(pc.name+" blesses the party (+1 to hit).","good");
  } else if(name==="Cause Fear"){
    if(rnd(100)<60){tgt.status.fear=true;fxBurst(getXY(tgt)[0],getXY(tgt)[1],"rgba(122,92,255,ALPHA)",12,1);log(tgt.name+" is gripped by terror!","good");}
    else log(tgt.name+" resists the fear.","");
  }
  c.selecting=null; renderAll();
  setTimeout(()=>nextTurn(),550);
}
async function enemyTurn(e){
  if(e.status.sleep){ return; }
  if(e.status.fear){ // flee: move away
    e.status.fear=false; log(e.name+" cowers in fear.",""); return;
  }
  // find nearest living ally
  const targets=G.party.filter(p=>p.alive);
  if(!targets.length)return;
  let best=targets[0],bd=999;
  for(const p of targets){const dd=distance(e.x,e.y,p.cx,p.cy);if(dd<bd){bd=dd;best=p;}}
  if(bd<=1){ doAttack(e,best); }
  else {
    // step toward target
    let steps=2;
    while(steps-->0 && distance(e.x,e.y,best.cx,best.cy)>1){
      const dx=Math.sign(best.cx-e.x), dy=Math.sign(best.cy-e.y);
      let nx=e.x+dx, ny=e.y+dy;
      if(occupied(nx,ny)||nx<0||ny<0||nx>=GRID_W||ny>=GRID_H){
        // try axis-only moves
        if(!occupied(e.x+dx,e.y)&&e.x+dx>=0&&e.x+dx<GRID_W){nx=e.x+dx;ny=e.y;}
        else if(!occupied(e.x,e.y+dy)&&e.y+dy>=0&&e.y+dy<GRID_H){nx=e.x;ny=e.y+dy;}
        else break;
      }
      e.x=nx;e.y=ny; renderAll(); await sleep(160);
    }
    if(distance(e.x,e.y,best.cx,best.cy)<=1) doAttack(e,best);
    else log(e.name+" advances.","");
  }
  renderAll();
}
function winCombat(){
  const c=G.combat;
  const xp=c.enemies.reduce((s,e)=>s+(e.xp||0),0);
  const share=Math.floor(xp/Math.max(1,G.party.filter(p=>p.alive).length));
  log("Victory! The party earns "+xp+" XP ("+share+" each).","good");
  G.party.filter(p=>p.alive).forEach(p=>{ p.xp+=share; checkLevel(p); p.status.defending=false; p.status.shield=false; recalcAC(p); });
  // loot
  const loot=20+rnd(40)+xp/4|0; G.gold+=loot; log("You recover "+loot+" gold from the fallen.","good");
  const fixed=c.opts.fixed;
  G.mode=G.map.kind==="town"?"town":"dungeon";
  G.combat=null;
  if(fixed&&fixed.win==="endgame"){ setTimeout(endgame,400); return; }
  // clearing the slums boss reveals stairs
  if(fixed&&G.map.name===MAPS.slums.name){ G.flags[G.map.name+":cleared"]=true; log("With the warband broken, you sense a passage opening nearby...","sys"); }
  renderAll();
}
function loseCombat(){
  log("Your party has fallen... darkness takes you.","bad");
  G.mode="dead"; G.combat=null;
  renderAll();
}
function checkLevel(pc){
  const nl=levelFor(pc.xp);
  while(pc.lvl<nl){
    pc.lvl++;
    const conB=statMod(pc.stats.CON);
    const gain=Math.max(1,d(1,CLASSES[pc.cls].hd)+conB);
    pc.maxhp+=gain; pc.hp+=gain;
    if(CLASSES[pc.cls].spells){ pc.spellSlots=1+pc.lvl; }
    log("★ "+pc.name+" reaches level "+pc.lvl+"! (+"+gain+" HP)","good");
  }
}

/* ---- combat effects system ---- */
const FX={ floats:[], parts:[], shake:0 };
function fxFloat(gx,gy,text,color){ FX.floats.push({gx,gy,text,color,t:0,life:1.1}); }
function fxBurst(gx,gy,color,n,spd){ for(let i=0;i<(n||14);i++){ const a=Math.random()*7, s=(spd||1)*(0.5+Math.random());
  FX.parts.push({gx,gy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-0.4,color,t:0,life:0.6+Math.random()*0.4,r:2+Math.random()*2}); } }
function fxShake(a){ FX.shake=Math.max(FX.shake,a||6); }
/* ---- isometric projection: grid (gx,gy) → screen (sx,sy) ---- */
function isoGeom(){
  // diamond tile footprint; scales with the current canvas size so combat fills the screen properly.
  const maxByWidth  = (W - 40) / GRID_W;
  const maxByHeight = (H - 100) / (GRID_H + 4) * 1.6;
  const tileW = Math.floor(Math.min(maxByWidth, maxByHeight));
  const tileH = Math.floor(tileW*0.55);
  const boardH = (GRID_W+GRID_H) * (tileH/2);   // total iso-board height in pixels
  const originX = W/2;
  // center vertically when there's headroom; otherwise stick near the top
  const originY = Math.max(50, Math.floor((H - boardH)/2));
  return {tileW,tileH,originX,originY};
}
function isoPos(gx,gy,G2){
  const {tileW,tileH,originX,originY}=G2||isoGeom();
  return [ originX + (gx-gy)*(tileW/2), originY + (gx+gy)*(tileH/2) ];
}
/* inverse: screen → fractional grid cell (for click detection) */
function screenToCell(sx,sy){
  const {tileW,tileH,originX,originY}=isoGeom();
  const dx=sx-originX, dy=sy-originY;
  const gx=(dx/(tileW/2)+dy/(tileH/2))/2;
  const gy=(dy/(tileH/2)-dx/(tileW/2))/2;
  return [Math.round(gx),Math.round(gy)];
}
function vpos(u){ const [gx,gy]=getXY(u); if(u._vx==null){u._vx=gx;u._vy=gy;} return [u._vx,u._vy]; }

/* ---- combat renderer — Diablo-style overhead, drawn on the hi-res canvas ---- */
function setPose(u,pose,dur){ u._pose=pose; u._poseT=0; u._poseDur=dur||0.45; }
function drawIsoTile(g,cx,cy,tileW,tileH,fill,stroke,lw){
  g.beginPath();
  g.moveTo(cx,cy-tileH/2); g.lineTo(cx+tileW/2,cy); g.lineTo(cx,cy+tileH/2); g.lineTo(cx-tileW/2,cy); g.closePath();
  if(fill){ g.fillStyle=fill; g.fill(); }
  if(stroke){ g.strokeStyle=stroke; g.lineWidth=lw||1; g.stroke(); }
}
function drawCombat(now,dt){
  dt=dt||0.016;
  const c=G.combat;
  const GG=isoGeom();
  const {tileW,tileH,originX,originY}=GG;
  const all=[...G.party.filter(p=>p.alive),...(c?c.enemies.filter(e=>e.alive):[])];
  all.forEach(u=>{ const [gx,gy]=getXY(u); if(u._vx==null){u._vx=gx;u._vy=gy;}
    u._vx+=(gx-u._vx)*Math.min(1,dt*12); u._vy+=(gy-u._vy)*Math.min(1,dt*12);
    if(u._idle==null)u._idle=Math.random()*6.28; u._idle+=dt*2.2;
    if(u._pose && u._pose!=="idle" && u._pose!=="dead"){ u._poseT=(u._poseT||0)+dt; if(u._poseT>=u._poseDur) u._pose="idle"; }
    if(u._lunge==null)u._lunge=0; u._lunge*=Math.pow(0.001,dt);
    if(u._flash>0) u._flash-=dt;
  });
  const pulse=0.5+0.5*Math.sin(now/240);
  // const torch1=0.5+0.5*Math.sin(now/320+0.4);   // left-wall torch flicker  — FLICKER DISABLED
  // const torch2=0.5+0.5*Math.sin(now/280+2.1);   // right-wall torch flicker — FLICKER DISABLED
  const torch1=0.75;  // fixed mid-brightness — uncomment lines above to re-enable flicker
  const torch2=0.75;

  // screen shake
  let shx=0,shy=0;
  if(FX.shake>0.2){ shx=(Math.random()*2-1)*FX.shake; shy=(Math.random()*2-1)*FX.shake; FX.shake*=Math.pow(0.0001,dt);} else FX.shake=0;

  // ===== DUNGEON STONE BACKGROUND =================================================
  // Deep stone-black base
  ctx.fillStyle="#09080a"; ctx.fillRect(0,0,W,H);

  // Back wall — large mortared stone blocks filling top ~55% of screen
  const wallH = Math.floor(H*0.54);
  // mortar background
  ctx.fillStyle="#1a1720"; ctx.fillRect(0,0,W,wallH);
  // stone block grid — staggered courses
  const blkW=Math.floor(W/6), blkH=Math.floor(wallH/5);
  for(let row=0;row<6;row++){
    const y0=row*blkH;
    const off=(row%2)*(blkW>>1);
    for(let col=-1;col<8;col++){
      const x0=col*blkW+off;
      const jt=((col*7+row*13)%9)-4;
      const bv=38+jt;
      // block face
      ctx.fillStyle=`rgb(${bv+4},${bv+2},${bv+8})`; ctx.fillRect(x0+2,y0+2,blkW-3,blkH-3);
      // top highlight
      ctx.fillStyle=`rgba(255,230,180,0.07)`; ctx.fillRect(x0+2,y0+2,blkW-3,2);
      // left highlight
      ctx.fillStyle=`rgba(255,220,160,0.05)`; ctx.fillRect(x0+2,y0+2,2,blkH-3);
      // bottom shadow
      ctx.fillStyle="rgba(0,0,0,0.45)"; ctx.fillRect(x0+2,y0+blkH-3,blkW-3,2);
    }
  }
  // mortar line overlay for crisp seams
  ctx.strokeStyle="#111018"; ctx.lineWidth=2;
  for(let row=0;row<=6;row++){ ctx.beginPath(); ctx.moveTo(0,row*blkH); ctx.lineTo(W,row*blkH); ctx.stroke(); }
  for(let row=0;row<6;row++){
    const off=(row%2)*(blkW>>1);
    for(let col=-1;col<9;col++){
      const x0=col*blkW+off;
      ctx.beginPath(); ctx.moveTo(x0,row*blkH); ctx.lineTo(x0,row*blkH+blkH); ctx.stroke();
    }
  }

  // Torch brackets on left and right walls — animated flame
  function drawWallTorch(tx,ty,flicker){
    const fw=flicker, fo=0.6+fw*0.4;
    // iron bracket arm
    ctx.fillStyle="#1e1c22"; ctx.fillRect(tx-10,ty,10,4); ctx.fillRect(tx-4,ty-4,4,8);
    ctx.fillStyle="#3a3640"; ctx.fillRect(tx-10,ty,10,2);
    // torch handle
    ctx.fillStyle="#4a3018"; ctx.fillRect(tx-2,ty+3,5,16);
    ctx.fillStyle="#6a4828"; ctx.fillRect(tx-2,ty+3,2,14);
    // outer glow (additive)
    ctx.save(); ctx.globalCompositeOperation="lighter";
    const gr=ctx.createRadialGradient(tx,ty-8,2,tx,ty-8,38);
    gr.addColorStop(0,`rgba(255,180,60,${0.28*fo})`);
    gr.addColorStop(0.4,`rgba(220,110,20,${0.12*fo})`);
    gr.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(tx,ty-8,38,0,7); ctx.fill();
    ctx.restore();
    // flame body
    ctx.fillStyle=`rgba(255,140,20,${0.85*fo})`; ctx.fillRect(tx-3,ty-14,6,8);
    ctx.fillStyle=`rgba(255,200,60,${0.9*fo})`; ctx.fillRect(tx-2,ty-16,4,6);
    ctx.fillStyle=`rgba(255,240,180,${0.95*fo})`; ctx.fillRect(tx-1,ty-18+Math.round(fw),2,4);
    // spark
    if(fw>0.7){ ctx.fillStyle="rgba(255,255,200,0.9)"; ctx.fillRect(tx+2,ty-20,1,1); }
  }
  // three torches per side wall
  const torchYs=[Math.floor(wallH*0.18), Math.floor(wallH*0.52), Math.floor(wallH*0.82)];
  torchYs.forEach((ty,i)=>{
    drawWallTorch(18,ty, i%2===0?torch1:torch2);
    drawWallTorch(W-18,ty, i%2===0?torch2:torch1);
  });

  // Floor/wall join — dark horizontal band
  ctx.fillStyle="#0c0b10"; ctx.fillRect(0,wallH,W,6);

  // Warm torch-light wash down the back wall (additive)
  ctx.save(); ctx.globalCompositeOperation="lighter";
  const wallLight=ctx.createLinearGradient(0,0,0,wallH);
  wallLight.addColorStop(0,"rgba(0,0,0,0)");
  wallLight.addColorStop(0.5,`rgba(140,80,20,0.07)`);
  wallLight.addColorStop(1,`rgba(200,110,30,0.10)`);
  ctx.fillStyle=wallLight; ctx.fillRect(0,0,W,wallH);
  ctx.restore();

  ctx.save(); ctx.translate(shx,shy);

  // ===== DUNGEON FLOOR TILES =====================================================
  // Torchlight origin — center of the battle field
  const [lightCX,lightCY]=isoPos(GRID_W/2-0.5, GRID_H/2-0.5, GG);
  const lightR = Math.max(tileW,tileH)*Math.max(GRID_W,GRID_H)*0.72;

  for(let gy2=0; gy2<GRID_H; gy2++){
    for(let gx2=0; gx2<GRID_W; gx2++){
      const [cx,cy]=isoPos(gx2,gy2,GG);
      // deterministic hash for per-tile variation
      const h = (gx2*73856093 ^ gy2*19349663) >>> 0;
      const jt = (h%9)-4;    // -4..+4 lightness jitter
      const isMoss = (h%7)===0;
      const isCrack= (h%11)===0;

      // distance-based torchlight falloff (warm orange, matching wall torches)
      const dx=cx-lightCX, dy=cy-lightCY;
      const dist2=dx*dx+dy*dy;
      const litFrac=clamp(1-(dist2/(lightR*lightR)),0,1);
      const warm=litFrac*(0.30+0.08*(torch1+torch2)*0.5);

      // base stone colour — cool dark grey, mossy variant slightly green-brown
      let rv=isMoss?44+jt:46+jt, gv=isMoss?48+jt:44+jt, bv=isMoss?40+jt:50+jt;
      // add torch warmth
      rv=Math.round(clamp(rv+warm*180,0,255));
      gv=Math.round(clamp(gv+warm*80,0,255));
      bv=Math.round(clamp(bv+warm*20,0,255));

      drawIsoTile(ctx,cx,cy,tileW-1,tileH-1, `rgb(${rv},${gv},${bv})`, "rgba(0,0,0,0.55)", 1);

      // top-left highlight (lit upper facet)
      const hi=`rgba(255,220,150,${0.05+warm*0.10})`;
      ctx.strokeStyle=hi; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(cx-tileW/2+2,cy); ctx.lineTo(cx,cy-tileH/2+1); ctx.stroke();

      // crack detail
      if(isCrack){
        ctx.strokeStyle=`rgba(0,0,0,0.50)`; ctx.lineWidth=1;
        const cx2=cx+((gx2*5+gy2*3)%7-3), cy2=cy+((gx2*9+gy2*7)%5-2);
        ctx.beginPath(); ctx.moveTo(cx2-4,cy2); ctx.lineTo(cx2+4,cy2+2); ctx.stroke();
      }
      // moss patch
      if(isMoss){
        ctx.fillStyle=`rgba(50,80,40,${0.30+warm*0.05})`;
        ctx.fillRect(cx-2,cy-1,4,2); ctx.fillRect(cx-1,cy+1,2,1);
      }
    }
  }

  // ===== PROPS: pillars, braziers, bones ========================================
  // Deterministic prop placement — corners get pillars, edges get bones/skulls
  // Four corner pillars (just inside the grid boundary)
  function drawPillar(cx,cy,h){
    const pw=Math.max(8,tileW*0.28), ph=Math.max(14,h||tileH*3);
    // shadow
    ctx.fillStyle="rgba(0,0,0,0.5)";
    ctx.beginPath(); ctx.ellipse(cx,cy+4,pw*0.8,pw*0.28,0,0,7); ctx.fill();
    // shaft — cool stone grey, lit left
    const grd=ctx.createLinearGradient(cx-pw,cy-ph,cx+pw,cy-ph);
    grd.addColorStop(0,"#5a5862"); grd.addColorStop(0.35,"#7a7882"); grd.addColorStop(1,"#2e2c34");
    ctx.fillStyle=grd; ctx.fillRect(cx-pw/2,cy-ph,pw,ph);
    // cap (wide slab)
    ctx.fillStyle="#6a6872"; ctx.fillRect(cx-pw/2-3,cy-ph,pw+6,5);
    ctx.fillStyle="#9a98a2"; ctx.fillRect(cx-pw/2-3,cy-ph,pw+6,2);
    // base
    ctx.fillStyle="#6a6872"; ctx.fillRect(cx-pw/2-3,cy-4,pw+6,5);
    ctx.fillStyle="#3a3840"; ctx.fillRect(cx-pw/2-3,cy,pw+6,2);
  }
  // place pillars at the four inner corners of the grid
  const pillarCells=[[0,0],[GRID_W-1,0],[0,GRID_H-1],[GRID_W-1,GRID_H-1]];
  pillarCells.forEach(([gx2,gy2])=>{
    const [cx,cy]=isoPos(gx2,gy2,GG);
    drawPillar(cx,cy, tileH*3.5);
  });

  // Braziers on mid-left and mid-right columns — flickering bowls of fire
  function drawBrazier(cx,cy,flicker){
    const bh=tileH*1.4, fw=Math.max(6,tileW*0.18);
    // stand legs (crossed iron)
    ctx.strokeStyle="#28262e"; ctx.lineWidth=Math.max(2,fw*0.28);
    ctx.beginPath(); ctx.moveTo(cx-fw,cy); ctx.lineTo(cx,cy-bh); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx+fw,cy); ctx.lineTo(cx,cy-bh); ctx.stroke();
    // bowl
    ctx.fillStyle="#2a2830"; ctx.beginPath();
    ctx.ellipse(cx,cy-bh,fw*1.1,fw*0.45,0,0,Math.PI,false); ctx.fill();
    ctx.fillStyle="#1e1c22"; ctx.beginPath();
    ctx.ellipse(cx,cy-bh,fw*1.1,fw*0.45,0,Math.PI,Math.PI*2,false); ctx.fill();
    // fire glow (additive)
    const fo=0.55+flicker*0.45;
    ctx.save(); ctx.globalCompositeOperation="lighter";
    const fg=ctx.createRadialGradient(cx,cy-bh,1,cx,cy-bh,tileW*0.9);
    fg.addColorStop(0,`rgba(255,180,50,${0.45*fo})`);
    fg.addColorStop(0.5,`rgba(200,80,15,${0.18*fo})`);
    fg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=fg; ctx.beginPath(); ctx.arc(cx,cy-bh,tileW*0.9,0,7); ctx.fill();
    ctx.restore();
    // flame
    ctx.fillStyle=`rgba(255,160,30,${0.8*fo})`; ctx.fillRect(cx-fw*0.5,cy-bh-fw*0.9,fw,fw*0.9);
    ctx.fillStyle=`rgba(255,220,80,${0.9*fo})`; ctx.fillRect(cx-fw*0.3,cy-bh-fw*1.2,fw*0.6,fw*0.6);
    ctx.fillStyle=`rgba(255,250,200,${0.95*fo})`; ctx.fillRect(cx-fw*0.15,cy-bh-fw*1.4+Math.round(flicker),fw*0.3,fw*0.4);
  }
  // two braziers: left and right mid-field
  const [brL_cx,brL_cy]=isoPos(1,Math.floor(GRID_H/2),GG);
  const [brR_cx,brR_cy]=isoPos(GRID_W-2,Math.floor(GRID_H/2),GG);
  drawBrazier(brL_cx,brL_cy,torch1);
  drawBrazier(brR_cx,brR_cy,torch2);

  // Scattered bones / rubble on floor (deterministic, low-opacity)
  ctx.fillStyle="rgba(210,200,175,0.35)";
  for(let i=0;i<14;i++){
    const bx2=((i*5.3+1.2)%GRID_W), by2=((i*3.7+0.9)%GRID_H);
    const [cx,cy]=isoPos(bx2,by2,GG);
    const ox=((i*13)%20)-10, oy2=((i*7)%10)-5;
    // bone shard
    ctx.fillRect(cx+ox,cy+oy2,4,1); ctx.fillRect(cx+ox-1,cy+oy2,1,1); ctx.fillRect(cx+ox+4,cy+oy2,1,1);
  }

  // Ambient field shadow — strongest at edges, lets torch warmth dominate center
  const fld=ctx.createRadialGradient(lightCX,lightCY,tileW*1.5, lightCX,lightCY,lightR*1.1);
  fld.addColorStop(0,"rgba(0,0,0,0)"); fld.addColorStop(1,"rgba(0,0,0,0.55)");
  ctx.fillStyle=fld; ctx.fillRect(0,0,W,H);

  if(!c){ ctx.restore(); return; }
  const sel=c.selecting;

  // ===== MOVE HIGHLIGHT ==========================================================
  if(sel&&sel.mode==="move"){
    const pc=sel.pc, rg=moveRange(pc);
    for(let gy2=0;gy2<GRID_H;gy2++) for(let gx2=0;gx2<GRID_W;gx2++){
      if(distance(pc.cx,pc.cy,gx2,gy2)<=rg && !occupied(gx2,gy2)){
        const [cx,cy]=isoPos(gx2,gy2,GG);
        drawIsoTile(ctx,cx,cy,tileW-2,tileH-2,
          `rgba(70,200,190,${0.14+0.10*pulse})`,
          `rgba(120,240,225,${0.5+0.3*pulse})`,1.5);
      }
    }
  }

  // ===== TARGET HIGHLIGHT ========================================================
  if(sel&&(sel.mode==="attack"||sel.mode==="spelltarget")){
    c.enemies.filter(e=>e.alive).forEach(e=>{
      const [cx,cy]=isoPos(e._vx,e._vy,GG);
      drawIsoTile(ctx,cx,cy,tileW-2,tileH-2,
        `rgba(220,60,50,${0.14+0.12*pulse})`,
        `rgba(255,90,80,${0.6+0.35*pulse})`,2);
    });
  }

  // ===== CURRENT ACTOR SELECTION RING ============================================
  const cu=curUnit();
  if(cu&&cu.ref.alive){
    const [cx,cy]=isoPos(cu.ref._vx,cu.ref._vy,GG);
    const isAlly=cu.ref.side==="ally";
    const colA=isAlly?`rgba(90,220,205,${0.7+0.3*pulse})`:`rgba(255,90,80,${0.7+0.3*pulse})`;
    drawIsoTile(ctx,cx,cy,tileW-3,tileH-3,null,colA,2.5);
  }

  // ===== UNITS — back-to-front painter order =====================================
  const draw=[];
  c.enemies.forEach(e=>{ if(e.alive) draw.push({u:e,enemy:true}); });
  G.party.forEach(p=>{ if(p.alive) draw.push({u:p,enemy:false}); });
  draw.sort((a,b)=>((a.u._vx+a.u._vy)-(b.u._vx+b.u._vy)));

  for(const dd of draw){
    const u=dd.u, enemy=dd.enemy;
    const [cx,cy]=isoPos(u._vx,u._vy,GG);

    // per-unit torch warmth
    const dx2=cx-lightCX, dy2=cy-lightCY;
    const litU=clamp(1-((dx2*dx2+dy2*dy2)/(lightR*lightR)),0,1);

    // ground shadow ellipse
    ctx.fillStyle=`rgba(0,0,0,${0.35+litU*0.12})`;
    ctx.beginPath(); ctx.ellipse(cx,cy,tileW*0.32,tileH*0.36,0,0,7); ctx.fill();

    // lunge offset
    let lx=0,ly=0;
    if((u._lunge||0)>0.02&&u._ldir){
      lx=u._ldir[0]*u._lunge*tileW*0.20;
      ly=u._ldir[1]*u._lunge*tileH*0.20;
    }

    // For enemies with a real image asset: draw directly on ctx using "lighter"
    // blend so the dark painted background disappears into the dungeon floor.
    // For allies / procedural monsters: use the pixel sprite buffer as before.
    const assetImg = enemy ? monsterSprite(u.type||u.name) : null;

    if(assetImg){
      // Draw larger so the character fills the tile nicely (asset is 64x64 square)
      const drawW = tileW * 1.55;
      const drawH = drawW;   // square asset
      const footY = cy - drawH * 0.82;
      const dx = Math.round(cx - drawW/2 + lx);
      const dy = Math.round(footY + ly);

      ctx.save();
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";

      // "lighter" blend: dark pixels in the image (background) add nothing to
      // the already-dark dungeon floor, while the bright monster pixels shine through.
      ctx.globalCompositeOperation = "lighter";
      ctx.globalAlpha = 0.92;
      ctx.drawImage(assetImg, dx, dy, Math.round(drawW), Math.round(drawH));

      // torch warmth tint
      if(litU>0.05){
        ctx.globalAlpha = litU * 0.14;
        ctx.fillStyle = "rgba(220,110,30,1)";
        ctx.fillRect(dx, dy, Math.round(drawW), Math.round(drawH));
      }

      // hit flash
      if((u._flash||0)>0){
        ctx.globalAlpha = u._flash * 2.0;
        ctx.drawImage(assetImg, dx, dy, Math.round(drawW), Math.round(drawH));
      }
      ctx.restore();

      u._scrX=cx; u._scrY=footY;

    } else {
      // Procedural sprite path (allies + fallback monsters)
      const spx=drawUnitSprite(u,enemy);
      const drawW=tileW*1.10, drawH=drawW*(spx.height/spx.width);
      const footY=cy-drawH*0.72;

      ctx.save(); ctx.imageSmoothingEnabled=false;
      ctx.drawImage(spx, Math.round(cx-drawW/2+lx), Math.round(footY+ly), Math.round(drawW), Math.round(drawH));
      if(litU>0.05){
        ctx.save(); ctx.globalCompositeOperation="lighter";
        ctx.globalAlpha=litU*0.18;
        ctx.fillStyle="rgba(220,110,30,1)";
        ctx.fillRect(Math.round(cx-drawW/2+lx), Math.round(footY+ly), Math.round(drawW), Math.round(drawH));
        ctx.restore();
      }
      if((u._flash||0)>0){
        ctx.save(); ctx.globalCompositeOperation="lighter";
        ctx.globalAlpha=u._flash*2.5;
        ctx.drawImage(spx, Math.round(cx-drawW/2+lx), Math.round(footY+ly), Math.round(drawW), Math.round(drawH));
        ctx.restore();
      }
      ctx.restore();

      u._scrX=cx; u._scrY=footY;
    }

    // health bar — parchment-framed, gold border style
    const pct=clamp(u.hp/u.maxhp,0,1);
    const bw=Math.max(30,tileW*0.58), bh=6, bxp=cx-bw/2, byp=u._scrY-10;
    // border
    ctx.fillStyle="#d9a441"; ctx.fillRect(bxp-2,byp-2,bw+4,bh+4);
    ctx.fillStyle="#0a0c0e"; ctx.fillRect(bxp,byp,bw,bh);
    const hpcol=enemy?(pct>0.5?"#c83030":pct>0.25?"#d06820":"#8a1e18")
                     :(pct>0.5?"#2ec4a2":pct>0.25?"#e9c46a":"#e3604f");
    ctx.fillStyle=hpcol; ctx.fillRect(bxp,byp,Math.round(bw*pct),bh);
    ctx.fillStyle="rgba(255,255,255,0.20)"; ctx.fillRect(bxp,byp,Math.round(bw*pct),2);

    // name tag for current actor — parchment style
    if(cu&&cu.ref===u){
      const lbl=u.name;
      ctx.font="600 11px Cinzel, serif"; ctx.textAlign="center";
      const tw=ctx.measureText(lbl).width+12;
      const lx2=cx-tw/2, ly2=byp-18;
      ctx.fillStyle="rgba(15,12,8,0.82)"; ctx.strokeStyle="#d9a441"; ctx.lineWidth=1;
      roundRect(lx2,ly2,tw,14,3); ctx.fill(); ctx.stroke();
      ctx.fillStyle="#f4e2a0"; ctx.shadowColor="#000"; ctx.shadowBlur=3;
      ctx.fillText(lbl,cx,ly2+11); ctx.shadowBlur=0; ctx.textAlign="left";
    }
  }

  // ===== PARTICLES ===============================================================
  ctx.save(); ctx.globalCompositeOperation="lighter";
  for(let i=FX.parts.length-1;i>=0;i--){
    const p=FX.parts[i]; p.t+=dt; p.gx+=p.vx*dt*2.2; p.gy+=p.vy*dt*2.2; p.vy+=dt*1.5;
    if(p.t>=p.life){FX.parts.splice(i,1);continue;}
    const [pcx,pcy]=isoPos(p.gx,p.gy,GG); const a=1-p.t/p.life;
    const pr=Math.max(2,p.r*1.6);
    const pg=ctx.createRadialGradient(pcx,pcy,0,pcx,pcy,pr*2.5);
    pg.addColorStop(0,p.color.replace("ALPHA",(a*0.9).toFixed(2)));
    pg.addColorStop(1,p.color.replace("ALPHA","0"));
    ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(pcx,pcy,pr*2.5,0,7); ctx.fill();
  }
  // hit blooms
  for(const dd of draw){ const u=dd.u; if((u._flash||0)>0){
    const bg=ctx.createRadialGradient(u._scrX,u._scrY,2,u._scrX,u._scrY,tileW*0.8);
    bg.addColorStop(0,"rgba(255,200,140,0.5)"); bg.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=bg; ctx.beginPath(); ctx.arc(u._scrX,u._scrY,tileW*0.8,0,7); ctx.fill();
  }}
  ctx.restore();

  // ===== DUNGEON VIGNETTE — heavy corners, warm centre ==========================
  const vg=ctx.createRadialGradient(W*0.5,H*0.5,H*0.22, W*0.5,H*0.5,H*0.85);
  vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,0.70)");
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  // ===== FLOATING DAMAGE NUMBERS ================================================
  for(let i=FX.floats.length-1;i>=0;i--){ const f=FX.floats[i]; f.t+=dt;
    if(f.t>=f.life){FX.floats.splice(i,1);continue;}
    const [fcx,fcy]=isoPos(f.gx,f.gy,GG); const fY=fcy-tileH-f.t*48; const fa=clamp(1-f.t/f.life,0,1);
    ctx.font="bold 20px Cinzel, serif"; ctx.textAlign="center"; ctx.globalAlpha=fa;

/* render a unit's pixel sprite to a 32×48 offscreen canvas (scaled up cleanly) */
const _spriteBuf=document.createElement("canvas"); _spriteBuf.width=32; _spriteBuf.height=48;
const _sbx=_spriteBuf.getContext("2d");
function drawUnitSprite(u,enemy){
  _sbx.clearRect(0,0,32,48); _sbx.imageSmoothingEnabled=false;
  const fc = enemy ? -1 : 1;
  const pose = u._pose||"idle";
  const phase = pose==="idle" ? (u._idle/Math.PI/2)%1 : clamp((u._poseT||0)/(u._poseDur||0.45),0,1);
  const flash=(u._flash||0)>0;
  if(enemy){
    const sprite=monsterSprite(u.type||u.name);
    if(sprite){
      const sw=_spriteBuf.width, sh=_spriteBuf.height;
      if(fc<0){ _sbx.save(); _sbx.translate(sw,0); _sbx.scale(-1,1); _sbx.drawImage(sprite,0,0,sw,sh); _sbx.restore(); }
      else _sbx.drawImage(sprite,0,0,sw,sh);
      if(flash){ _sbx.save(); _sbx.globalCompositeOperation="lighter"; _sbx.globalAlpha=0.55; _sbx.fillStyle="#fff"; _sbx.fillRect(0,0,sw,sh); _sbx.restore(); }
    } else {
      drawMonster(_sbx,4,6,u.type||u.name,PAL_MON[u.type||u.name]||PAL_MON.Goblin,fc,pose,phase,flash);
    }
  } else {
    drawHumanoid(_sbx,4,4,PAL_PC[u.cls]||PAL_PC.Fighter,fc,pose,phase,flash);
  }
  return _spriteBuf;
}
function roundRect(x,y,w,h,r){ ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath(); }
function pcColor(p){ const m={Fighter:"#c0654a",Cleric:"#e9c46a",Mage:"#7a8cff",Thief:"#6fcf8f"}; return m[p.cls]||"#5fd0c4"; }

/* humanoid adventurer — drawn into a 32×48 sprite buffer */
function drawHumanoid(g,px,py,pal,fc,pose,phase,flash){
  const bob = Math.round(Math.sin(phase*Math.PI*2)*1.5);
  let armSwing=0, lean=0, weaponEx=0, castRaise=0, recoil=0;
  if(pose==="attack"){ const p=Math.sin(phase*Math.PI); armSwing=Math.round(p*6); lean=Math.round(p*3); weaponEx=Math.round(p*5); }
  if(pose==="cast"){ castRaise=Math.round(Math.sin(phase*Math.PI)*5); }
  if(pose==="hurt"){ recoil=Math.round(Math.sin(phase*Math.PI*3)*-3); lean=-2; }
  const F = flash ? "#ffffff" : null;
  const X=px+(lean+recoil)*fc, Y=py+(pose==="idle"?bob:0);
  const sk = F||SKIN, skHi = F||(pal.skinHi||SKIN);
  // ── feet / boots ──
  P(g,X+6,Y+28,4,3,F||pal.cloth2); P(g,X+14,Y+28,4,3,F||pal.cloth2);
  P(g,X+5,Y+30,5,2,F||"#1a1410");  P(g,X+13,Y+30,5,2,F||"#1a1410"); // boot sole
  // ── legs ──
  P(g,X+6,Y+20,4,9,F||pal.cloth2); P(g,X+14,Y+20,4,9,F||pal.cloth2);
  P(g,X+6,Y+20,2,9,F||pal.cloth);  P(g,X+14,Y+20,2,9,F||pal.cloth); // lit edge
  P(g,X+9,Y+23,1,6,F||pal.cloth2); P(g,X+17,Y+23,1,6,F||pal.cloth2);// inner seam
  // ── belt ──
  P(g,X+5,Y+19,14,2,F||pal.cloth2);
  P(g,X+11,Y+18,4,3,F||pal.accent); // buckle
  // ── torso ──
  P(g,X+4,Y+10,16,10,F||pal.cloth);
  P(g,X+4,Y+10,16,2, F||pal.metal);       // shoulder plate
  P(g,X+4,Y+11,2,8,  F||pal.clothHi||pal.cloth); // lit left edge
  P(g,X+18,Y+11,2,8, F||pal.cloth2);     // shadow right edge
  P(g,X+10,Y+11,4,6, F||pal.accent);     // tabard/crest centre
  P(g,X+5,Y+18,12,2, F||pal.cloth2);     // waist shadow
  P(g,X+4,Y+10,4,2,  F||pal.metalHi||pal.metal); // shoulder highlight
  // ── head ──
  P(g,X+7,Y+2,10,9,sk);
  P(g,X+7,Y+3,2,7,skHi);              // lit left face
  P(g,X+15,Y+3,2,7,F||"#8a6040");     // shadow right face
  P(g,X+7,Y+2,10,2,F||pal.hair);      // hairline
  P(g,X+7,Y+2,2,7,  F||pal.hair);     // left hair
  P(g,X+15,Y+2,2,7, F||pal.hair);     // right hair
  P(g,X+7,Y+2,10,1, F||pal.hairHi||pal.hair); // top highlight
  // eyes
  if(pose!=="dead"){
    const ex=X+(fc>0?14:9); P(g,ex,Y+6,2,2,F||"#e8eef6"); P(g,ex,Y+6,1,1,F||"#1a2030"); // white+pupil
  }
  // nose+mouth
  P(g,X+11,Y+8,2,3,F||"#c07050"); P(g,X+9,Y+10,6,1,F||"#7a3c28");
  // ── weapon arm (front) ──
  const ax=X+(fc>0?18:2), ay=Y+11;
  if(pal.kind==="mage"||pose==="cast"){
    P(g,ax,ay-castRaise,3,7,sk); P(g,ax,ay-castRaise,1,7,skHi);
    const sx=ax+(fc>0?2:-1);
    P(g,sx,ay-4-castRaise,2,12,F||pal.metal);
    P(g,sx,ay-4-castRaise,1,6, F||pal.metalHi||pal.metal);
    P(g,sx,ay-5-castRaise,2,2, F||pal.accent); // orb
    P(g,sx,ay-5-castRaise,1,1, F||"#ffffff");  // orb glint
  } else {
    P(g,ax,ay,3,7+armSwing,sk); P(g,ax,ay,1,7+armSwing,skHi);
    const wx=ax+(fc>0?2:-1);
    P(g,wx,ay-3-weaponEx,2,10+weaponEx,F||pal.metal);
    P(g,wx,ay-3-weaponEx,1,5,           F||pal.metalHi||pal.metal);
    P(g,wx,ay-5-weaponEx,2,3,           F||pal.accent); // crossguard
    P(g,wx,ay-5-weaponEx,2,1,           F||"#ffffff");  // crossguard shine
    P(g,wx,ay+6,3,2,                    F||pal.cloth2); // hand
  }
  // ── back arm ──
  const bax=X+(fc>0?3:18);
  P(g,bax,ay,3,7,sk); P(g,bax,ay,1,5,skHi);
}

/* monster figure; shapes differ by type */
function drawMonster(g,px,py,name,pal,fc,pose,phase,flash){
  const bob=Math.round(Math.sin(phase*Math.PI*2)*1.5);
  let lean=0,arm=0;
  if(pose==="attack"){ const p=Math.sin(phase*Math.PI); lean=Math.round(p*5); arm=Math.round(p*5);}

    const skHis=F||(pal.skinHi||pal.skin);

    P(g,X+9,Y+7,1,1,F||pal.eyeHi||pal.eye); P(g,X+13,Y+7,1,1,F||pal.eyeHi||pal.eye);

    // legs (4 per side)
    for(let i=0;i<4;i++){
      const ly=Y+12+i*3, lext=i*2;
      P(g,X+1,ly,5+lext,2,F||pal.cloth2); P(g,X+1,ly,5+lext,1,F||pal.clothHi||pal.cloth);
      P(g,X+19-lext,ly,5+lext,2,F||pal.cloth2); P(g,X+19-lext,ly,5+lext,1,F||pal.clothHi||pal.cloth);

    P(g,X+3,Y+10,3,14,skHio);   // lit left
    P(g,X+18,Y+10,3,14,F||"#6a5030"); // shadow right
    // massive head
    P(g,X+5,Y+1,14,9,sk);
    P(g,X+5,Y+2,3,7,skHio);
    P(g,X+16,Y+2,3,7,F||"#6a5030");
    P(g,X+5,Y+1,14,3,F||pal.cloth2); // forehead furrowed
    P(g,X+(fc>0?16:7),Y+5,2,2,F||pal.eye); P(g,X+(fc>0?16:7),Y+5,1,1,F||pal.eyeHi||pal.eye);
    // tusks
    P(g,X+9,Y+9,2,3,F||"#e8e0c0"); P(g,X+13,Y+9,2,3,F||"#e8e0c0");
    // club arm
    const ocx=X+(fc>0?20:0); P(g,ocx,Y+4-arm,3,12,F||pal.cloth2); P(g,ocx,Y+4-arm,1,12,F||pal.clothHi||pal.cloth);
    // club head
    P(g,ocx-1,Y+2-arm,5,4,F||pal.cloth2); P(g,ocx-1,Y+2-arm,5,1,F||pal.clothHi||pal.cloth);
    // legs
    P(g,X+4,Y+23,6,9,sk); P(g,X+13,Y+23,6,9,sk);
    P(g,X+4,Y+23,2,9,skHio); P(g,X+13,Y+23,2,9,skHio);
    return;

  // default humanoid monster — 32×48 canvas, bigger & clearer
  const skHi2 = flash?"#ffffff":(pal.skinHi || pal.skin || pal.cloth);

  // feet
  P(g,X+6,Y+28,4,3,F||pal.cloth2); P(g,X+14,Y+28,4,3,F||pal.cloth2);
  P(g,X+5,Y+30,5,2,F||"#0e0c10"); P(g,X+13,Y+30,5,2,F||"#0e0c10");
  // legs
  P(g,X+6,Y+20,4,9,F||pal.cloth2); P(g,X+14,Y+20,4,9,F||pal.cloth2);
  P(g,X+6,Y+20,2,9,F||pal.cloth);  P(g,X+14,Y+20,2,9,F||pal.cloth);
  // torso
  P(g,X+4,Y+10,16,11,F||pal.cloth);
  P(g,X+4,Y+10,2,11, F||pal.clothHi||pal.cloth);
  P(g,X+18,Y+11,2,9, F||pal.cloth2);
  P(g,X+5,Y+19,12,2, F||pal.cloth2);
  // head

  P(g,X+(fc>0?14:9),Y+6,2,2,F||pal.eye);

    P(g,ax+(fc>0?2:-1),Y+5-arm,2,11,F||"#e8eae2");
    P(g,ax+(fc>0?2:-1),Y+5-arm,1,5, F||"#ffffff");

    P(g,ax+(fc>0?2:-1),Y+5-arm,2,10,F||pal.cloth2);
    P(g,ax+(fc>0?2:-1),Y+4-arm,2,2, F||pal.eye);
  }
  // back arm
  P(g,X+(fc>0?3:18),Y+11,3,7,sk);
}

const PORTRAITS={};
function buildPortraits(){

function makePortrait(cls){
  const S=32, c=document.createElement("canvas"); c.width=S;c.height=S;
  const g=c.getContext("2d"); const P2=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h);};
  const pal=PAL_PC[cls];
  // skin tones
  const SK="#d8a878", SKsh="#b07d4f", SKlo="#8c5e36", SKhi="#ecc69a";
  // background: dark niche with subtle vignette
  P2(0,0,S,S,"#161a24"); P2(0,0,S,3,"#11141d"); P2(0,S-3,S,3,"#11141d");
  // shoulders / cloak
  P2(4,26,24,6,pal.cloth2); P2(4,26,24,2,pal.cloth);
  P2(6,24,20,3,pal.cloth);
  // neck
  P2(13,21,6,4,SKsh); P2(13,21,6,1,SKlo);
  // head base (rounded): face block with trimmed corners
  P2(9,7,14,15,SK); P2(9,7,2,2,"#161a24"); P2(21,7,2,2,"#161a24");
  P2(9,20,2,2,"#161a24"); P2(21,20,2,2,"#161a24");
  // face shading: left lit, right shadow
  P2(9,7,2,14,SKhi); P2(21,8,2,13,SKsh); P2(11,19,10,2,SKsh);
  // cheeks/jaw definition
  P2(10,17,3,3,SKhi); P2(19,17,3,3,SKsh);
  // ears
  P2(8,13,2,3,SKsh); P2(22,13,2,3,SKsh);
  // eyes (whites, iris, brow)
  P2(11,12,4,3,"#e8eef5"); P2(17,12,4,3,"#e8eef5");
  P2(12,12,2,2,"#3a4a5a"); P2(18,12,2,2,"#3a4a5a"); // iris
  P2(12,12,1,1,"#0b0e14"); P2(18,12,1,1,"#0b0e14"); // pupil glint
  P2(11,11,4,1,SKlo); P2(17,11,4,1,SKlo);            // brow line
  // nose + mouth
  P2(15,14,2,3,SKsh); P2(15,16,2,1,SKlo); P2(13,18,6,1,SKlo);
  // ---- class-specific hair / helm / beard ----
  if(cls==="Fighter"){
    // open steel helm with nose guard
    P2(8,5,16,5,pal.metal); P2(8,5,16,1,"#e8edf6"); P2(8,5,2,9,pal.metal); P2(22,5,2,9,pal.metal);
    P2(15,8,2,8,pal.metal); P2(15,8,2,1,"#e8edf6"); // nose guard
    P2(9,9,14,1,"#5a6276"); // helm rim shadow
  } else if(cls==="Cleric"){
    // coif + grey beard
    P2(8,5,16,5,pal.metal); P2(8,5,16,1,"#eef0e0"); P2(8,5,2,12,pal.metal); P2(22,5,2,12,pal.metal);
    P2(11,18,10,5,"#cfd2c4"); P2(11,18,10,1,"#e8eada"); P2(13,21,6,2,"#aab09a"); // beard
  } else if(cls==="Mage"){
    // pointed hood
    P2(13,1,6,3,pal.cloth); P2(10,3,12,4,pal.cloth); P2(8,6,16,4,pal.cloth);
    P2(8,6,2,14,pal.cloth2); P2(22,6,2,14,pal.cloth2); // hood sides framing face
    P2(8,6,16,1,pal.cloth); P2(13,1,6,1,pal.accent);
    P2(10,18,12,4,pal.cloth2); // wispy beard shadow in hood
  } else { // Thief — dark hair + hood back
    P2(8,4,16,5,pal.hair); P2(8,4,16,1,"#3a2e22"); P2(8,4,2,10,pal.hair); P2(22,4,2,10,pal.hair);
    P2(10,9,12,1,"#1c160f");
  }
  return c;
}

let _padBuilt=false;
function buildArrowPad(){
  if(_padBuilt)return; _padBuilt=true;
  const pad=$("#arrowpad"); if(!pad)return;
  // layout matches EotB: top row = turn-left, forward, turn-right; bottom = strafe-left, back, strafe-right
  const defs=[
    ["↰",()=>turn(true)], ["↑",()=>tryMove(true)], ["↱",()=>turn(false)],
    ["←",()=>strafe(true)], ["↓",()=>tryMove(false)], ["→",()=>strafe(false)],
  ];
  defs.forEach(([ch,fn])=>{ const b=document.createElement("div"); b.className="apad"; b.textContent=ch; b.onclick=fn; pad.appendChild(b); });
}
function mkBtn(label,key,fn,opts){
  opts=opts||{};
  const b=document.createElement("button");
  b.className="btn"+(opts.danger?" danger":"");
  b.innerHTML=key?label.replace(key,`<span class="key">${key}</span>`):label;
  b.onclick=fn; if(opts.disabled)b.disabled=true;
  return b;
}
function renderCmd(){
  const bar=$("#cmdbar");bar.innerHTML="";
  const deckEl=document.querySelector(".deck");
  // show the movement deck while exploring, the action bar while in combat
  if(deckEl) deckEl.style.display=(G.mode==="combat"||G.mode==="dead")?"none":"flex";
  bar.style.display=(G.mode==="combat")?"flex":"none";
  if(G.mode==="dead"){
    bar.style.display="flex";
    bar.appendChild(mkBtn("RESTART","R",()=>location.reload()));
    return;
  }
  if(G.mode==="combat"){
    const c=G.combat, u=curUnit();
    if(u&&u.side==="ally"&&c.selecting&&c.selecting.mode==="menu"){
      bar.appendChild(mkBtn("MOVE","M",pcMove));
      bar.appendChild(mkBtn("ATTACK","A",pcAttack));
      if(u.ref.spellsKnown.length) bar.appendChild(mkBtn("CAST","C",pcCast,{disabled:u.ref.spellsUsed>=u.ref.spellSlots}));
      bar.appendChild(mkBtn("DEFEND","D",pcDefend));
      bar.appendChild(mkBtn("END TURN","E",()=>nextTurn()));
    } else if(c.selecting&&c.selecting.mode==="spellpick"){
      c.selecting.pc.spellsKnown.forEach(sn=>{
        bar.appendChild(mkBtn(sn,null,()=>chooseSpell(sn)));
      });
      bar.appendChild(mkBtn("BACK",null,()=>{c.selecting={mode:"menu",pc:c.selecting.pc};renderAll();}));
    } else if(c.selecting&&(c.selecting.mode==="move"||c.selecting.mode==="attack"||c.selecting.mode==="spelltarget")){
      const legend=document.createElement("span");legend.className="legend";
      legend.textContent="Click a square on the battle map. ";
      bar.appendChild(legend);
      bar.appendChild(mkBtn("CANCEL",null,()=>{c.selecting={mode:"menu",pc:c.selecting.pc};renderAll();}));
    } else {
      const s=document.createElement("span");s.className="legend";s.textContent="Enemy turn...";bar.appendChild(s);
    }
    return;
  }
  // exploration: arrow pad handles movement; deck holds persistent actions (2x2 grid)
  buildArrowPad();
  const deck=$("#deckbtns");
  if(deck){
    deck.innerHTML="";
    const mk=(label,fn,disabled)=>{ const b=document.createElement("div"); b.className="deckbtn"+(disabled?" off":""); b.textContent=label; if(!disabled)b.onclick=fn; deck.appendChild(b); };
    mk("USE ITEM", townAction, G.mode!=="town");  // only usable at town features
    mk("CAMP",     openCamp,   false);
    mk("INVENTORY",()=>showSheet(0), false);
    // when embedded in a host page, the 4th slot is EXIT (back to host); otherwise ART (asset panel)
    if(window.parent && window.parent!==window){
      mk("EXIT", ()=>{
        if(!confirm("Return to the world above? Your current run will end.")) return;
        try{ window.parent.postMessage({type:"SERRATIS_EXIT"}, "*"); }catch(e){}
      }, false);
    } else {
      mk("ART", openAssetPanel, false);
    }
  }
  // keep cmdbar empty in exploration (kept for combat)
}

/* roll a stat set with a floor (no value at or below `floor`) */
function rollStatsFloor(floor){
  let s, tries=0;
  do{ s=rollStats(); tries++; }
  while(tries<400 && Object.values(s).some(v=>v<=floor));
  // guarantee: bump any stragglers up to floor+1 if the loop gave up
  for(const k in s) if(s[k]<=floor) s[k]=floor+1+rnd(3);
  return s;
}
/* pre-rolled balanced party; floor of 10 → all stats 11+ (after racial mods kept ≥11 too) */
window.quickParty=function(){
  const recipe=[
    {name:"Gareth", race:"Human",    cls:"Fighter"},
    {name:"Sister Lyra", race:"Dwarf", cls:"Cleric"},
    {name:"Vex", race:"Elf",         cls:"Mage"},
    {name:"Quill", race:"Halfling",  cls:"Thief"},
  ];
  CREATE.roster = recipe.map(r=>{
    // roll until racial-modified stats are ALL >= 11
    let stats, ok=false, guard=0;
    while(!ok && guard++<500){
      stats=rollStatsFloor(10);
      const mod={...stats}; const rm=RACES[r.race].mod;
      for(const k in rm) mod[k]=clamp(mod[k]+rm[k],3,18);
      ok=Object.values(mod).every(v=>v>=11);
    }
    // final safety net: floor the modified result
    const rm=RACES[r.race].mod;
    for(const k in rm){ /* pre-adjust base so post-mod stays >=11 */
      const post=clamp(stats[k]+(rm[k]||0),3,18);
      if(post<11) stats[k]=clamp(11-(rm[k]||0),3,18);
    }
    for(const k in stats){ const post=clamp(stats[k]+(rm[k]||0),3,18); if(post<11) stats[k]=clamp(stats[k]+ (11-post),3,18); }
    return makeCharacter(r.name,r.race,r.cls,stats);
  });
  G.party=CREATE.roster; G.activePC=0;
  closeOverlay();
  beginAdventure();
};

/* ---- continuous mouse-look in dungeon/town ----
   We only TRACK the cursor here. The render loop reads MOUSE.x every frame and
   computes the turn speed, so holding the pointer to one side keeps turning
   smoothly (mousemove alone would stop firing and snap the view back). */
const MOUSE={ x:0, over:false, edgeSpin:0 };
let downX=0, downMoved=0;
function overlayOpen(){ const o=$("#overlay"); return o && o.classList.contains("show"); }
function spinForX(clientX){
  const rect=cv.getBoundingClientRect();
  const nx=clamp(((clientX-rect.left)/rect.width - 0.5)*2, -1, 1); // -1..1
  const dead=0.32;   // wide central no-turn zone; only turn when cursor is well off-center
  let v=0;
  if(nx>dead) v=(nx-dead)/(1-dead);
  else if(nx<-dead) v=(nx+dead)/(1-dead);
  // quadratic ease: gentle near center, up to ~2.6 rad/s at the edges
  return Math.sign(v)*v*v*2.6;
}
cv.addEventListener("mousemove",e=>{

  MOUSE.x=e.clientX; MOUSE.over=true; MOUSE.edgeSpin=0;
  if(downMoved!=null){ downMoved+=Math.abs(e.clientX-downX); downX=e.clientX; }
});
cv.addEventListener("mouseenter",e=>{ MOUSE.x=e.clientX; MOUSE.over=true; MOUSE.edgeSpin=0; });

  const s=spinForX(e.clientX);

/* ============================================================
   TOUCH INPUT — tap zones for phone/tablet
   ------------------------------------------------------------
   • Top half (between edge bands)    → forward (tap = one step; long-hold = walk)
   • Bottom half (between edge bands) → back (tap = one step)
   • Left  edge band (~22% of width)  → turn left
   • Right edge band (~22% of width)  → turn right
   In combat, taps fall through to the existing click handler (cell selection).
   ============================================================ */
const TOUCH = { activeId:null, zone:null, startT:0, startX:0, startY:0, backTimer:null };
const LONGPRESS_MS = 220;       // hold to enter continuous-walk mode
const EDGE_FRAC    = 0.22;      // left/right edge band as fraction of canvas width
function touchZone(clientX, clientY){
  const rect = cv.getBoundingClientRect();
  const nx = (clientX - rect.left) / rect.width;   // 0..1
  const ny = (clientY - rect.top ) / rect.height;  // 0..1
  if(nx < EDGE_FRAC)        return "left";
  if(nx > 1 - EDGE_FRAC)    return "right";
  if(ny < 0.5)              return "forward";
  return "back";
}
cv.addEventListener("touchstart", e=>{
  if(overlayOpen()) return;
  if(G.mode==="combat") return;             // combat uses tap-to-select via the click handler
  if(G.mode!=="dungeon" && G.mode!=="town") return;
  if(TOUCH.activeId!==null) return;          // already tracking a finger
  const t = e.changedTouches[0]; if(!t) return;
  e.preventDefault();
  TOUCH.activeId = t.identifier;
  TOUCH.startT   = performance.now();
  TOUCH.startX   = t.clientX;
  TOUCH.startY   = t.clientY;
  TOUCH.zone     = touchZone(t.clientX, t.clientY);

  // Immediate action on touch-down (so it feels responsive)
  if(TOUCH.zone === "left")       turn(true);
  else if(TOUCH.zone === "right") turn(false);
  else if(TOUCH.zone === "forward") forwardDown();   // hold-to-walk engages naturally
  else if(TOUCH.zone === "back")    {
    tryMove(false);
    // also repeat back-steps if held (forwardDown only handles forward)
    TOUCH.backTimer = setInterval(()=>{
      if(performance.now()-TOUCH.startT > LONGPRESS_MS) tryMove(false);
    }, 300);
  }
},{passive:false});
function endTouch(){
  if(TOUCH.activeId===null) return;
  TOUCH.activeId=null;
  if(TOUCH.zone==="forward") forwardUp();   // stop continuous walk
  if(TOUCH.backTimer){ clearInterval(TOUCH.backTimer); TOUCH.backTimer=null; }
  TOUCH.zone=null;
}
cv.addEventListener("touchend",    e=>{ for(const t of e.changedTouches){ if(t.identifier===TOUCH.activeId){ endTouch(); break; } } },{passive:false});

/* ===== INJECTED: Stairs-down doorways (uses the uploaded archway art) =====
   A stairs-down tile renders the descending-stair archway as its WALL FACE
   (just like a door) and, when walked into, transitions to another map exactly
   like a doorway/exit.

   AUTHORING -- to put stairs down in any room:
     1) place a '>' glyph on a floor tile (ideally against a wall) in the grid, and
     2) say where it leads, either per-tile:
            down:{ "x,y":"destMapKey" }
        or one destination for all of the map's '>' tiles:
            downTo:"destMapKey"
     '>' stairs are open immediately (doorway-style). Add  downGated:true  to a
     map to require its floor be cleared first.

   The original hidden stairs (downTo + downAt, revealed after the floor's boss
   is beaten) keep that behaviour but now render this same art.               */
const STAIRS_DOWN_TEX = "assets/STAIRS_DOWN_TEX.png";
function loadStairsDown(){

      x.drawImage(img,0,0,SZ,SZ);

    };

  }catch(e){}
}

/* up-stair archway art (ascending spiral) — used on U tiles */
const STAIRS_UP_TEX = "assets/STAIRS_UP_TEX.jpeg";
function loadStairsUp(){

/* Destination map key if (x,y) on `map` is an OPEN down-stair, else null. */
function stairsDestAt(map,x,y){
  if(!map) return null;
  const key = x+","+y;
  const t = (typeof tileAt==="function") ? tileAt(map,x,y) : null;
  // 1) explicit per-tile table -> doorway style (open immediately)
  if(map.down && map.down[key]){
    if(map.downGated && !(G.flags && G.flags[map.name+":cleared"])) return null;
    return map.down[key];
  }
  // 2) '>' glyph -> open immediately unless the map opts into gating
  if(t === ">"){
    if(map.downGated && !(G.flags && G.flags[map.name+":cleared"])) return null;
    return map.downTo || null;
  }
  // 3) legacy hidden stair -> downAt + downTo, revealed once the floor is cleared
  if(map.downTo && map.downAt === key){

/* ===== High-res serpent texture pack (1024x1024 PNG, lossless) =====

   hall  = pillared wall (used along corridors)

   snake = relief snake wall  /  alcove = cobra-torch niche  (rare accents) */
const WALLPACK = {
  door:"assets/door.png",
  wall:"assets/wall.png",
  hall:"assets/hall.png",
  snake:"assets/snake.png",
  alcove:"assets/alcove.png"

function _texFromURI(uri, key){

function loadWallPack(){

/* A corridor floor tile is a narrow straight passage: solid on two opposite
   sides and open on the other two. Walls fronting one get the pillared art. */
function isCorridorFloor(map,x,y){
  if(typeof isWall!=="function" || isWall(map,x,y)) return false;
  const N=isWall(map,x,y-1),S=isWall(map,x,y+1),E=isWall(map,x+1,y),W=isWall(map,x-1,y);
  return (N&&S&&!E&&!W)||(E&&W&&!N&&!S);

/* Load the stair art right after the procedural textures are (re)built. */
if(typeof buildTextures === "function"){
  const _buildTextures_preStairs = buildTextures;
  buildTextures = function(){ _buildTextures_preStairs.apply(this,arguments); loadStairsDown(); loadStairsUp(); loadWallPack(); loadGreatHallDoor(); };
}
/* The "kind" of a map's forward / back passage: "up", "down" or "door". */
function passageKind(map, which){
  if(!map) return "down";
  if(which==="fwd")  return map.fwdKind  || (map.fwdUp  ? "up" : "down");
  return                  map.backKind || (map.backUp ? "up" : "down");
}
/* ---- Robust junction texturing -----------------------------------------
   A return ("U") passage must MIRROR the forward passage of the map it leads
   back to, so a junction can never read as a door from one side and a
   staircase from the other.  door<->door, down<->up.  This derives the kind
   from the destination map instead of trusting each map's own back-flags,
   which are easy to forget to keep in sync. */
function _mapKeyOf(m){
  if(!m) return null;
  for(const k in MAPS){ if(MAPS[k]===m) return k; }
  for(const k in MAPS){ if(MAPS[k] && MAPS[k].name===m.name) return k; }
  return null;
}
function _mirrorKind(k){ return k==="up" ? "down" : k==="down" ? "up" : "door"; }
/* The kind ("up"/"down"/"door") of src's FORWARD passage that leads to dstKey,
   or null if src does not reach dstKey by a forward passage. */
function forwardKindTo(src, dstKey){
  if(!src || !dstKey) return null;
  // deeper stair (downTo / downAt) or open '>' / per-tile down table -> a forward passage
  let isFwd = (src.downTo===dstKey);
  if(!isFwd && src.down){ for(const tk in src.down){ if(src.down[tk]===dstKey){ isFwd=true; break; } } }
  if(isFwd) return src.fwdKind || (src.fwdUp ? "up" : "down");
  // a 'D' door tile exit that points at dstKey -> a door
  if(src.exits){
    for(const tk in src.exits){
      if(src.exits[tk]===dstKey){
        const p=tk.split(","), ch=(typeof tileAt==="function") ? tileAt(src,+p[0],+p[1]) : null;
        if(ch==="D") return "door";

}
/* Texture-kind for a return ("U") tile at `key` on `map`: mirror the forward

const _retKindCache = Object.create(null);
function returnPassageKind(map, key){
  const mk=_mapKeyOf(map);
  const ck=mk+"|"+key;
  if(ck in _retKindCache) return _retKindCache[ck];
  let kind=null;
  const dstKey = map && map.exits && map.exits[key];
  if(dstKey && MAPS[dstKey]){
    const fk = forwardKindTo(MAPS[dstKey], mk);
    if(fk) kind = _mirrorKind(fk);
  }
  if(!kind) kind = map.backKind || (map.backUp ? "up" : "down");
  _retKindCache[ck]=kind;

}
/* ---- Great Hall grand doors --------------------------------------------
   Load the uploaded serpent-door art as its own texture and use it for the

function loadGreatHallDoor(){
  if(typeof DOOR_OVERLAY_IMG==="undefined" || !DOOR_OVERLAY_IMG) return;

  // the stone/scales around the door are the real wall (and always match the
  // neighbouring tiles). Inner face (inside the Great Hall) uses the town wall;
  // the fields-side face uses the base wall.
  if(typeof WALL_TEX_SCALES_TOWN!=="undefined")
    buildDoorComposite(WALL_TEX_SCALES_TOWN, DOOR_OVERLAY_IMG, "greatHallDoorInner");
  if(typeof WALL_TEX_SCALES_BASE!=="undefined")
    buildDoorComposite(WALL_TEX_SCALES_BASE, DOOR_OVERLAY_IMG, "greatHallDoor");
  // The fountain shrine on the far (north) dead-end wall of the Fields.
  if(typeof FIELDS_SHRINE_IMG!=="undefined" && FIELDS_SHRINE_IMG && typeof _texFromURI==="function")
    _texFromURI(FIELDS_SHRINE_IMG, "fieldsShrine");
}
function buildDoorComposite(wallURI, doorURI, key){
  if(!wallURI || !doorURI) return;
  const SZ=1024;
  const mkCanvas=()=> (typeof px==="function") ? px(SZ,SZ)
        : (function(){ const cc=document.createElement("canvas"); cc.width=SZ; cc.height=SZ; return cc; })();
  const wimg=new Image();
  wimg.onload=function(){
    const c=mkCanvas(); const x=c.getContext("2d");
    x.imageSmoothingEnabled=true; x.imageSmoothingQuality="high";
    x.clearRect(0,0,SZ,SZ);
    x.drawImage(wimg,0,0,SZ,SZ);     // one instance of the standard wall, same as neighbour tiles
    const dimg=new Image();
    dimg.onload=function(){ x.drawImage(dimg,0,0,SZ,SZ); TEX[key]=c; }; // door overlaid on top
    dimg.onerror=function(){ TEX[key]=c; };
    dimg.src=doorURI;
  };
  wimg.src=wallURI;
}
function greatHallDoorTex(map,x,y){
  if(!map || !map.exits) return null;
  const dst = map.exits[x+","+y];
  if(!dst) return null;
  if(map.name===MAPS.town.name && dst==="fields")
    return (TEX.greatHallDoorInner || TEX.greatHallDoor || null); // inside-the-hall view
  if(dst==="town")
    return (TEX.greatHallDoor || null);                           // fields-side view
  return null;
}
/* ===== END Stairs-down doorways ===== */

/* ===== INJECTED: Save / Load system (localStorage) ===== */
(function(){
  const SAVE_KEY = "serratis_save_v1";
  const VERSION  = 1;

  function lsAvailable(){
    try{ const k="__serratis_test__"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }
    catch(e){ return false; }
  }
  function mapKeyOf(mapObj){
    if(!mapObj) return null;
    for(const k in MAPS){ if(MAPS[k]===mapObj) return k; }       // by reference
    for(const k in MAPS){ if(MAPS[k] && MAPS[k].name===mapObj.name) return k; } // by name fallback
    return null;
  }
  function snapshot(){
    return {
      v: VERSION,
      ts: Date.now(),
      mapKey: mapKeyOf(G.map),
      px: G.px, py: G.py, dir: G.dir,
      mode: G.mode,
      gold: G.gold,
      activePC: G.activePC,
      party: G.party,
      visited: G.visited || {},
      flags: G.flags || {},
      defeatedFixed: G.defeatedFixed || {},
      log: (G.log || []).slice(-80),
    };
  }
  function summarise(s){
    try{
      const names=(s.party||[]).map(p=>p.name).join(", ");
      const lvls=(s.party||[]).map(p=>p.lvl||1);
      const maxlvl=lvls.length?Math.max.apply(null,lvls):1;
      const loc=(s.mapKey&&MAPS[s.mapKey]?MAPS[s.mapKey].name:"the wilds");
      const when=new Date(s.ts||Date.now());
      const date=when.toLocaleDateString(undefined,{month:"short",day:"numeric"})+" "+
                 when.toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
      return {names,maxlvl,gold:s.gold||0,loc,date};
    }catch(e){ return {names:"your party",maxlvl:1,gold:0,loc:"the wilds",date:""}; }
  }
  function rebuildLogDOM(){
    try{
      const el=document.getElementById("log"); if(!el) return;
      el.innerHTML="";
      (G.log||[]).forEach(entry=>{
        const p=document.createElement("p");
        if(entry.cls) p.className=entry.cls;
        p.textContent=entry.msg;
        el.appendChild(p);
      });
      el.scrollTop=el.scrollHeight;
    }catch(e){}
  }

  const API = {
    available: lsAvailable,
    has(){ try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; } },
    meta(){
      try{ const raw=localStorage.getItem(SAVE_KEY); if(!raw) return null; return summarise(JSON.parse(raw)); }
      catch(e){ return null; }
    },
    save(opts){
      opts=opts||{};
      if(!lsAvailable()){ if(!opts.silent) log("Saving is unavailable in this browser/session.","bad"); return false; }
      if(G.mode==="combat"){ if(!opts.silent) log("You cannot save in the thick of battle.","bad"); return false; }
      if(!G.party || !G.party.length){ return false; }
      try{
        localStorage.setItem(SAVE_KEY, JSON.stringify(snapshot()));
        if(!opts.silent) log("\u2714 Game saved.","good");
        return true;
      }catch(e){
        if(!opts.silent) log("Save failed: "+((e&&e.name==="QuotaExceededError")?"storage is full.":"unexpected error."),"bad");
        return false;
      }
    },
    autosave(){
      if(G.mode!=="town" && G.mode!=="dungeon") return;
      if(!G.party || !G.party.length) return;
      API.save({silent:true});
    },
    load(opts){
      opts=opts||{};
      let raw;
      try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){ raw=null; }
      if(!raw){ if(!opts.silent) log("No saved game was found.","bad"); return false; }
      let s;
      try{ s=JSON.parse(raw); }catch(e){ if(!opts.silent) log("The saved game is corrupted.","bad"); return false; }
      if(!s || s.v!==VERSION){ if(!opts.silent) log("That save is from an incompatible version.","bad"); return false; }
      const map = (s.mapKey && MAPS[s.mapKey]) ? MAPS[s.mapKey] : null;
      if(!map){ if(!opts.silent) log("The saved location no longer exists.","bad"); return false; }
      // ---- restore state ----
      G.party = Array.isArray(s.party) ? s.party : [];
      if(typeof recalcAC==="function") G.party.forEach(p=>{ try{ recalcAC(p); }catch(e){} });
      G.gold = s.gold || 0;
      G.activePC = s.activePC || 0;
      G.visited = s.visited || {};
      G.flags = s.flags || {};
      G.defeatedFixed = s.defeatedFixed || {};
      G.log = Array.isArray(s.log) ? s.log.slice() : [];
      G.combat = null;
      G.map = map;
      G.px = s.px; G.py = s.py; G.dir = s.dir || 0;
      G.mode = (map.kind==="town") ? "town" : "dungeon";
      // ---- refresh the world ----
      if(typeof revealAround==="function") revealAround();
      if(typeof camSync==="function") camSync(true);
      if(typeof markInput==="function") markInput();
      rebuildLogDOM();
      if(typeof renderAll==="function") renderAll();
      if(typeof updateHUD==="function") updateHUD();
      log("\u00BB Game loaded \u2014 "+map.name+".","sys");
      return true;
    },
    wipe(){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} }
  };

  window.SaveSystem = API;
  // wrappers for inline onclick handlers
  window.saveGame = function(){ API.save(); };
  window.loadGame = function(){ if(API.load()){ if(typeof closeOverlay==="function") closeOverlay(); } };
})();
/* ===== END Save / Load system ===== */

/* ===== INJECTED: Stairs-down DEMO (optional — set STAIRS_DEMO=false to remove) =====
   Carves a serpent-arch stairway into the west wall of the town great hall
   (same row as your start, just walk left) that descends into a small
   undercroft and loops back up. This is only a showcase of the stairs-down
   doorway mechanic; flip the flag below to false to remove it entirely.       */
const STAIRS_DEMO = false;
if (STAIRS_DEMO) try {
  // small landing room reached by the stairs
  MAPS.undercroft = {
    name:"The Undercroft", kind:"dungeon", w:5, h:5,
    grid:[
      "#####",
      "#...#",
      "#.U.#",
      "#...#",
      "#####",
    ],
    start:[2,3], startDir:0,
    exits:{ "2,2":"town" },   // the up-stair returns to the great hall
  };
  // carve a '>' into the great hall's west wall, same row as the party start
  const col = 1, row = 5, g = MAPS.town.grid;
  if (g && g[row] && g[row][col] !== ">") {
    g[row] = g[row].substring(0,col) + ">" + g[row].substring(col+1);
  }
  MAPS.town.down = Object.assign(MAPS.town.down || {}, { [col+","+row]: "undercroft" });
} catch(e){ console.error("stairs demo:", e); }
/* ===== END Stairs-down DEMO ===== */

boot();
</script>
